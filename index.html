    function selectCrop(cropId) {
      playSfx('click');
      selectedCropId = cropId;
      renderCropSelector();
      setTool(currentTool);
    }

    function renderCropSelector() {
      document.getElementById('cropSelectorBar').innerHTML = CROP_LIST.map((c) => `
        <button class="crop-chip ${c.id === selectedCropId ? 'selected' : ''}" onclick="selectCrop('${c.id}')">
          <span>🌱</span>
          <span>${c.name} (${formatBRL(c.plantCostHa)}/ha)</span>
        </button>
      `).join('');
    }

    function advanceMonth(fromAuto = false) {
      state.monthIndex = (state.monthIndex + 1) % 12;
      if (state.monthIndex === 0) {
        state.year += 1;
      }

      playSfx('month');
      const curSeason = getSeasonInfo(state.monthIndex);
      if (!fromAuto) {
        showToast(`Avançou para ${MONTHS[state.monthIndex]} · Ano ${state.year} (${curSeason.name} acaba em ${curSeason.endsMonth})`);
      }

      state.tiles.forEach((tile, idx) => {
        const tx = idx % TOTAL_TILE_COLS;
        const ty = Math.floor(idx / TOTAL_TILE_COLS);
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        if (isContractHectare(hr * HA_COLS + hc)) return;
        if (tile.state === 'planted' && tile.cropId) {
          const c = CROPS[tile.cropId];
          if (tile.growthMonths < c.monthsToGrow) {
            tile.growthMonths += 1;
          }
        }
      });

      ensureAtLeastOneActivePaddock();
      const paddocksBefore = getPasturePaddocks();
      const activePaddocks = paddocksBefore.filter(p => p.isActive && !p.isDegraded);
      const activeMembers = activePaddocks.flatMap(p => p.members);
      const activeMemberIds = new Set(activeMembers.map(m => m.id));

      state.hectares.forEach(h => {
        if (!h.owned || getHectareFacilityType(h) !== 'pasture') return;
        if (!activeMemberIds.has(h.id)) {
          h.restMonths = (h.restMonths || 0) + 1;
          h.grassLevel = Math.min(100, (h.grassLevel ?? 100) + Math.ceil(100 / PASTURE_REGROWTH_MONTHS));
          if (h.pastureDegraded && h.restMonths >= PASTURE_REGROWTH_MONTHS) {
            h.pastureDegraded = false;
            h.grassLevel = 100;
          }
        }
      });

      if (Array.isArray(state.cattle) && state.cattle.length > 0) {
        const grazingAnimals = state.cattle.filter(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
        const grainAnimals = state.cattle.filter(a => Boolean(LIVESTOCK_TYPES[a.type]?.requiresGrain));

        const grazingUA = +grazingAnimals.reduce((sum, a) => sum + getAnimalUA(a), 0).toFixed(2);
        const activeAreaHa = activeMembers.length;
        const activeCapacityUA = activeAreaHa * UA_CAPACITY_PER_HA;
        const hasActivePasture = activeAreaHa > 0;

        let totalSilageNeeded = 0;
        grazingAnimals.forEach(a => {
          const spec = LIVESTOCK_TYPES[a.type] || LIVESTOCK_TYPES.boi;
          totalSilageNeeded += spec.silageKgPerMonth * (getAnimalUA(a) / Math.max(0.15, spec.uaWeight || 0.65));
        });

        let silageCoverage = 0;
        if (grazingAnimals.length > 0 && state.useSilageToSavePasture !== false && (state.silageKg || 0) > 0 && totalSilageNeeded > 0) {
          const usedKg = Math.min(state.silageKg, totalSilageNeeded);
          state.silageKg = +(state.silageKg - usedKg).toFixed(1);
          silageCoverage = Math.min(1, usedKg / totalSilageNeeded);
        }

        let pastureQualityMult = 0;
        if (grazingAnimals.length > 0) {
          if (hasActivePasture) {
            const effectiveUAOnPasture = grazingUA * (1 - silageCoverage * 0.80);
            const loadRatio = effectiveUAOnPasture / Math.max(0.5, activeCapacityUA);
            const drainPct = Math.max(4, Math.round(18 * loadRatio));

            activeMembers.forEach(m => {
              m.restMonths = 0;
              m.grassLevel = Math.max(0, (m.grassLevel ?? 100) - drainPct);
              if (m.grassLevel <= 0) {
                m.pastureDegraded = true;
                m.pastureActive = false;
                m.restMonths = 0;
              }
            });

            const avgGrass = activeMembers.reduce((s, m) => s + (m.grassLevel ?? 0), 0) / activeAreaHa;
            const basePastureSupport = Math.min(1.05, (activeCapacityUA / Math.max(0.2, grazingUA)) * (0.45 + 0.55 * (avgGrass / 100)));
            pastureQualityMult = Math.min(1.1, Math.max(0.35, basePastureSupport + silageCoverage * 0.65));

            if (activeMembers.some(m => m.pastureDegraded)) {
              playSfx('error');
              showToast('⚠️ Pasto acabou! Revezar para outro piquete (3 meses p/ rebrotar).');
            }
          } else if (silageCoverage >= 0.6) {
            pastureQualityMult = 0.85;
          }
        }

        const canSustainGrazing = grazingAnimals.length === 0 || hasActivePasture || silageCoverage >= 0.6;

        let totalGrainNeeded = 0;
        grainAnimals.forEach(a => {
          const spec = LIVESTOCK_TYPES[a.type];
          totalGrainNeeded += spec.grainSacksMonth || 0;
        });

        let hasEnoughGrain = true;
        if (grainAnimals.length > 0) {
          const grainCheck = consumeGrainFromSilo(totalGrainNeeded);
          hasEnoughGrain = grainCheck.ok;
          if (!hasEnoughGrain) {
            playSfx('error');
            showToast(`⚠️ Sem grãos suficientes no Silo (${totalGrainNeeded.toFixed(1)} sc necessários): porcos/galinhas pausados.`);
          }
        }

        let milkProducedNow = 0;
        let woolProducedNow = 0;
        let eggsProducedNow = 0;
        const newbornCalves = [];
        const adultBullsCount = state.cattle.filter(a => a.type === 'boi' && (a.ageMonths || 14) >= 14).length;

        state.cattle.forEach((animal) => {
          const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
          animal.ageMonths = (animal.ageMonths || 12) + 1;

          if (spec.requiresGrain) {
            if (!hasEnoughGrain) {
              animal.arrobas = Math.max(spec.startArrobas, +(animal.arrobas - 0.1).toFixed(2));
              return;
            }
            animal.arrobas = +Math.min(spec.maxArrobas, animal.arrobas + spec.gainBaseMonth).toFixed(2);
            if (spec.eggsDozensMonth > 0 && (animal.ageMonths || 6) >= 5) {
              eggsProducedNow += spec.eggsDozensMonth;
            }
            return;
          }

          if (!canSustainGrazing) {
            animal.arrobas = Math.max(spec.startArrobas, +(animal.arrobas - 0.2).toFixed(2));
            return;
          }

          const fedSilage = silageCoverage >= 0.5;
          const gain = (spec.gainBaseMonth + (fedSilage ? spec.gainSilageBonus * silageCoverage : 0)) * pastureQualityMult;
          animal.arrobas = +Math.min(spec.maxArrobas, animal.arrobas + gain).toFixed(2);

          if (spec.woolKgMonth > 0 && (animal.ageMonths || 12) >= 6) {
            woolProducedNow += spec.woolKgMonth * (0.7 + 0.3 * pastureQualityMult);
          }

          if (animal.type === 'vaca') {
            const milkMult = (1 + 0.35 * silageCoverage) * pastureQualityMult;
            if ((animal.ageMonths || 24) >= 20) {
              milkProducedNow += spec.milkLitersMonth * milkMult;
            }

            if ((animal.ageMonths || 24) >= 18) {
              if (animal.pregnantMonths && animal.pregnantMonths > 0) {
                animal.pregnantMonths += 1;
                if (animal.pregnantMonths >= 9) {
                  animal.pregnantMonths = 0;
                  animal.monthsSinceCalving = 0;
                  const isFemale = Math.random() < 0.5;
                  newbornCalves.push({
                    id: Date.now() + Math.random(),
                    type: isFemale ? 'vaca' : 'boi',
                    arrobas: 1.3,
                    ageMonths: 0,
                    pregnantMonths: 0,
                    monthsSinceCalving: 12
                  });
                }
              } else {
                animal.monthsSinceCalving = (animal.monthsSinceCalving ?? 12) + 1;
                if (animal.monthsSinceCalving >= 3 && pastureQualityMult >= 0.65) {
                  const conceptionChance = adultBullsCount > 0 ? 0.38 : 0.22;
                  if (Math.random() < conceptionChance) {
                    animal.pregnantMonths = 1;
                  }
                }
              }
            }
          }
        });

        if (grazingAnimals.length > 0 && !canSustainGrazing) {
          playSfx('error');
          showToast('⚠️ Rebanho sem pasto ativo e sem silagem suficiente: produção pausada e sem ganho de peso.');
        }

        if (newbornCalves.length > 0) {
          state.cattle.push(...newbornCalves);
          playSfx('animal');
          showToast(`🐮 Nasceu ${newbornCalves.length} bezerro(s) no rebanho!`);
        }

        if (milkProducedNow > 0) {
          state.milkLiters = +((state.milkLiters || 0) + milkProducedNow).toFixed(1);
        }

        if (woolProducedNow > 0) {
          state.woolKg = +((state.woolKg || 0) + woolProducedNow).toFixed(2);
        }

        if (eggsProducedNow > 0) {
          state.eggsDozens = +((state.eggsDozens || 0) + eggsProducedNow).toFixed(1);
        }
      }

      if (!state.activeContract) {
        state.availableContracts = generateAvailableContracts(state.hectares, state.monthIndex);
      }

      updateHUD();
      if (selectedTileKeys.size > 0 && currentTool !== 'harvest') {
        prepareAreaActionConfirmation();
      }
      renderWorld();
    }

    function rescaleActiveTasksOnSpeedChange() {
      const speedMult = getActiveSpeedMultiplier();
      (state.activeTasks || []).forEach(task => {
        const areaHa = (task.tileKeys?.length || TILES_PER_HA) / TILES_PER_HA;
        const baseTotal = getWorkDurationSeconds(task.type, areaHa);
        const currentRatio = task.totalSeconds > 0 ? (task.remainingSeconds / task.totalSeconds) : 1;
        const newTotal = Math.max(1, Math.round(baseTotal / speedMult));
        task.totalSeconds = newTotal;
        task.remainingSeconds = Math.max(1, Math.round(newTotal * currentRatio));
      });
    }

    function toggleAuto10s() {
      playSfx('click');
      const btn = document.getElementById('btnAuto10s');
      if (auto10sTimer) {
        clearInterval(auto10sTimer);
        auto10sTimer = null;
        btn.textContent = '⏱️ 10s/Mês: OFF';
        btn.classList.remove('active-timer');
        rescaleActiveTasksOnSpeedChange();
        showToast('Tempo automático 10s pausado');
      } else {
        auto10sSeconds = 10;
        btn.textContent = '⏱️ 10s/Mês: 10s';
        btn.classList.add('active-timer');
        rescaleActiveTasksOnSpeedChange();
        showToast(`Modo teste ativo (${TEST_MODE_WORK_SPEEDUP}x nos serviços)`);
        auto10sTimer = setInterval(() => {
          auto10sSeconds -= 1;
          if (auto10sSeconds <= 0) {
            auto10sSeconds = 10;
            advanceMonth(true);
            btn.textContent = '⏱️ 10s/Mês: 10s';
          } else {
            btn.textContent = `⏱️ 10s/Mês: ${auto10sSeconds}s`;
          }
        }, 1000);

      if (selectedTileKeys.size > 0 && currentTool !== 'harvest') {
        prepareAreaActionConfirmation();
      }

              const tName = { plow: 'Aração', plant: 'Plantio', care: 'Cuidado', harvest: 'Colheita' }[t.type] || 'Serviço';
              const haQty = ((t.tileKeys || []).length / TILES_PER_HA).toFixed(2);

                <div class="machine-card">
                  <div class="machine-info">
                    <strong>⏳ ${tName} em andamento (${haQty} ha)</strong>

                  </div>
                </div>
              `;
            }).join('')
          : `<p class="confirm-sub">Nenhum trabalho temporizado rodando no momento.</p>`;

        body.innerHTML = `
          <h4 style="margin:4px 0 6px;">Serviços em Andamento (Tempo Real)</h4>
          ${runningTasksHtml}

          <h4 style="margin:10px 0 6px;">Contratos em Terrenos Vizinhos</h4>
          <p class="confirm-sub">Trabalhe em talhões de vizinhos (arar, semear, pulverizar ou colher) usando suas máquinas para lucrar mais. O pagamento cai na hora ao completar <strong>100%</strong> da área.</p>
          ${activeHtml}
          ${state.availableContracts.map((srv) => {
            const isThisActive = state.activeContract && state.activeContract.id === srv.id;
            const hasActive = Boolean(state.activeContract);
            return `
              <div class="machine-card">
                <div class="machine-info">
                  <strong>${srv.title}</strong>
                  <small>${srv.desc}</small><br/>
                  <small>Pagamento líquido ao concluir: <strong>${formatBRL(srv.reward)}</strong></small>
                </div>
                <button class="action-btn ${hasActive ? 'secondary' : 'gold'}" onclick="acceptServiceContract('${srv.id}')" ${hasActive ? 'disabled style="opacity:0.5;"' : ''}>
                  ${isThisActive ? 'Em Andamento' : 'Aceitar'}

              </div>
            `;
          }).join('')}

          <h4 style="margin:12px 0 6px;">Oficina & Save do Jogo</h4>
          <p class="confirm-sub">Desgaste atual das máquinas: <strong>${state.machineWear || 0}%</strong> (aumenta ao arar, cuidar e colher; revisão zera o desgaste).</p>
          <div class="field-row">
            <button class="action-btn gold" onclick="repairMachinery()">Revisar Oficina (${formatBRL(Math.max(1500, (state.machineWear || 0) * 180))})</button>
            <button class="action-btn" onclick="saveGame()">Salvar</button>
            <button class="action-btn gold" onclick="loadGame()">Carregar</button>
            <button class="action-btn danger" onclick="resetGame()">Novo Jogo</button>
          </div>
        `;
      }

      backdrop.classList.add('open');
    }

    function recalcSimulator() {
      const cropId = document.getElementById('simCrop')?.value || 'soja';
      const ha = Math.max(0.25, Number(document.getElementById('simHa')?.value) || 1);
      const modeId = document.getElementById('simTransport')?.value || state.transportMode;
      const crop = CROPS[cropId];
      const econ = getPlantAreaEconomics(crop, state.monthIndex, ha, false, modeId);
      const installmentPerHarvest = state.loans.reduce((s, l) => s + l.installmentAmount, 0);
      const afterLoanProfit = econ.estimatedProfit - installmentPerHarvest;

      const box = document.getElementById('simResultBox');
      const verdict = document.getElementById('simVerdict');
      if (!box || !verdict) return;

      box.innerHTML = `
        <div class="summary-box"><span>Investimento Total Ciclo</span><strong>${formatBRL(econ.totalCycleCost)}</strong></div>
        <div class="summary-box"><span>Lucro Est. da Safra</span><strong class="${econ.estimatedProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(econ.estimatedProfit)}</strong></div>
        <div class="summary-box"><span>Parcelas Empréstimo/Safra</span><strong>${formatBRL(installmentPerHarvest)}</strong></div>
        <div class="summary-box"><span>Sobra p/ Pagar Empréstimo</span><strong class="${afterLoanProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(afterLoanProfit)}</strong></div>
      `;

      if (installmentPerHarvest === 0) {
        verdict.textContent = `${crop.name}: ${econ.seasonLabel} (ideal: ${getBestSeasonNames(crop)}) · ${econ.sacks.toFixed(1)} sc · Receita bruta ${formatBRL(econ.grossRevenue)}.`;
      } else if (afterLoanProfit >= 0) {
        verdict.innerHTML = `<span class="profit-pos">Cobre as parcelas:</span> o lucro estimado cobre os ${formatBRL(installmentPerHarvest)} da safra e ainda sobra ${formatBRL(afterLoanProfit)}.`;
      } else {
        verdict.innerHTML = `<span class="profit-neg">Atenção:</span> o lucro estimado não cobre os ${formatBRL(installmentPerHarvest)} de parcelas desta safra (falta ${formatBRL(Math.abs(afterLoanProfit))}).`;
      }
    }

    function changeTransportMode(newMode) {
      if (TRANSPORT_MODES[newMode]) {
        playSfx('click');
        state.transportMode = newMode;
        showToast(`Transporte alterado para ${TRANSPORT_MODES[newMode].name}`);
        if (selectedTileKeys.size > 0 && currentTool !== 'harvest') {
          prepareAreaActionConfirmation();
        }
        closeModal();
        openModal('silo');
      }
    }

    function buyMachine(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || (Array.isArray(state.ownedMachines) && state.ownedMachines.includes(itemId)) || state.money < item.price) {
        playSfx('error');
        showToast('Saldo insuficiente para este equipamento.');
        return;
      }
      state.money -= item.price;
      state.ownedMachines = state.ownedMachines || [];
      state.ownedMachines.push(itemId);
      updateHUD();
      setTool(currentTool);
      playSfx('coin');
      showToast(`Comprou ${item.name}! Custos reduzidos.`);
      closeModal();
      openModal('shop', activeShopTab);
    }

    function leaseMachine(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || ownsItem(itemId)) return;
      if (state.money < item.rentPerHarvest) {
        playSfx('error');
        showToast(`Saldo insuficiente para aluguel (${formatBRL(item.rentPerHarvest)}).`);
        return;
      }
      state.money -= item.rentPerHarvest;
      state.leasedMachines = state.leasedMachines || [];
      state.leasedMachines.push({
        itemId: item.id,
        name: item.name,
        rentPerHarvest: item.rentPerHarvest,
        harvestsLeft: 2
      });
      updateHUD();
      setTool(currentTool);
      playSfx('coin');
      showToast(`Alugou ${item.name} por 2 colheitas!`);
      closeModal();
      openModal('shop', activeShopTab);
    }

    function buyAuctionLot(lotId) {
      const lot = USED_AUCTION_LOTS.find(l => l.lotId === lotId);
      if (!lot) return;
      const baseItem = SHOP_ITEMS.find(i => i.id === lot.itemId);
      if (!baseItem) return;
      const usedPrice = Math.round(baseItem.price * (1 - lot.discountPct / 100));
      if (state.money < usedPrice) {
        playSfx('error');
        showToast(`Saldo insuficiente para o leilão (${formatBRL(usedPrice)}).`);
        return;
      }
      state.money -= usedPrice;
      state.ownedMachines = state.ownedMachines || [];
      if (!state.ownedMachines.includes(baseItem.id)) {
        state.ownedMachines.push(baseItem.id);
      }
      state.claimedAuctionLots = state.claimedAuctionLots || [];
      state.claimedAuctionLots.push(lot.lotId);
      state.machineWear = Math.min(100, Math.max(state.machineWear || 0, lot.initialWear));
      updateHUD();
      setTool(currentTool);
      playSfx('coin');
      showToast(`Arrematou ${baseItem.name} por ${formatBRL(usedPrice)}!`);
      closeModal();
      openModal('shop', 'auction');
    }

    function focusContractField() {
      const c = state.activeContract;
      if (!c) return;
      closeModal();
      const rect = worldViewport.getBoundingClientRect();
      const targetZoom = Math.min(1.6, Math.max(0.75, (Math.min(rect.width, rect.height) - 20) / HA_PX));
      zoom = +targetZoom.toFixed(2);
      const centerWorldX = c.hc * HA_PX + HA_PX / 2;
      const centerWorldY = c.hr * HA_PX + HA_PX / 2;
      camX = rect.width / 2 - centerWorldX * zoom;
      camY = rect.height / 2 - centerWorldY * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function acceptServiceContract(srvId) {
      if (state.activeContract) {
        playSfx('error');
        showToast('Você já tem um contrato ativo.');
        return;
      }
      const srv = (state.availableContracts || []).find(s => s.id === srvId);
      if (!srv) return;
      const ha = state.hectares.find(h => h.id === srv.haId);
      if (!ha || ha.owned) {
        state.availableContracts = generateAvailableContracts(state.hectares, state.monthIndex);
        openModal('save');
        return;
      }

      playSfx('done');
      state.activeContract = { ...srv, progress: 0 };
      setupContractField(state.activeContract);
      if (srv.task === 'plant') {
        selectCrop(srv.cropId);
      }
      setTool(srv.task);
      focusContractField();
      showToast(`Contrato aceito! Vá ao talhão (${srv.hc + 1},${srv.hr + 1}) e faça o serviço.`);
    }

    function cancelActiveContract() {
      if (!state.activeContract) return;
      playSfx('click');
      clearContractField(state.activeContract.haId);
      state.activeContract = null;
      state.availableContracts = generateAvailableContracts(state.hectares, state.monthIndex);
      renderWorld();
      showToast('Contrato cancelado.');
      openModal('save');
    }

    function getLoanCalculation(principal, installments) {
      const maxLimit = getMaxLoanLimit();
      const cleanP = Math.max(0, Math.min(maxLimit, Math.round(principal || 0)));
      const inst = Math.max(2, Math.min(4, Number(installments) || 3));
      const interestRate = 0.02 * inst;
      const totalWithInterest = Math.round(cleanP * (1 + interestRate));
      const installmentAmount = Math.round(totalWithInterest / inst);
      return { cleanP, inst, interestRate, totalWithInterest, installmentAmount, maxLimit };
    }

    function previewLoanTerms() {
      const box = document.getElementById('loanPreviewBox');
      const btn = document.getElementById('btnTakeLoan');
      if (!box) return;
      const p = Number(document.getElementById('loanPrincipal')?.value) || 0;
      const inst = Number(document.getElementById('loanInstallments')?.value) || 3;
      const calc = getLoanCalculation(p, inst);
      const atLimit = state.loans.length >= 2;
      const validAmount = calc.cleanP >= 2000 && calc.cleanP <= calc.maxLimit;

      box.innerHTML = `
        <span>Resumo Antes de Aceitar (${(calc.interestRate * 100).toFixed(0)}% juros · Limite patrimônio: ${formatBRL(calc.maxLimit)})</span>
        <strong>Parcela por colheita: ${formatBRL(calc.installmentAmount)} (${calc.inst}x de ${formatBRL(calc.installmentAmount)} · Total ${formatBRL(calc.totalWithInterest)})</strong>
      `;
      if (btn) {
        const ok = !atLimit && validAmount;
        btn.disabled = !ok;
        btn.style.opacity = ok ? '1' : '0.5';
      }
    }

    function takeHarvestLoan() {
      if (state.loans.length >= 2) {
        playSfx('error');
        showToast('Limite atingido: máximo de 2 empréstimos ativos.');
        return;
      }
      const maxLimit = getMaxLoanLimit();
      const principal = Math.round(Number(document.getElementById('loanPrincipal').value) || 0);
      const installments = Number(document.getElementById('loanInstallments').value) || 3;
      if (principal < 2000 || principal > maxLimit) {
        playSfx('error');
        showToast(`Valor permitido pelo patrimônio: entre R$ 2.000 e ${formatBRL(maxLimit)}.`);
        return;
      }
      const calc = getLoanCalculation(principal, installments);

      state.money += calc.cleanP;
      state.loans.push({
        id: Date.now() + Math.random(),
        principal: calc.cleanP,
        totalWithInterest: calc.totalWithInterest,
        remainingBalance: calc.totalWithInterest,
        installmentsLeft: calc.inst,
        installmentAmount: calc.installmentAmount
      });

      updateHUD();
      playSfx('coin');
      showToast(`Empréstimo aceito: ${calc.inst}x de ${formatBRL(calc.installmentAmount)} após colher.`);
      closeModal();
      openModal('finance', 'loans');
    }

    function payOneInstallment(loanId) {
      const idx = state.loans.findIndex((l) => l.id === loanId);
      if (idx === -1) return;
      const loan = state.loans[idx];
      const pay = Math.min(loan.installmentAmount, loan.remainingBalance);
      if (state.money < pay) {
        playSfx('error');
        showToast('Saldo insuficiente para pagar a parcela.');
        return;
      }
      state.money -= pay;
      loan.remainingBalance -= pay;
      loan.installmentsLeft -= 1;
      if (loan.remainingBalance <= 0 || loan.installmentsLeft <= 0) {
        state.loans.splice(idx, 1);
      }
      updateHUD();
      playSfx('coin');
      showToast(`Pagou parcela de ${formatBRL(pay)}!`);
      closeModal();
      openModal('finance', 'loans');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function onBackdropClick(e) {
      if (e.target.id === 'modalBackdrop') {
        playSfx('click');
        closeModal();
      }
    }

    function sellCrop(cropId) {
      const crop = CROPS[cropId];
      const qty = Number(document.getElementById(`sellQty_${cropId}`).value);
      if (!Number.isFinite(qty) || qty <= 0 || qty > state.silo[cropId] + 1e-6) {
        playSfx('error');
        showToast('Quantidade inválida no Silo!');
        return;
      }

      if (!ownsItem('caminhao_proprio')) {
        const mode = TRANSPORT_MODES[state.transportMode] || TRANSPORT_MODES.camionete;
        if (qty < mode.minSacks || qty > mode.maxSacks) {
          playSfx('error');
          showToast(`${mode.name} leva de ${mode.minSacks} a ${mode.maxSacks} sacas por viagem.`);
          return;
        }
      }

      const rate = getTransportRatePerSack(state.transportMode);
      const gross = qty * crop.prices[state.monthIndex];
      const freight = qty * rate;
      const net = Math.round(gross - freight);
      state.silo[cropId] = Math.max(0, +(state.silo[cropId] - qty).toFixed(2));
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${qty} sc · Frete ${formatBRL(freight)} · Líquido: ${formatBRL(net)}`);
      closeModal();
      openModal('silo');
    }

    function saveGame() {
      localStorage.setItem('fazendaPixelSafraReal_RS_v3', JSON.stringify(state));
      playSfx('done');
      showToast('Jogo salvo!');
    }

    function loadGame() {
      const raw = localStorage.getItem('fazendaPixelSafraReal_RS_v3');
      if (!raw) {
        playSfx('error');
        showToast('Nenhum save encontrado!');
        return;
      }
      state = JSON.parse(raw);
      if (!Array.isArray(state.activeTasks)) state.activeTasks = [];
      if (typeof state.woolKg !== 'number') state.woolKg = 0;
      if (typeof state.eggsDozens !== 'number') state.eggsDozens = 0;
      state.hectares.forEach(h => {
        if (!h.facilityType && h.isPasture) h.facilityType = 'pasture';
      });
      clearSelection();
      updateHUD();
      renderWorld();
      playSfx('done');
      showToast('Save carregado!');
    }

    function resetGame() {
      localStorage.removeItem('fazendaPixelSafraReal_RS_v3');
      state = createInitialState();
      clearSelection();
      updateHUD();
      focusMainHectare();
      closeModal();
      playSfx('click');
      showToast('Fazenda reiniciada!');
    }

    function updateHUD() {
      document.getElementById('hudMoney').textContent = formatBRL(state.money);
      const ownedCount = state.hectares.filter((h) => h.owned).length;
      document.getElementById('hudHectares').textContent = `${ownedCount} / 100`;
      const s = getSeasonInfo(state.monthIndex);
      document.getElementById('hudDateChip').textContent = `${s.icon} ${MONTHS[state.monthIndex]} · Ano ${state.year}`;
      const totalSacks = Object.values(state.silo).reduce((a, b) => a + b, 0);
      document.getElementById('hudSiloChip').textContent = `🌾 Silo: ${totalSacks.toFixed(1)} sc`;
      const cattleChip = document.getElementById('hudLivestockChip');
      if (cattleChip) {
        cattleChip.textContent = `🐄 Rebanho: ${(state.cattle || []).length}`;
      }

      let hasRipe = false;
      for (let i = 0; i < state.tiles.length; i++) {
        const t = state.tiles[i];
        if (t.state === 'planted' && t.cropId && t.growthMonths >= CROPS[t.cropId].monthsToGrow) {
          hasRipe = true;
          break;
        }
      }
      document.querySelector('[data-tool="harvest"]').classList.toggle('harvest-ready', hasRipe);
    }

    function convertHectareFacility(haId, facilityType) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || !ha.owned || getHectareFacilityType(ha)) return;
      const costMap = { pasture: FENCE_COST_HA, coop: COOP_COST_HA, sty: STY_COST_HA };
      const nameMap = { pasture: 'Pasto', coop: 'Galinheiro', sty: 'Chiqueiro' };
      const cost = costMap[facilityType] ?? FENCE_COST_HA;

      if (state.money < cost) {
        playSfx('error');
        showToast(`Saldo insuficiente para ${nameMap[facilityType]} (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;

      if (facilityType === 'pasture') {
        const hadAnyActivePasture = state.hectares.some(h => h.owned && getHectareFacilityType(h) === 'pasture' && h.pastureActive === true && !h.pastureDegraded);
        setHectareFacility(ha, 'pasture');
        ha.paddockGroupId = ha.id;
        ha.grassLevel = 100;
        ha.restMonths = 0;
        ha.pastureDegraded = false;
        ha.pastureActive = !hadAnyActivePasture;
      } else {
        setHectareFacility(ha, facilityType);
      }

      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          state.tiles[ty * TOTAL_TILE_COLS + tx] = { state: 'raw', cropId: null, growthMonths: 0, cared: false, lastCropId: null, monocultureCount: 0 };
        }
      }
      updateHUD();
      renderWorld();
      playSfx('done');
      showToast(`Hectare (${ha.hc + 1},${ha.hr + 1}) transformado em ${nameMap[facilityType]}!`);
      openModal('livestock');
    }

    function clearHectareFacility(haId) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || !ha.owned) return;
      const fac = getHectareFacilityType(ha);
      if (!fac) return;

      if (fac === 'pasture') {
        const pastureCount = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'pasture').length;
        const hasGrazing = (state.cattle || []).some(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
        if (pastureCount <= 1 && hasGrazing) {
          playSfx('error');
          showToast('Venda ou transfira os animais de pasto antes de remover o último pasto.');
          return;
        }
        const wasActive = ha.pastureActive;
        setHectareFacility(ha, null);
        ha.paddockGroupId = ha.id;
        if (wasActive && hasGrazing) {
          const nextReady = getPasturePaddocks().find(p => !p.isDegraded);
          if (nextReady) {
            nextReady.members.forEach(m => { m.pastureActive = true; });
          }
        }
      } else if (fac === 'coop') {
        const coopCount = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'coop').length;
        const chickenCount = (state.cattle || []).filter(a => a.type === 'galinha').length;
        if (coopCount <= 1 && chickenCount > 0) {
          playSfx('error');
          showToast('Venda as galinhas antes de remover o último galinheiro.');
          return;
        }
        setHectareFacility(ha, null);
      } else if (fac === 'sty') {
        const styCount = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'sty').length;
        const pigCount = (state.cattle || []).filter(a => a.type === 'porco').length;
        if (styCount <= 1 && pigCount > 0) {
          playSfx('error');
          showToast('Venda os porcos antes de remover o último chiqueiro.');
          return;
        }
        setHectareFacility(ha, null);
      }

      playSfx('click');
      renderWorld();
      showToast(`Hectare (${ha.hc + 1},${ha.hr + 1}) voltou para lavoura.`);
      openModal('livestock');
    }

    function mergePaddocks(paddockIdA, paddockIdB) {
      const paddocks = getPasturePaddocks();
      const pA = paddocks.find(p => p.id === paddockIdA);
      const pB = paddocks.find(p => p.id === paddockIdB);
      if (!pA || !pB || pA.id === pB.id) return;

      const newGroupId = Math.min(pA.id, pB.id);
      const anyActive = pA.isActive || pB.isActive;
      [...pA.members, ...pB.members].forEach(m => {
        m.paddockGroupId = newGroupId;
        if (anyActive && !m.pastureDegraded) {
          m.pastureActive = true;
        }
      });

      playSfx('done');
      renderWorld();
      showToast(`Pastos juntados (${pA.areaHa + pB.areaHa} ha)!`);
      openModal('livestock');
    }

    function splitPaddock(paddockId) {
      const paddocks = getPasturePaddocks();
      const target = paddocks.find(p => p.id === paddockId);
      if (!target || target.members.length <= 1) return;

      target.members.forEach((m, idx) => {
        m.paddockGroupId = m.id;
        if (target.isActive) {
          m.pastureActive = (idx === 0);
        }
      });

      playSfx('click');
      renderWorld();
      showToast('Pastos separados novamente em hectares individuais!');
      openModal('livestock');
    }

    function moveCattleToPaddock(destPaddockId) {
      const paddocks = getPasturePaddocks();
      const dest = paddocks.find(p => p.id === destPaddockId);
      if (!dest) return;
      if (dest.isDegraded) {
        playSfx('error');
        showToast(`Este pasto precisa de descanso (${dest.restMonths}/3 meses) para rebrotar.`);
        return;
      }
      paddocks.forEach(p => {
        const isDest = (p.id === destPaddockId);
        p.members.forEach(m => { m.pastureActive = isDest; });
      });
      playSfx('animal');
      renderWorld();
      showToast(`Rebanho movido para o pasto selecionado (${dest.areaHa} ha)!`);
      openModal('livestock');
    }

    function restAndMoveCattle(sourcePaddockId) {
      const sel = document.getElementById(`destPaddock_${sourcePaddockId}`);
      const destId = sel ? Number(sel.value) : null;
      if (destId == null || Number.isNaN(destId)) {
        playSfx('error');
        showToast('Selecione para qual pasto deseja mover os animais.');
        return;
      }
      moveCattleToPaddock(destId);
    }

    function toggleSilageFeeding() {
      playSfx('click');
      state.useSilageToSavePasture = !(state.useSilageToSavePasture !== false);
      showToast(state.useSilageToSavePasture ? 'Silagem liberada no cocho (poupa o pasto)' : 'Uso de silagem pausado');
      openModal('livestock');
    }

    function makeSilageFromCorn(sacksToUse) {
      if (!ownsItem('ensiladeira_forragem')) {
        playSfx('error');
        showToast('Compre ou alugue a Ensiladeira na Loja primeiro.');
        return;
      }
      const avail = state.silo.milho || 0;
      const qty = Math.min(avail, sacksToUse);
      if (qty < 1) {
        playSfx('error');
        showToast('Você precisa de pelo menos 1 saca de Milho no silo.');
        return;
      }
      const cost = Math.round(qty * SILAGE_PROCESS_COST_PER_SACK);
      if (state.money < cost) {
        playSfx('error');
        showToast(`Saldo insuficiente para picar silagem (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;
      state.silo.milho = +(state.silo.milho - qty).toFixed(2);
      const kgAdded = Math.round(qty * SILAGE_KG_PER_CORN_SACK);
      state.silageKg = (state.silageKg || 0) + kgAdded;
      updateHUD();
      playSfx('done');
      showToast(`Produziu ${kgAdded} kg de silagem com ${qty.toFixed(1)} sc de milho!`);
      openModal('livestock');
    }

    function buyAnimal(type) {
      const spec = LIVESTOCK_TYPES[type];
      if (!spec) return;

      if (spec.facilityType === 'coop') {
        const cap = getCoopCapacity();
        const curCount = (state.cattle || []).filter(a => a.type === 'galinha').length;
        if (cap <= 0) {
          playSfx('error');
          showToast('Transforme ao menos 1 hectare em Galinheiro antes de comprar galinhas.');
          return;
        }
        if (curCount + 1 > cap) {
          playSfx('error');
          showToast(`Galinheiro cheio (${cap} galinhas). Transforme outro hectare em Galinheiro.`);
          return;
        }
      } else if (spec.facilityType === 'sty') {
        const cap = getStyCapacity();
        const curCount = (state.cattle || []).filter(a => a.type === 'porco').length;
        if (cap <= 0) {
          playSfx('error');
          showToast('Transforme ao menos 1 hectare em Chiqueiro antes de comprar porcos.');
          return;
        }
        if (curCount + 1 > cap) {
          playSfx('error');
          showToast(`Chiqueiro cheio (${cap} porcos). Transforme outro hectare em Chiqueiro.`);
          return;
        }
      } else {
        const paddocks = getPasturePaddocks();
        if (paddocks.length === 0) {
          playSfx('error');
          showToast('Transforme ao menos 1 hectare em Pasto antes de comprar bois, vacas ou ovelhas.');
          return;
        }
        ensureAtLeastOneActivePaddock();
        const totalPastureHa = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'pasture').length;
        const maxUAWithSilage = totalPastureHa * UA_CAPACITY_PER_HA * ((state.silageKg || 0) >= 300 ? 1.8 : 1.0);
        const addedUA = Math.max(0.05, +(spec.uaWeight * Math.max(0.5, spec.startArrobas / (spec.startArrobas || 5))).toFixed(2));
        const nextUA = getTotalHerdUA() + addedUA;
        if (nextUA > maxUAWithSilage + 0.1) {
          playSfx('error');
          showToast(`Lotação limite (${UA_CAPACITY_PER_HA} UA/ha)! Abra mais pasto ou produza silagem.`);
          return;
        }
      }

      if (state.money < spec.buyPrice) {
        playSfx('error');
        showToast(`Saldo insuficiente (${formatBRL(spec.buyPrice)}).`);
        return;
      }
      state.money -= spec.buyPrice;
      state.cattle = state.cattle || [];
      state.cattle.push({
        id: Date.now() + Math.random(),
        type: spec.id,
        arrobas: spec.startArrobas,
        ageMonths: spec.id === 'vaca' ? 24 : 12,
        pregnantMonths: 0,
        monthsSinceCalving: 12
      });
      updateHUD();
      renderWorld();
      playSfx('animal');
      showToast(`Comprou ${spec.name}!`);
      openModal('livestock');
    }

    function sellAnimal(animalId, mode) {
      const idx = (state.cattle || []).findIndex(a => a.id === animalId);
      if (idx === -1) return;
      const animal = state.cattle[idx];
      const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
      if (mode === 'butcher' && animal.arrobas < spec.minButcherArrobas) {
        playSfx('error');
        showToast(`Peso mínimo para açougue: ${spec.minButcherArrobas}@.`);
        return;
      }
      const pricePerArroba = mode === 'butcher' ? BUTCHER_PRICE_PER_ARROBA : LIVE_CATTLE_PRICE_PER_ARROBA;
      const freight = ownsItem('caminhao_boiadeiro') ? spec.freightOwn : spec.freightBase;
      const net = Math.max(0, Math.round(animal.arrobas * pricePerArroba - freight));

      state.cattle.splice(idx, 1);
      state.money += net;
      updateHUD();
      renderWorld();
      playSfx('coin');
      showToast(`Vendeu (${mode === 'butcher' ? 'Açougue' : 'Vivo Criação'}) por ${formatBRL(net)} líquido!`);
      openModal('livestock');
    }

    function sellAllMilk() {
      const liters = state.milkLiters || 0;
      if (liters < 10) {
        playSfx('error');
        showToast('Mínimo de 10 litros no tanque para coleta.');
        return;
      }
      const freightPerL = ownsItem('caminhao_leite') ? 0.08 : 0.32;
      const net = Math.round(liters * (MILK_PRICE_PER_LITER - freightPerL));
      state.milkLiters = 0;
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${liters.toFixed(0)} L de leite por ${formatBRL(net)} líquido!`);
      openModal('livestock');
    }

    function sellAllWool() {
      const kg = state.woolKg || 0;
      if (kg < 0.5) {
        playSfx('error');
        showToast('Mínimo de 0.5 kg de lã para venda.');
        return;
      }
      const net = Math.round(kg * WOOL_PRICE_PER_KG);
      state.woolKg = 0;
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${kg.toFixed(2)} kg de lã por ${formatBRL(net)}!`);
      openModal('livestock');
    }

    function sellAllEggs() {
      const dz = state.eggsDozens || 0;
      if (dz < 1) {
        playSfx('error');
        showToast('Mínimo de 1 dúzia de ovos para venda.');
        return;
      }
      const net = Math.round(dz * EGG_PRICE_PER_DOZEN);
      state.eggsDozens = 0;
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${dz.toFixed(1)} dúzias de ovos por ${formatBRL(net)}!`);
      openModal('livestock');
    }

    function repairMachinery() {
      const wear = state.machineWear || 0;
      if (wear <= 0) {
        playSfx('click');
        showToast('Máquinas já estão revisadas.');
        return;
      }
      const cost = Math.max(1500, wear * 180);
      if (state.money < cost) {
        playSfx('error');
        showToast(`Saldo insuficiente para revisão (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;
      state.machineWear = 0;
      updateHUD();
      playSfx('done');
      showToast(`Oficina concluída (${formatBRL(cost)})! Eficiência 100%.`);
      closeModal();
      openModal('save');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    setInterval(() => {
      tickBackgroundWork(1);
    }, 1000);

    window.addEventListener('resize', resizeCanvas);

    renderCropSelector();
    setTool('plow');
    updateHUD();
    resizeCanvas();
    focusMainHectare();
  </script>
</body>
</html>

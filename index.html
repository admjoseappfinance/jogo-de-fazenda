<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fazenda Pixel - Safra Real (RS)</title>
  <style>
    :root {
      --bg-green: #69a73b;
      --bg-dot: #5a942f;
      --wood-pill: #5b381a;
      --wood-pill-border: #3a210c;
      --wood-frame: #8f582c;
      --wood-frame-dark: #4c2b11;
      --card-cream: #fbf5e6;
      --card-cream-border: #d9caa8;
      --gold-accent: #f2b729;
      --teal-pill: #1c5347;
      --teal-border: #10362e;
      --text-dark: #3b2310;
      --text-muted: #75583c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-green);
      background-image: radial-gradient(var(--bg-dot) 3px, transparent 3px);
      background-size: 26px 26px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      touch-action: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 10px max(22px, calc(env(safe-area-inset-bottom) + 16px));
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    /* TOP HUD */
    .top-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-pills-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pills-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-controls-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px 5px 7px;
      border-radius: 13px;
      background: linear-gradient(180deg, #684120 0%, var(--wood-pill) 100%);
      border: 2.5px solid var(--wood-pill-border);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 232, 185, 0.22);
      color: #fff8e7;
      cursor: pointer;
    }

    .stat-pill.teal {
      background: linear-gradient(180deg, #246355 0%, var(--teal-pill) 100%);
      border-color: var(--teal-border);
    }

    .stat-pill-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .stat-pill-icon.coin {
      background: radial-gradient(circle at 30% 30%, #ffe980, #e39510);
      border: 2px solid #8c5203;
      color: #5e3500;
      font-weight: 900;
    }

    .stat-pill-texts {
      display: flex;
      flex-direction: column;
      line-height: 1.08;
    }

    .stat-pill-label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ebd3a7;
    }

    .stat-pill.teal .stat-pill-label {
      color: #a9e3d4;
    }

    .stat-pill-val {
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
    }

    .cream-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 12px;
      background: linear-gradient(180deg, #fffdf7 0%, #f1e6ce 100%);
      border: 2px solid #8c6239;
      box-shadow: 0 2.5px 0 rgba(48, 28, 10, 0.32);
      color: var(--text-dark);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .cream-btn.muted {
      background: #e6dcc7;
      opacity: 0.78;
    }

    .cream-btn:active {
      transform: translateY(1px);
    }

    .top-sub-row {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .top-sub-row::-webkit-scrollbar {
      display: none;
    }

    .orange-square-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9px;
      background: linear-gradient(180deg, #f59c27 0%, #c8640b 100%);
      border: 2px solid #592b05;
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 5px 8px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fffdf7 0%, #f2e7cf 100%);
      border: 2px solid #8c6239;
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.25);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
      white-space: nowrap;
    }

    /* CENTER WORLD CANVAS */
    .world-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 6px;
      border-radius: 18px;
      background: linear-gradient(180deg, #d5a570 0%, #9b6434 100%);
      border: 3px solid var(--wood-frame-dark);
      box-shadow:
        0 6px 0 rgba(36, 58, 20, 0.42),
        inset 0 2px 0 rgba(255, 236, 204, 0.6);
      display: flex;
      position: relative;
    }

    .world-inner {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: 2.5px solid #693f1b;
      overflow: hidden;
      position: relative;
      background: #5ca32e;
    }

    canvas#farmCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    canvas#farmCanvas.pan-mode {
      cursor: grab;
    }

    .cam-controls {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 15;
    }

    .cam-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fffdf7 0%, #efe3c8 100%);
      border: 2.5px solid #5b381a;
      box-shadow: 0 2.5px 0 rgba(48, 28, 10, 0.35);
      color: var(--text-dark);
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cam-btn:active {
      transform: translateY(1px);
    }

    .cam-btn.active {
      background: #ffe885;
      border-color: #9e6504;
      box-shadow: 0 0 0 2px var(--gold-accent);
    }

    .zoom-pill {
      background: rgba(91, 56, 26, 0.94);
      color: #fff8e7;
      border: 1.5px solid #3a210c;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      padding: 2px 3px;
    }

    .sector-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 14;
      background: rgba(91, 56, 26, 0.92);
      border: 2px solid #3a210c;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
      color: #fff8e7;
      padding: 5px 11px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
    }

    /* CONFIRMATION DRAWER */
    .confirm-card {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: min(96%, 430px);
      z-index: 22;
      background: var(--card-cream);
      border: 3px solid var(--wood-pill);
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      gap: 7px;
    }

    .confirm-card.open {
      display: flex;
    }

    .confirm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
      border-bottom: 1.5px solid var(--card-cream-border);
      padding-bottom: 5px;
    }

    .confirm-summary-big {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .summary-box {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-box span {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .summary-box strong {
      font-size: 13px;
      font-weight: 900;
    }

    .confirm-sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .profit-pos { color: #1b6919; font-weight: 900; }
    .profit-neg { color: #a82319; font-weight: 900; }

    /* BOTTOM DOCK */
    .bottom-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 20;
      flex-shrink: 0;
    }

    .crop-selector-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      background: rgba(91, 56, 26, 0.95);
      border: 2px solid var(--wood-pill-border);
      padding: 4px 8px;
      border-radius: 999px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    }

    .crop-selector-bar.visible {
      display: inline-flex;
    }

    .crop-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--card-cream);
      border: 2px solid transparent;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
    }

    .crop-chip.selected {
      background: #ffe999;
      border-color: var(--gold-accent);
    }

    .dock-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 460px;
      padding: 6px;
      border-radius: 17px;
      background: linear-gradient(180deg, #6e4522 0%, var(--wood-pill) 100%);
      border: 2.5px solid var(--wood-pill-border);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 232, 185, 0.18);
    }

    .tool-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 4px 6px;
      border-radius: 12px;
      background: linear-gradient(180deg, #c2b8a3 0%, #9b917c 100%);
      border: 2.5px solid #635a49;
      box-shadow: 0 2.5px 0 #4d4537, inset 0 1px 0 rgba(255, 255, 255, 0.45);
      color: #fffdf7;
      cursor: pointer;
    }

    .tool-card:active {
      transform: translateY(1.5px);
      box-shadow: 0 1px 0 #4d4537;
    }

    .tool-card.active {
      background: linear-gradient(180deg, #d99b52 0%, #b5732b 100%);
      border-color: var(--gold-accent);
      box-shadow: 0 2.5px 0 #73430e, 0 0 10px rgba(242, 183, 41, 0.65);
    }

    .tool-card.harvest-ready {
      border-color: #54e03b;
      box-shadow: 0 2.5px 0 #266919, 0 0 10px rgba(84, 224, 59, 0.55);
    }

    .tool-icon-svg {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-card-label {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(25, 16, 6, 0.75);
      line-height: 1;
    }

    .hint-bar {
      font-size: 11px;
      font-weight: 800;
      color: #f6ffed;
      text-shadow: 0 1px 2px rgba(20, 44, 10, 0.8);
      text-align: center;
      line-height: 1.15;
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(22, 36, 15, 0.65);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: min(94vw, 560px);
      max-height: 84dvh;
      overflow-y: auto;
      background: var(--card-cream);
      border: 4px solid var(--wood-pill);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      padding: 16px;
      color: var(--text-dark);
      font-size: 13px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-cream-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .close-x {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #c9463d;
      border: 2px solid #5c1813;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 6px 10px;
      border-radius: 9px;
      border: 2px solid var(--wood-frame);
      background: #efe5cf;
      color: var(--text-dark);
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--wood-pill);
      color: #fff8e7;
    }

    .machine-card {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .machine-info strong {
      display: block;
      font-size: 13px;
    }

    .machine-info small {
      color: var(--text-muted);
      font-size: 11px;
    }

    table.farm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #fffdf7;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--card-cream-border);
      margin-bottom: 10px;
    }

    table.farm-table th, table.farm-table td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid #eadec4;
    }

    table.farm-table th {
      background: var(--wood-pill);
      color: #fff6df;
      font-weight: 800;
    }

    .price-high { background: #dff2d8; color: #1e5e18; font-weight: 800; }
    .price-mid { background: #fcf0cc; color: #755309; }
    .price-low { background: #f9d8d4; color: #8c231b; }

    .action-btn {
      padding: 6px 11px;
      border-radius: 9px;
      border: 2px solid #2b4f18;
      background: linear-gradient(180deg, #62a838 0%, #458223 100%);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn.secondary {
      background: #ede3cc;
      border-color: var(--wood-frame);
      color: var(--text-dark);
    }

    .action-btn.gold {
      background: linear-gradient(180deg, #f5b92a 0%, #c98a0c 100%);
      border-color: #634103;
      color: #2b1a02;
    }

    .action-btn.danger {
      background: linear-gradient(180deg, #d44c42 0%, #a32c24 100%);
      border-color: #54120e;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    input[type="number"], select {
      padding: 6px 8px;
      border-radius: 8px;
      border: 2px solid var(--wood-frame);
      background: #fff;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--wood-pill);
      color: #fff8e7;
      border: 2px solid var(--gold-accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOP HUD -->
    <header class="top-area">
      <div class="top-pills-row">
        <div class="pills-left">
          <div class="stat-pill" onclick="playSfx('click'); openModal('finance')" title="Financeiro, Empréstimos e Simulador">
            <div class="stat-pill-icon coin">$</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">CAIXA</span>
              <span class="stat-pill-val" id="hudMoney">R$ 45.000</span>
            </div>
          </div>

          <div class="stat-pill teal" onclick="playSfx('click'); focusMainHectare()" title="Hectares Próprios">
            <div class="stat-pill-icon">🌽</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">HECTARES</span>
              <span class="stat-pill-val" id="hudHectares">1 / 100</span>
            </div>
          </div>
        </div>

        <div class="top-controls-right">
          <button class="cream-btn" id="btnSoundToggle" onclick="toggleSound()" title="Ligar ou desligar sons do jogo">
            🔊 Som: ON
          </button>
        </div>
      </div>

      <div class="top-sub-row">
        <button class="cream-btn" onclick="playSfx('click'); fitAllHectares()" title="Ver todos os 100 hectares">
          🗺️ Mapa Completo
        </button>
        <button class="orange-square-btn" onclick="playSfx('click'); openModal('help')" title="Ajuda">?</button>

        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('silo')" id="hudSiloChip">
          🌾 Silo: 0.0 sc
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('livestock')" id="hudLivestockChip">
          🐄 Rebanho: 0
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('shop')">
          🚜 Loja
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('prices')">
          📊 Tabela
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('save')">
          💾
        </div>
      </div>
    </header>

    <!-- CENTER WORLD CANVAS -->
    <main class="world-frame">
      <div class="world-inner" id="worldViewport">
        <canvas id="farmCanvas"></canvas>

        <div class="sector-badge" id="sectorBadge">
          Hectare Principal (5,5) · 100 ha
        </div>

        <div class="cam-controls">
          <button class="cam-btn" onclick="playSfx('click'); zoomBy(1.28)" title="Aproximar Zoom">+</button>
          <div class="zoom-pill" id="zoomReadout">100%</div>
          <button class="cam-btn" onclick="playSfx('click'); zoomBy(0.78)" title="Afastar Zoom">−</button>
          <button class="cam-btn" id="btnPanToggle" onclick="playSfx('click'); togglePanMode()" title="Mover Câmera (1 dedo)">✋</button>
          <button class="cam-btn" onclick="playSfx('click'); focusMainHectare()" title="Centralizar Fazenda">🏡</button>
        </div>

        <!-- CONFIRMATION DRAWER -->
        <div class="confirm-card" id="confirmCard">
          <div class="confirm-header">
            <span id="confirmTitle">Confirmar Ação</span>
            <button class="close-x" onclick="playSfx('click'); clearSelection()">✕</button>
          </div>
          <div class="confirm-summary-big" id="confirmSummaryBoxes"></div>
          <div class="confirm-sub" id="confirmSubInfo"></div>
          <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:2px;">
            <button class="action-btn secondary" onclick="playSfx('click'); clearSelection()">Cancelar</button>
            <button class="action-btn" id="confirmExecuteBtn" onclick="executeConfirmedAction()">Confirmar</button>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM DOCK -->
    <footer class="bottom-area">
      <div class="crop-selector-bar" id="cropSelectorBar"></div>

      <div class="dock-container">
        <button class="tool-card active" data-tool="plow" onclick="playSfx('click'); setTool('plow')">
          <div class="tool-icon-svg">
            <svg width="24" height="24" viewBox="0 0 32 32">
              <path d="M8 24 L20 12" stroke="#8f5422" stroke-width="4" stroke-linecap="round"/>
              <path d="M15 7 L25 13 L21 17 L13 11 Z" fill="#9fb3c8" stroke="#3b4f63" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="tool-card-label">Arar</span>
        </button>

        <button class="tool-card" data-tool="plant" onclick="playSfx('click'); setTool('plant')">
          <div class="tool-icon-svg">

    let soundEnabled = true;

    function getAudioContext() {
      if (!soundEnabled) return null;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) {
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freqStart, freqEnd, duration, type = 'sine', gainPeak = 0.08, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, now);
      if (freqEnd !== null && freqEnd !== freqStart) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(gainPeak, now + Math.min(0.015, duration * 0.2));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playNoiseBurst(duration, filterFreq = 900, gainPeak = 0.07, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime + delay;
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.Q.setValueAtTime(1.2, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(gainPeak, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(now);
      src.stop(now + duration + 0.02);
    }

    function getHectareFacilityType(ha) {
      if (!ha || !ha.owned) return null;
      if (ha.facilityType === 'coop' || ha.facilityType === 'sty' || ha.facilityType === 'pasture') {
        return ha.facilityType;
      }

      ha.facilityType = type;
      ha.isPasture = (type === 'pasture');
      if (type !== 'pasture') {
        ha.pastureActive = false;
        ha.pastureDegraded = false;
        ha.grassLevel = 100;
      }

      const styHa = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'sty').length;

    function getTotalGrainSacksInSilo() {
      if (!state || !state.silo) return 0;
      const grainKeys = ['milho', 'trigo', 'sorgo', 'aveia', 'soja', 'canola'];
      return +grainKeys.reduce((sum, k) => sum + Math.max(0, Number(state.silo[k] || 0)), 0).toFixed(2);
    }

    function consumeGrainFromSilo(neededSacks) {
      let rem = Math.max(0, Number(neededSacks || 0));
      if (rem <= 0) return { ok: true, consumed: 0 };
      const available = getTotalGrainSacksInSilo();
      if (available + 1e-6 < rem) {
        return { ok: false, consumed: 0 };
      }
      const order = ['milho', 'sorgo', 'trigo', 'aveia', 'soja', 'canola'];
      for (const k of order) {
        if (rem <= 1e-6) break;
        const cur = Math.max(0, Number(state.silo[k] || 0));
        if (cur > 0) {
          const take = Math.min(cur, rem);
          state.silo[k] = +(cur - take).toFixed(2);
          rem = +(rem - take).toFixed(2);
        }
      }
      return { ok: true, consumed: +((neededSacks || 0) - rem).toFixed(2) };
    }

    function getAnimalUA(animal) {
      const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
      return Math.max(0.05, +(spec.uaWeight * Math.max(0.5, animal.arrobas / (spec.startArrobas || 5))).toFixed(2));

      const grazing = (state.cattle || []).filter(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');

    function getPasturePaddocks() {
      const groups = new Map();
      state.hectares.forEach(h => {
        if (!h.owned || getHectareFacilityType(h) !== 'pasture') return;
        const gid = h.paddockGroupId != null ? h.paddockGroupId : h.id;
        if (!groups.has(gid)) groups.set(gid, []);
        groups.get(gid).push(h);
      });

      const paddocks = [];
      groups.forEach((members, gid) => {
        members.sort((a, b) => a.id - b.id);
        const minGrass = Math.min(...members.map(m => (typeof m.grassLevel === 'number' ? m.grassLevel : 100)));
        const isDegraded = members.some(m => m.pastureDegraded);
        const isActive = members.some(m => m.pastureActive === true && !m.pastureDegraded);

        paddocks.push({
          id: gid,
          members,
          areaHa: members.length,
          capacityUA: +(members.length * UA_CAPACITY_PER_HA).toFixed(1),
          grassLevel: Math.round(minGrass),
          isDegraded,
          isActive
        });
      });

      paddocks.sort((a, b) => a.members[0].id - b.members[0].id);
      return paddocks;
    }

    function ensureAtLeastOneActivePaddock() {
      const paddocks = getPasturePaddocks();
      if (paddocks.length === 0) return;
      const hasActive = paddocks.some(p => p.isActive && !p.isDegraded);
      const hasGrazingAnimals = (state.cattle || []).some(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
      if (!hasActive && !hasGrazingAnimals) {

        if (ready) {
          ready.members.forEach(m => {
            m.pastureActive = true;
          });
        }
      }
    }

    function getPlowCostHa() {
      const base = ownsItem('trator_aracao') ? Math.round(BASE_PLOW_HA * 0.50) : BASE_PLOW_HA;
      return Math.round(base * (1 + ((state.machineWear || 0) / 300)));
    }

    function getCareCostHa() {
      const base = ownsItem('pulverizador_cuidado') ? Math.round(BASE_CARE_HA * 0.50) : BASE_CARE_HA;
      return Math.round(base * (1 + ((state.machineWear || 0) / 300)));
    }

    function getHarvestCostHa() {
      const base = ownsItem('colheitadeira_graos') ? Math.round(BASE_HARVEST_HA * 0.45) : BASE_HARVEST_HA;
      return Math.round(base * (1 + ((state.machineWear || 0) / 220)));
    }

    function getTransportRatePerSack(modeId = state.transportMode) {
      if (ownsItem('caminhao_proprio')) return 2.5;
      const mode = TRANSPORT_MODES[modeId] || TRANSPORT_MODES.camionete;
      return mode.rentPerSack;
    }

    function getFarmEquity() {
      const landVal = state.hectares.filter(h => h.owned).reduce((s, h) => s + (h.price || 14000), 0);
      const machVal = (state.ownedMachines || []).reduce((s, id) => {
        const it = SHOP_ITEMS.find(x => x.id === id);
        return s + (it ? Math.round(it.price * 0.65) : 0);
      }, 0);
      const siloVal = CROP_LIST.reduce((s, c) => s + ((state.silo[c.id] || 0) * c.pricePerSack), 0);
      return Math.round(landVal + machVal + siloVal);
    }

    function getMaxLoanLimit() {
      const equity = getFarmEquity();
      return Math.max(12000, Math.min(85000, Math.round(equity * 0.50)));
    }

    function getPlantAreaEconomics(crop, areaHa, withCare = false, modeId = state.transportMode) {
      const plantCost = Math.round(areaHa * crop.plantCostHa);
      const plowCost = Math.round(areaHa * getPlowCostHa());
      const careCost = withCare ? Math.round(areaHa * getCareCostHa()) : 0;
      const harvestCost = Math.round(areaHa * getHarvestCostHa());
      const limeBonus = ownsItem('calcaria_adubo') ? 1.15 : 1.0;
      const sacks = +(areaHa * (crop.baseYieldPerHa + (withCare ? crop.careBonusYieldPerHa : 0)) * limeBonus).toFixed(2);
      const transportCost = Math.round(sacks * getTransportRatePerSack(modeId));
      const totalCycleCost = plantCost + plowCost + careCost + harvestCost + transportCost;
      const grossRevenue = Math.round(sacks * crop.pricePerSack);
      const estimatedProfit = grossRevenue - totalCycleCost;

      return {
        plantCost,
        sacks,
        transportCost,
        totalCycleCost,
        grossRevenue,
        estimatedProfit
      };
    }

    function generateAvailableContracts(hectaresList, seedIndex = 0) {
      const candidates = hectaresList.filter(h => !h.owned);
      if (candidates.length === 0) return [];
      const sorted = [...candidates].sort((a, b) => {
        const da = Math.abs(a.hc - 4) + Math.abs(a.hr - 4);
        const db = Math.abs(b.hc - 4) + Math.abs(b.hr - 4);
        return da - db;
      });
      const pool = sorted.slice(0, Math.min(18, sorted.length));
      const picked = [];
      const usedIds = new Set();
      const tasks = ['plow', 'plant', 'care', 'harvest'];

      for (let i = 0; i < 3 && pool.length > 0; i++) {
        let ha = pool[Math.floor(Math.random() * pool.length)];
        let tries = 0;
        while (usedIds.has(ha.id) && tries < 12) {
          ha = pool[Math.floor(Math.random() * pool.length)];
          tries++;
        }
        usedIds.add(ha.id);

        const task = tasks[(i + Math.floor(Math.random() * tasks.length)) % tasks.length];
        const crop = CROP_LIST[Math.floor(Math.random() * CROP_LIST.length)];
        const neighbor = NEIGHBOR_NAMES[(ha.id + seedIndex + i) % NEIGHBOR_NAMES.length];

        let title = '';
        let reward = 0;
        let desc = '';

        if (task === 'plow') {
          title = `Arar Talhão (${ha.hc + 1},${ha.hr + 1})`;
          reward = 950;
          desc = `${neighbor}: Prepare toda a terra (1 ha) do talhão (${ha.hc + 1},${ha.hr + 1}) usando Arar.`;
        } else if (task === 'plant') {
          title = `Semear ${crop.name} (${ha.hc + 1},${ha.hr + 1})`;
          reward = Math.round(crop.plantCostHa + 850);
          desc = `${neighbor}: Semeie ${crop.name} no talhão (${ha.hc + 1},${ha.hr + 1}). Reembolsa semente e paga o serviço.`;
        } else if (task === 'care') {
          title = `Pulverizar ${crop.name} (${ha.hc + 1},${ha.hr + 1})`;
          reward = 1150;
          desc = `${neighbor}: Aplique defensivo/adubo com Cuidar no talhão (${ha.hc + 1},${ha.hr + 1}).`;
        } else {
          title = `Colher ${crop.name} (${ha.hc + 1},${ha.hr + 1})`;
          reward = 1450;
          desc = `${neighbor}: Colha a lavoura pronta do talhão (${ha.hc + 1},${ha.hr + 1}) com Colher Tudo.`;
        }

        picked.push({
          id: `fs_${Date.now()}_${i}_${ha.id}`,
          task,
          cropId: crop.id,
          haId: ha.id,
          hc: ha.hc,
          hr: ha.hr,
          neighbor,
          title,
          reward,
          desc,
          progress: 0
        });
      }
      return picked;
    }

    function setupContractField(contract) {
      const ha = state.hectares.find(h => h.id === contract.haId);
      if (!ha) return;
      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (contract.task === 'plow') {
            t.state = 'raw';
            t.cropId = null;
            t.ripe = false;
            t.cared = false;
          } else if (contract.task === 'plant') {
            t.state = 'plowed';
            t.cropId = null;
            t.ripe = false;
            t.cared = false;
          } else if (contract.task === 'care') {
            t.state = 'planted';
            t.cropId = contract.cropId;
            t.ripe = false;
            t.cared = false;
          } else if (contract.task === 'harvest') {
            const c = CROPS[contract.cropId] || CROPS.soja;
            t.state = 'planted';
            t.cropId = c.id;
            t.ripe = true;
            t.cared = true;
          }
        }
      }
    }

    function clearContractField(haId) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || ha.owned) return;
      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          state.tiles[ty * TOTAL_TILE_COLS + tx] = {
            state: 'raw',
            cropId: null,
            ripe: false,
            cared: false,
            lastCropId: null,
            monocultureCount: 0
          };
        }
      }
    }

    function evaluateActiveContractProgress() {
      const c = state.activeContract;
      if (!c) return;
      const ha = state.hectares.find(h => h.id === c.haId);
      if (!ha) return;

      let done = 0;
      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (c.task === 'plow' && t.state === 'plowed') done++;
          else if (c.task === 'plant' && t.state === 'planted' && t.cropId === c.cropId) done++;
          else if (c.task === 'care' && t.state === 'planted' && t.cared) done++;
          else if (c.task === 'harvest' && t.state === 'plowed' && !t.cropId) done++;
        }
      }

      c.progress = Math.round((done / TILES_PER_HA) * 100);
      if (done >= TILES_PER_HA) {
        const payout = c.reward;
        state.money += payout;
        clearContractField(c.haId);
        state.activeContract = null;
        state.availableContracts = generateAvailableContracts(state.hectares, state.contractsCompleted + 1);
        state.contractsCompleted = (state.contractsCompleted || 0) + 1;
        updateHUD();
        renderWorld();
        playSfx('coin');
        showToast(`✅ Contrato concluído (100%)! Recebeu ${formatBRL(payout)} de ${c.neighbor}.`);
      }
    }

    function createInitialState() {
      const hectares = [];
      for (let hr = 0; hr < HA_ROWS; hr++) {
        for (let hc = 0; hc < HA_COLS; hc++) {
          const idx = hr * HA_COLS + hc;
          const soilQuality = ((hc * 7 + hr * 13) % 5) / 4;
          const price = Math.round(12500 + soilQuality * 9500);
          const isMain = (hc === 4 && hr === 4);
          hectares.push({
            id: idx,
            hc,
            hr,
            owned: isMain,
            price,
            isPasture: false,
            facilityType: null,
            paddockGroupId: idx,
            grassLevel: 100,
            pastureActive: false,
            pastureDegraded: false
          });
        }
      }

      const tiles = new Array(TOTAL_TILE_COLS * TOTAL_TILE_ROWS).fill(null).map((_, i) => {
        const tx = i % TOTAL_TILE_COLS;
        const ty = Math.floor(i / TOTAL_TILE_COLS);
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        const lx = tx % SUB_SIZE;
        const ly = ty % SUB_SIZE;

        if (hc === 4 && hr === 4) {
          const isPlanted = (lx >= 1 && lx <= 6) && (ly >= 1 && ly <= 6) && !(lx >= 3 && lx <= 6 && ly === 3);
          const isPlowed = (lx >= 1 && lx <= 6) && (ly >= 1 && ly <= 6);
          if (isPlanted) {
            return { state: 'planted', cropId: 'milho', ripe: true, cared: true, lastCropId: null, monocultureCount: 0 };
          }
          if (isPlowed) {
            return { state: 'plowed', cropId: null, ripe: false, cared: false, lastCropId: null, monocultureCount: 0 };
          }
        }
        return { state: 'raw', cropId: null, ripe: false, cared: false, lastCropId: null, monocultureCount: 0 };
      });

      return {
        money: INITIAL_CASH,
        transportMode: 'camionete',
        ownedMachines: [],
        leasedMachines: [],
        claimedAuctionLots: [],
        loans: [],
        silo: { soja: 0, milho: 0, trigo: 0, canola: 0, sorgo: 0, aveia: 0 },

      };
    }

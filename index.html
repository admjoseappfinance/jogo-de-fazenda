    }

    function clampCamera() {
      const rect = worldViewport.getBoundingClientRect();
      const viewW = rect.width;
      const viewH = rect.height;
      const scaledMap = MAP_PX * zoom;
      const pad = 80;

      if (scaledMap + pad * 2 <= viewW) {
        camX = (viewW - scaledMap) / 2;
      } else {
        camX = Math.min(pad, Math.max(viewW - scaledMap - pad, camX));
      }

      if (scaledMap + pad * 2 <= viewH) {
        camY = (viewH - scaledMap) / 2;
      } else {
        camY = Math.min(pad, Math.max(viewH - scaledMap - pad, camY));
      }
    }

    function focusMainHectare() {
      const rect = worldViewport.getBoundingClientRect();
      const targetZoom = Math.min(1.45, Math.max(0.65, (Math.min(rect.width, rect.height) - 24) / (HA_PX * 1.15)));
      zoom = +targetZoom.toFixed(2);
      const centerWorldX = 4 * HA_PX + HA_PX / 2;
      const centerWorldY = 4 * HA_PX + HA_PX / 2;
      camX = rect.width / 2 - centerWorldX * zoom;
      camY = rect.height / 2 - centerWorldY * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function fitAllHectares() {
      const rect = worldViewport.getBoundingClientRect();
      const fitZoom = Math.max(MIN_ZOOM, (Math.min(rect.width, rect.height) - 16) / MAP_PX);
      zoom = +fitZoom.toFixed(2);
      camX = (rect.width - MAP_PX * zoom) / 2;
      camY = (rect.height - MAP_PX * zoom) / 2;
      clampCamera();
      updateZoomBadge();
      renderWorld();
      showToast('Mapa completo dos 100 hectares');
    }

    function zoomBy(factor, pivotSx, pivotSy) {
      const rect = worldViewport.getBoundingClientRect();
      const px = pivotSx ?? rect.width / 2;
      const py = pivotSy ?? rect.height / 2;
      const worldBefore = screenToWorld(px, py);
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, +(zoom * factor).toFixed(2)));
      camX = px - worldBefore.x * zoom;
      camY = py - worldBefore.y * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function updateZoomBadge() {
      document.getElementById('zoomReadout').textContent = Math.round(zoom * 100) + '%';
      const rect = worldViewport.getBoundingClientRect();
      const centerWorld = screenToWorld(rect.width / 2, rect.height / 2);
      const hc = Math.min(HA_COLS, Math.max(1, Math.floor(centerWorld.x / HA_PX) + 1));
      const hr = Math.min(HA_ROWS, Math.max(1, Math.floor(centerWorld.y / HA_PX) + 1));
      const label = (hc === 5 && hr === 5) ? 'Hectare Principal (5,5)' : `Hectare (${hc},${hr})`;
      document.getElementById('sectorBadge').textContent = `${label} · 100 ha`;
    }

    function togglePanMode() {
      panModeActive = !panModeActive;
      document.getElementById('btnPanToggle').classList.toggle('active', panModeActive);
      canvas.classList.toggle('pan-mode', panModeActive);
      showToast(panModeActive ? 'Modo Mover Câmera ativado (1 dedo)' : 'Modo Selecionar Área ativado');
    }

    function clearSelection() {
      selectedTileKeys.clear();
      selectedHaIdToBuy = null;
      pendingAction = null;
      document.getElementById('confirmCard').classList.remove('open');
      renderWorld();
    }

    function isContractHectare(haId) {
      return Boolean(state.activeContract && state.activeContract.haId === haId);
    }

    function getBusyTileSet() {
      const busy = new Set();
      (state.activeTasks || []).forEach(task => {
        if (Array.isArray(task.tileKeys)) {
          task.tileKeys.forEach(k => busy.add(k));
        }
      });
      return busy;
    }

    function hasHarvestTaskInProgress() {
      return (state.activeTasks || []).some(t => t.type === 'harvest');
    }

    function selectSingleOrBox(x1, y1, x2, y2) {
      const minX = Math.max(0, Math.min(x1, x2));
      const maxX = Math.min(MAP_PX - 0.01, Math.max(x1, x2));
      const minY = Math.max(0, Math.min(y1, y2));
      const maxY = Math.min(MAP_PX - 0.01, Math.max(y1, y2));

      if (maxX < minX || maxY < minY) return;

      const isSingleTap = Math.hypot(x2 - x1, y2 - y1) < 8;
      if (isSingleTap) {
        const tx = Math.floor(minX / TILE_PX);
        const ty = Math.floor(minY / TILE_PX);
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        const ha = state.hectares[hr * HA_COLS + hc];
        if (!ha.owned && !isContractHectare(ha.id)) {
          selectedTileKeys.clear();
          selectedHaIdToBuy = ha.id;
          playSfx('select');
          prepareBuyHectareConfirmation(ha);
          renderWorld();
          return;
        }
        if (ha.owned && getHectareFacilityType(ha)) {
          selectedTileKeys.clear();
          selectedHaIdToBuy = null;
          playSfx('click');
          openModal('livestock');
          renderWorld();
          return;
        }
      }

      selectedHaIdToBuy = null;
      selectedTileKeys.clear();

      const txMin = Math.floor(minX / TILE_PX);
      const txMax = Math.floor(maxX / TILE_PX);
      const tyMin = Math.floor(minY / TILE_PX);
      const tyMax = Math.floor(maxY / TILE_PX);

      for (let ty = tyMin; ty <= tyMax; ty++) {
        for (let tx = txMin; tx <= txMax; tx++) {
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          if ((ha.owned && !getHectareFacilityType(ha)) || isContractHectare(ha.id)) {
            selectedTileKeys.add(`${tx},${ty}`);
          }
        }
      }

      if (selectedTileKeys.size > 0) {
        playSfx('select');
        prepareAreaActionConfirmation();
      } else {
        document.getElementById('confirmCard').classList.remove('open');
      }
      renderWorld();
    }

    function prepareBuyHectareConfirmation(ha) {
      const canBuy = state.money >= ha.price;
      pendingAction = { type: 'buy_ha', haId: ha.id, cost: ha.price };

      document.getElementById('confirmTitle').textContent = `Comprar Hectare (${ha.hc + 1}, ${ha.hr + 1})`;
      document.getElementById('confirmSummaryBoxes').innerHTML = `
        <div class="summary-box"><span>Valor do Hectare</span><strong>${formatBRL(ha.price)}</strong></div>
        <div class="summary-box"><span>Caixa Após</span><strong class="${canBuy ? 'profit-pos' : 'profit-neg'}">${formatBRL(state.money - ha.price)}</strong></div>
      `;
      document.getElementById('confirmSubInfo').textContent = `1 hectare = 64 blocos (8x8). Caixa atual: ${formatBRL(state.money)}.`;

      const btn = document.getElementById('confirmExecuteBtn');
      btn.disabled = !canBuy;
      btn.style.opacity = canBuy ? '1' : '0.5';
      btn.textContent = canBuy ? 'Comprar' : 'Sem Saldo';
      document.getElementById('confirmCard').classList.add('open');
    }

    function prepareAreaActionConfirmation() {
      const crop = CROPS[selectedCropId];
      const busyTiles = getBusyTileSet();

      const coords = [];
      let blockedCount = 0;
      selectedTileKeys.forEach((key) => {
        if (busyTiles.has(key)) {
          blockedCount++;
          return;
        }
        const [tx, ty] = key.split(',').map(Number);
        coords.push([tx, ty]);
      });

      const activeC = state.activeContract;
      const isContractTile = (tx, ty) => {
        if (!activeC) return false;
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        return (hr * HA_COLS + hc) === activeC.haId;
      };

      let eligible = [];
      let actionCost = 0;
      let titleText = '';
      let btnText = 'Confirmar';
      let boxesHtml = '';
      let subText = '';
      let durationSec = 0;

      if (currentTool === 'plant') {
        eligible = coords.filter(([tx, ty]) => {
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (t.state !== 'plowed') return false;
          if (isContractTile(tx, ty)) {
            return activeC.task === 'plant' && crop.id === activeC.cropId;
          }
          return true;
        });
        const ownCount = eligible.filter(([tx, ty]) => !isContractTile(tx, ty)).length;
        const contractCount = eligible.length - ownCount;
        const areaHa = eligible.length / TILES_PER_HA;
        durationSec = eligible.length > 0 ? computeTaskDurationSeconds('plant', areaHa) : 0;
        const econ = getPlantAreaEconomics(crop, areaHa, false, state.transportMode);
        actionCost = econ.plantCost;

        const busyNote = blockedCount > 0 ? ` · ⏳ ${blockedCount} bloco(s) em serviço` : '';

        if (contractCount > 0 && ownCount === 0) {
          titleText = `Contrato: Semear ${crop.name} (${eligible.length} blocos)`;
          btnText = eligible.length ? 'Iniciar Serviço' : 'Sem Área Livre';
          boxesHtml = `
            <div class="summary-box"><span>Duração (${areaHa.toFixed(2)} ha)</span><strong>${formatDurationSec(durationSec)}</strong></div>
            <div class="summary-box"><span>Pagamento ao Concluir</span><strong class="profit-pos">${formatBRL(activeC.reward)}</strong></div>
          `;
          subText = `Insumo semente: ${formatBRL(actionCost)} (reembolsado). Ao concluir 100%, recebe ${formatBRL(activeC.reward)}${busyNote}.`;
        } else {
          titleText = `Plantar ${crop.name} (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
          btnText = eligible.length ? 'Iniciar Plantio' : (blockedCount > 0 ? 'Área Ocupada' : (activeC && activeC.task === 'plant' ? `Use ${CROPS[activeC.cropId].name}` : 'Are Antes'));

          const repeatCount = eligible.filter(([tx, ty]) => !isContractTile(tx, ty) && state.tiles[ty * TOTAL_TILE_COLS + tx].lastCropId === crop.id).length;
          const rotNote = repeatCount > 0 ? ` · ⚠️ ${repeatCount} bloco(s) repetindo ${crop.name}` : ' · ✅ Boa rotação';

          boxesHtml = `
            <div class="summary-box"><span>Duração Estimada</span><strong>${formatDurationSec(durationSec)}</strong></div>
            <div class="summary-box"><span>Lucro Líquido Est.</span><strong class="${econ.estimatedProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(econ.estimatedProfit)}</strong></div>
          `;
          subText = `Custo: ${formatBRL(econ.plantCost)} · Est. ${econ.sacks.toFixed(1)} sc${rotNote}${busyNote}.`;
        }
      } else if (currentTool === 'plow') {
        eligible = coords.filter(([tx, ty]) => {
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (t.state !== 'raw') return false;
          if (isContractTile(tx, ty)) return activeC.task === 'plow';
          return true;
        });
        const areaHa = eligible.length / TILES_PER_HA;
        durationSec = eligible.length > 0 ? computeTaskDurationSeconds('plow', areaHa) : 0;
        actionCost = Math.round(areaHa * getPlowCostHa());
        titleText = `Arar Área (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
        btnText = eligible.length ? 'Iniciar Aração' : (blockedCount > 0 ? 'Área Ocupada' : 'Nada p/ Arar');

        const busyNote = blockedCount > 0 ? ` · ⏳ ${blockedCount} bloco(s) em serviço` : '';
        boxesHtml = `
          <div class="summary-box"><span>Duração Estimada</span><strong>${formatDurationSec(durationSec)}</strong></div>
          <div class="summary-box"><span>Custo Operacional</span><strong>${formatBRL(actionCost)}</strong></div>
        `;
        subText = `Ritmo: 6 min/ha · Custo: ${formatBRL(getPlowCostHa())}/ha${busyNote}.`;
      } else if (currentTool === 'care') {
        eligible = coords.filter(([tx, ty]) => {
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (t.state !== 'planted' || !t.cropId) return false;
          if (isContractTile(tx, ty)) return activeC.task === 'care' && !t.cared;
          return !t.cared && !t.ripe;
        });
        const areaHa = eligible.length / TILES_PER_HA;
        durationSec = eligible.length > 0 ? computeTaskDurationSeconds('care', areaHa) : 0;
        actionCost = Math.round(areaHa * getCareCostHa());
        titleText = `Cuidar / Pulverizar (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
        btnText = eligible.length ? 'Iniciar Cuidado' : (blockedCount > 0 ? 'Área Ocupada' : 'Nada p/ Cuidar');

        const busyNote = blockedCount > 0 ? ` · ⏳ ${blockedCount} bloco(s) em serviço` : '';
        boxesHtml = `
          <div class="summary-box"><span>Duração Estimada</span><strong>${formatDurationSec(durationSec)}</strong></div>
          <div class="summary-box"><span>Custo Insumo/Máquina</span><strong>${formatBRL(actionCost)}</strong></div>
        `;
        subText = `Ritmo: 10 min/ha · Custo: ${formatBRL(getCareCostHa())}/ha${busyNote}.`;
      }

      const canAfford = eligible.length > 0 && state.money >= actionCost;
      pendingAction = {
        type: currentTool,
        cropId: crop.id,
        coords: eligible,
        cost: actionCost,
        durationSec
      };

      document.getElementById('confirmTitle').textContent = titleText;
      document.getElementById('confirmSummaryBoxes').innerHTML = boxesHtml;
      document.getElementById('confirmSubInfo').textContent = subText;

      const btn = document.getElementById('confirmExecuteBtn');
      btn.disabled = !canAfford;
      btn.style.opacity = canAfford ? '1' : '0.5';
      btn.textContent = !eligible.length ? btnText : (state.money >= actionCost ? btnText : 'Sem Saldo');
      document.getElementById('confirmCard').classList.add('open');
    }

    function executeConfirmedAction() {
      if (!pendingAction) return;
      const act = pendingAction;

      if (act.type === 'buy_ha') {
        const ha = state.hectares[act.haId];
        if (!ha || ha.owned || state.money < ha.price) {
          playSfx('error');
          return;
        }
        state.money -= ha.price;
        ha.owned = true;
        clearSelection();
        updateHUD();
        renderWorld();
        playSfx('coin');
        showToast(`Comprou Hectare (${ha.hc + 1},${ha.hr + 1})!`);
        return;
      }

      if (!act.coords || !act.coords.length) {
        playSfx('error');
        showToast('Nenhum bloco válido e livre selecionado.');
        return;
      }

      if (state.money < act.cost) {
        playSfx('error');
        showToast('Saldo insuficiente para iniciar o serviço.');
        return;
      }

      const busyTiles = getBusyTileSet();
      const freeCoords = act.coords.filter(([tx, ty]) => !busyTiles.has(`${tx},${ty}`));
      if (freeCoords.length === 0) {
        playSfx('error');
        showToast('Esses blocos já estão com serviço em andamento!');
        return;
      }

      const areaHa = freeCoords.length / TILES_PER_HA;
      const durationSec = computeTaskDurationSeconds(act.type, areaHa);
      const scaledCost = Math.round(act.cost * (freeCoords.length / act.coords.length));

      state.money -= scaledCost;
      state.activeTasks = state.activeTasks || [];
      state.activeTasks.push({
        id: `task_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        type: act.type,
        cropId: act.cropId || null,
        tileKeys: freeCoords.map(([tx, ty]) => `${tx},${ty}`),
        totalSeconds: durationSec,
        remainingSeconds: durationSec,
        costPaid: scaledCost
      });

      const labelMap = { plow: 'Aração', plant: 'Plantio', care: 'Cuidado' };
      const sfxStartMap = { plow: 'plow_start', plant: 'plant_start', care: 'care_start' };
      playSfx(sfxStartMap[act.type] || 'click');
      clearSelection();
      updateHUD();
      renderWorld();
      showToast(`⏳ ${labelMap[act.type] || 'Serviço'} iniciado (${formatDurationSec(durationSec)})`);
    }

    function finalizeCompletedTask(task) {
      const coords = (task.tileKeys || []).map(k => k.split(',').map(Number));

      if (task.type === 'plow') {
        coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile) return;
          tile.state = 'plowed';
          tile.cropId = null;
          tile.ripe = false;
          tile.cared = false;
        });
        addMachineWear(Math.max(1, Math.round(coords.length / 24)));
        playSfx('done');
        showToast(`✅ Aração concluída (${coords.length} blocos)!`);
      } else if (task.type === 'plant') {
        coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile) return;
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const isContract = isContractHectare(hr * HA_COLS + hc);
          if (!isContract) {
            const sameAsLast = tile.lastCropId === task.cropId;
            tile.monocultureCount = sameAsLast ? ((tile.monocultureCount || 0) + 1) : 0;
            tile.lastCropId = task.cropId;
          }
          tile.state = 'planted';
          tile.cropId = task.cropId;
          tile.ripe = true;
          tile.cared = false;
        });
        addMachineWear(Math.max(1, Math.round(coords.length / 36)));
        playSfx('done');
        showToast(`✅ Plantio de ${CROPS[task.cropId]?.name || 'cultura'} concluído e pronto p/ colher!`);
      } else if (task.type === 'care') {
        coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile) return;
          if (tile.state === 'planted' && tile.cropId) {
            tile.cared = true;
            tile.ripe = true;
          }
        });
        addMachineWear(Math.max(1, Math.round(coords.length / 28)));
        playSfx('done');
        showToast(`✅ Cuidado aplicado em ${coords.length} bloco(s)!`);
      } else if (task.type === 'harvest') {
        const wearFactor = Math.max(0.75, 1 - ((state.machineWear || 0) / 250));
        const limeBonus = ownsItem('calcaria_adubo') ? 1.15 : 1.0;
        const sacksAdded = { soja: 0, milho: 0, trigo: 0, canola: 0, sorgo: 0, aveia: 0 };
        let ownHarvestedCount = 0;

        coords.forEach(([tx, ty]) => {
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile || !tile.cropId) return;
          const crop = CROPS[tile.cropId];
          if (!crop) return;
          const isContract = isContractHectare(ha.id) && state.activeContract?.task === 'harvest';

          if (!isContract) {
            ownHarvestedCount++;
            const rotPenalty = (tile.monocultureCount && tile.monocultureCount > 0)
              ? Math.max(0.75, 1 - tile.monocultureCount * (ownsItem('calcaria_adubo') ? 0.04 : 0.08))
              : 1.0;
            const yieldHa = (crop.baseYieldPerHa + (tile.cared ? crop.careBonusYieldPerHa : 0)) * limeBonus * rotPenalty * wearFactor;
            if (sacksAdded[crop.id] === undefined) sacksAdded[crop.id] = 0;
            sacksAdded[crop.id] += yieldHa / TILES_PER_HA;
          }

          tile.state = 'plowed';
          tile.cropId = null;
          tile.ripe = false;
          tile.cared = false;
        });

        addMachineWear(Math.max(1, Math.round(coords.length / 20)));

        Object.keys(sacksAdded).forEach((cid) => {
          state.silo[cid] = +((state.silo[cid] || 0) + sacksAdded[cid]).toFixed(2);
        });

        if (ownHarvestedCount > 0) {
          let loanChargedOnHarvest = 0;
          if (state.loans.length > 0) {
            const remainingLoans = [];
            state.loans.forEach((loan) => {
              const pay = Math.min(loan.installmentAmount, loan.remainingBalance);
              loanChargedOnHarvest += pay;
              const nextBal = loan.remainingBalance - pay;
              const nextInstLeft = loan.installmentsLeft - 1;
              if (nextBal > 0 && nextInstLeft > 0) {
                remainingLoans.push({
                  ...loan,
                  remainingBalance: nextBal,
                  installmentsLeft: nextInstLeft
                });
              }
            });
            state.loans = remainingLoans;
            state.money -= loanChargedOnHarvest;
          }

          if (Array.isArray(state.leasedMachines) && state.leasedMachines.length > 0) {
            const stillLeased = [];
            state.leasedMachines.forEach((lease) => {
              const fee = lease.rentPerHarvest || 0;
              if (state.money >= fee) {
                state.money -= fee;
              }
              const left = (lease.harvestsLeft || 1) - 1;
              if (left > 0) {
                stillLeased.push({ ...lease, harvestsLeft: left });
              }
            });
            state.leasedMachines = stillLeased;
          }
        }

        const totalSc = Object.values(sacksAdded).reduce((a, b) => a + b, 0);
        playSfx('done');
        showToast(`✅ Colheita concluída (${totalSc.toFixed(1)} sc p/ Silo)!`);
      }

      evaluateActiveContractProgress();
    }

    function tickBackgroundWork(elapsedSec = 1) {
      if (!Array.isArray(state.activeTasks) || state.activeTasks.length === 0) return;

      let anyCompleted = false;
      const stillRunning = [];

      state.activeTasks.forEach(task => {
        task.remainingSeconds = Math.max(0, (task.remainingSeconds ?? task.totalSeconds) - elapsedSec);
        if (task.remainingSeconds <= 0) {
          finalizeCompletedTask(task);
          anyCompleted = true;
        } else {
          stillRunning.push(task);
        }
      });

      state.activeTasks = stillRunning;
      if (anyCompleted) {
        updateHUD();
        renderWorld();
      }
    }

    function triggerInstantHarvestAll() {
      setTool('harvest');
      if (hasHarvestTaskInProgress()) {
        const hTask = state.activeTasks.find(t => t.type === 'harvest');
        playSfx('error');
        showToast(`⏳ Colheita já em andamento (${formatDurationSec(hTask?.remainingSeconds || 0)} restantes).`);
        return;
      }

      const busyTiles = getBusyTileSet();
      const ripeTiles = [];

      for (let ty = 0; ty < TOTAL_TILE_ROWS; ty++) {
        for (let tx = 0; tx < TOTAL_TILE_COLS; tx++) {
          if (busyTiles.has(`${tx},${ty}`)) continue;
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          const isContract = isContractHectare(ha.id) && state.activeContract?.task === 'harvest';
          if ((ha.owned || isContract) && tile.state === 'planted' && tile.cropId && tile.ripe) {
            ripeTiles.push({ tx, ty, tile, crop: CROPS[tile.cropId], isContract });
          }
        }
      }

      if (ripeTiles.length === 0) {
        playSfx('error');
        showToast('Nenhuma lavoura pronta para colher agora.');
        return;
      }

      const harvestRateHa = getHarvestCostHa();
      const costInt = Math.round(ripeTiles.length * (harvestRateHa / TILES_PER_HA));
      if (state.money < costInt) {
        playSfx('error');
        showToast(`Saldo insuficiente para colher (${formatBRL(costInt)})!`);
        return;
      }

      const areaHa = ripeTiles.length / TILES_PER_HA;
      const durationSec = computeTaskDurationSeconds('harvest', areaHa);

      state.money -= costInt;
      state.activeTasks = state.activeTasks || [];
      state.activeTasks.push({
        id: `task_harvest_${Date.now()}`,
        type: 'harvest',
        cropId: null,
        tileKeys: ripeTiles.map(({ tx, ty }) => `${tx},${ty}`),
        totalSeconds: durationSec,
        remainingSeconds: durationSec,
        costPaid: costInt
      });

      playSfx('harvest_start');
      clearSelection();
      updateHUD();
      renderWorld();
      showToast(`⏳ Colheita iniciada (${formatDurationSec(durationSec)} · custo ${formatBRL(costInt)})`);
    }

    /* =========================================================================
       RENDERIZAÇÃO DO MUNDO COM TEXTURAS PINTADAS E SPRITES 3D
       ========================================================================= */
    function drawCrop3D(x, y, size, crop, isRipe, cared) {
      const cx = x + size * 0.5;
      const cy = y + size * 0.54;

      if (size * zoom < 12) {
        ctx.fillStyle = isRipe ? crop.ripeColor : crop.color;
        ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
        return;
      }

      ctx.fillStyle = 'rgba(20, 12, 4, 0.36)';
      ctx.beginPath();
      ctx.ellipse(cx, y + size * 0.8, size * 0.3, size * 0.11, 0, 0, Math.PI * 2);
      ctx.fill();

      const scale = (size / 40) * (isRipe ? 1.0 : 0.82);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      const leafCol = isRipe ? '#a3992e' : '#52a828';
      const leafHighlight = isRipe ? '#d4c94c' : '#85db48';

      ctx.fillStyle = leafCol;
      ctx.strokeStyle = '#24470d';
      ctx.lineWidth = 1.4;
      [[-8, 3, -0.55], [8, 3, 0.55], [-6, -4, -0.35], [6, -4, 0.35]].forEach(([lx, ly, rot]) => {
        ctx.beginPath();
        ctx.ellipse(lx, ly, 7.5, 3.2, rot, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      const earGrad = ctx.createLinearGradient(-5, -15, 6, 6);
      if (crop.id === 'milho' || crop.id === 'trigo' || crop.id === 'aveia') {
        earGrad.addColorStop(0, isRipe ? '#fff066' : '#d9f054');
        earGrad.addColorStop(1, isRipe ? '#d98a0b' : '#73a825');
      } else if (crop.id === 'sorgo') {
        earGrad.addColorStop(0, '#ff8a4c');
        earGrad.addColorStop(1, '#a83414');
      } else {
        earGrad.addColorStop(0, isRipe ? '#ffe64d' : leafHighlight);
        earGrad.addColorStop(1, isRipe ? '#c48f12' : '#3a7d19');
      }

      ctx.fillStyle = earGrad;
      ctx.strokeStyle = isRipe ? '#6e4304' : '#234a0d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, -5, 5.2, 10.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.beginPath();
      ctx.arc(-1.5, -8, 1.4, 0, Math.PI * 2);
      ctx.arc(1.5, -4, 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      if (cared && size * zoom >= 16) {
        ctx.fillStyle = '#38bdf8';
        ctx.strokeStyle = '#075985';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(x + size - 6, y + 6, 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    function drawWoodenFenceSegment(x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 4) return;
      const steps = Math.max(2, Math.round(len / 34));

      ctx.save();
      ctx.strokeStyle = 'rgba(22, 14, 5, 0.32)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x1, y1 + 5);
      ctx.lineTo(x2, y2 + 5);
      ctx.stroke();

      ctx.strokeStyle = '#573010';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x1, y1 - 4);
      ctx.lineTo(x2, y2 - 4);
      ctx.moveTo(x1, y1 + 2);
      ctx.lineTo(x2, y2 + 2);
      ctx.stroke();

      ctx.strokeStyle = '#c98749';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(x1, y1 - 4);
      ctx.lineTo(x2, y2 - 4);
      ctx.moveTo(x1, y1 + 2);
      ctx.lineTo(x2, y2 + 2);
      ctx.stroke();

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const px = x1 + dx * t;
        const py = y1 + dy * t;
        ctx.fillStyle = '#a6652b';
        ctx.strokeStyle = '#47250a';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.roundRect(px - 3.6, py - 9, 7.2, 16, 2.5);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#e6a565';
        ctx.beginPath();
        ctx.arc(px, py - 9, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawAnimalSprite3D(animal) {
      const isSmall = animal.type === 'ovelha' || animal.type === 'porco' || animal.type === 'galinha' || animal.arrobas < 5;
      ctx.save();
      if (isSmall) {
        ctx.scale(animal.type === 'galinha' ? 0.65 : 0.82, animal.type === 'galinha' ? 0.65 : 0.82);
      }

      ctx.fillStyle = 'rgba(20, 32, 8, 0.34)';
      ctx.beginPath();
      ctx.ellipse(0, 10, 15, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#29170a';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-7, 5); ctx.lineTo(-7, 11);
      ctx.moveTo(-2, 5); ctx.lineTo(-2, 11);
      ctx.moveTo(5, 5); ctx.lineTo(5, 11);
      ctx.moveTo(9, 5); ctx.lineTo(9, 11);
      ctx.stroke();

      if (animal.type === 'ovelha') {
        const puffs = [[-8, -2, 6.5], [-2, -5, 7], [5, -4, 6.8], [8, 1, 6], [0, 2, 7.2], [-7, 2, 6]];
        ctx.fillStyle = '#f8f5ec';
        ctx.strokeStyle = '#4a3d31';
        ctx.lineWidth = 1.6;
        puffs.forEach(([px, py, pr]) => {
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
        ctx.fillStyle = '#4a3c31';
        ctx.beginPath();
        ctx.arc(13, -1, 5.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        const bodyGrad = ctx.createLinearGradient(0, -9, 0, 8);
        if (animal.type === 'vaca') {
          bodyGrad.addColorStop(0, '#ffffff');
          bodyGrad.addColorStop(1, '#e6dfd3');
        } else if (animal.type === 'porco') {
          bodyGrad.addColorStop(0, '#ffb8ce');
          bodyGrad.addColorStop(1, '#e07b9b');
        } else if (animal.type === 'galinha') {
          bodyGrad.addColorStop(0, '#fffbeb');
          bodyGrad.addColorStop(1, '#e8dcb5');
        } else {
          bodyGrad.addColorStop(0, '#b56333');
          bodyGrad.addColorStop(1, '#753816');
        }
        ctx.fillStyle = bodyGrad;
        ctx.strokeStyle = '#29170a';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(-13, -8.5, 26, 15.5, 7);
        ctx.fill();
        ctx.stroke();

        if (animal.type === 'vaca') {
          ctx.fillStyle = '#26211d';
          ctx.beginPath();
          ctx.ellipse(-5, -2.5, 4.8, 3.2, -0.2, 0, Math.PI * 2);
          ctx.ellipse(4.5, 2.5, 4.2, 2.6, 0.3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = animal.type === 'vaca' ? '#fcfaf5' : (animal.type === 'porco' ? '#f79ab7' : '#8c441c');
        ctx.beginPath();
        ctx.arc(14, -2.5, 5.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = '#140c05';
      ctx.beginPath();
      ctx.arc(14.5, -3.5, 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function renderWorld() {
      const rect = worldViewport.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.fillStyle = '#5ca32e';
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(camX, camY);
      ctx.scale(zoom, zoom);

      const minTx = Math.max(0, Math.floor(-camX / zoom / TILE_PX));
      const maxTx = Math.min(TOTAL_TILE_COLS - 1, Math.ceil((w - camX) / zoom / TILE_PX));
      const minTy = Math.max(0, Math.floor(-camY / zoom / TILE_PX));
      const maxTy = Math.min(TOTAL_TILE_ROWS - 1, Math.ceil((h - camY) / zoom / TILE_PX));

      for (let ty = minTy; ty <= maxTy; ty++) {
        const y = ty * TILE_PX;
        for (let tx = minTx; tx <= maxTx; tx++) {
          const x = tx * TILE_PX;
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          const isContract = isContractHectare(ha.id);
          const fac = getHectareFacilityType(ha);

          if (!ha.owned && !isContract) {
            ctx.drawImage(SPRITE_ATLAS.grassUnowned, x, y, TILE_PX, TILE_PX);
          } else if (ha.owned && fac === 'pasture') {
            ctx.drawImage(SPRITE_ATLAS.grassOwned, x, y, TILE_PX, TILE_PX);
          } else if (ha.owned && fac === 'coop') {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? '#d8b679' : '#c9a667';
            ctx.fillRect(x, y, TILE_PX, TILE_PX);
          } else if (ha.owned && fac === 'sty') {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? '#ad8560' : '#9e7652';
            ctx.fillRect(x, y, TILE_PX, TILE_PX);
          } else if (tile.state === 'raw') {
            ctx.drawImage(SPRITE_ATLAS.grassOwned, x, y, TILE_PX, TILE_PX);
          } else if (tile.state === 'plowed') {
            ctx.drawImage(SPRITE_ATLAS.soilPlowed, x, y, TILE_PX, TILE_PX);
          } else if (tile.state === 'planted') {
            const crop = CROPS[tile.cropId] || CROPS.soja;
            ctx.drawImage(SPRITE_ATLAS.soilPlanted, x, y, TILE_PX, TILE_PX);
            drawCrop3D(x, y, TILE_PX, crop, tile.ripe, tile.cared);
          }
        }
      }

      ctx.save();
      for (let hr = 0; hr < HA_ROWS; hr++) {
        for (let hc = 0; hc < HA_COLS; hc++) {
          const hx = hc * HA_PX;
          const hy = hr * HA_PX;
          const ha = state.hectares[hr * HA_COLS + hc];
          const nearOwned = ha.owned || isContractHectare(ha.id);

          ctx.lineCap = 'round';
          if (hc < HA_COLS - 1) {
            ctx.strokeStyle = nearOwned ? '#8f6234' : '#73502b';
            ctx.lineWidth = 22;
            ctx.beginPath();
            ctx.moveTo(hx + HA_PX - 10, hy + HA_PX * 0.5);
            ctx.lineTo(hx + HA_PX + 10, hy + HA_PX * 0.5);
            ctx.stroke();

            ctx.strokeStyle = nearOwned ? '#deb076' : '#ba9160';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.moveTo(hx + HA_PX - 10, hy + HA_PX * 0.5);
            ctx.lineTo(hx + HA_PX + 10, hy + HA_PX * 0.5);
            ctx.stroke();
          }
          if (hr < HA_ROWS - 1) {
            ctx.strokeStyle = nearOwned ? '#8f6234' : '#73502b';
            ctx.lineWidth = 22;
            ctx.beginPath();
            ctx.moveTo(hx + HA_PX * 0.5, hy + HA_PX - 10);
            ctx.lineTo(hx + HA_PX * 0.5, hy + HA_PX + 10);
            ctx.stroke();

            ctx.strokeStyle = nearOwned ? '#deb076' : '#ba9160';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.moveTo(hx + HA_PX * 0.5, hy + HA_PX - 10);
            ctx.lineTo(hx + HA_PX * 0.5, hy + HA_PX + 10);
            ctx.stroke();
          }
        }
      }
      ctx.restore();

      (state.activeTasks || []).forEach((task) => {
        (task.tileKeys || []).forEach((key) => {
          const [tx, ty] = key.split(',').map(Number);
          if (tx < minTx || tx > maxTx || ty < minTy || ty > maxTy) return;
          const x = tx * TILE_PX;
          const y = ty * TILE_PX;
          ctx.fillStyle = 'rgba(56, 189, 248, 0.24)';
          ctx.fillRect(x, y, TILE_PX, TILE_PX);
          ctx.strokeStyle = 'rgba(224, 242, 254, 0.8)';
          ctx.lineWidth = 1.5 / zoom;
          ctx.strokeRect(x + 1 / zoom, y + 1 / zoom, TILE_PX - 2 / zoom, TILE_PX - 2 / zoom);
        });
      });

      selectedTileKeys.forEach((key) => {
        const [tx, ty] = key.split(',').map(Number);
        const x = tx * TILE_PX;
        const y = ty * TILE_PX;
        ctx.fillStyle = 'rgba(255, 232, 102, 0.34)';
        ctx.fillRect(x, y, TILE_PX, TILE_PX);
        ctx.strokeStyle = '#fff275';
        ctx.lineWidth = 2 / zoom;
        ctx.strokeRect(x + 1 / zoom, y + 1 / zoom, TILE_PX - 2 / zoom, TILE_PX - 2 / zoom);
      });

      for (let hr = 0; hr < HA_ROWS; hr++) {
        for (let hc = 0; hc < HA_COLS; hc++) {
          const ha = state.hectares[hr * HA_COLS + hc];
          const hx = hc * HA_PX;
          const hy = hr * HA_PX;
          const isContract = isContractHectare(ha.id);
          const fac = getHectareFacilityType(ha);

          if (ha.owned && fac === 'pasture') {
            const myGroup = ha.paddockGroupId != null ? ha.paddockGroupId : ha.id;
            const topHa = hr > 0 ? state.hectares[(hr - 1) * HA_COLS + hc] : null;
            const botHa = hr < HA_ROWS - 1 ? state.hectares[(hr + 1) * HA_COLS + hc] : null;
            const leftHa = hc > 0 ? state.hectares[hr * HA_COLS + (hc - 1)] : null;
            const rightHa = hc < HA_COLS - 1 ? state.hectares[hr * HA_COLS + (hc + 1)] : null;

            const topNeighbor = topHa?.owned && getHectareFacilityType(topHa) === 'pasture' && (topHa.paddockGroupId ?? topHa.id) === myGroup;
            const botNeighbor = botHa?.owned && getHectareFacilityType(botHa) === 'pasture' && (botHa.paddockGroupId ?? botHa.id) === myGroup;
            const leftNeighbor = leftHa?.owned && getHectareFacilityType(leftHa) === 'pasture' && (leftHa.paddockGroupId ?? leftHa.id) === myGroup;
            const rightNeighbor = rightHa?.owned && getHectareFacilityType(rightHa) === 'pasture' && (rightHa.paddockGroupId ?? rightHa.id) === myGroup;

            if (!topNeighbor) drawWoodenFenceSegment(hx + 8, hy + 8, hx + HA_PX - 8, hy + 8);
            if (!botNeighbor) drawWoodenFenceSegment(hx + 8, hy + HA_PX - 8, hx + HA_PX - 8, hy + HA_PX - 8);
            if (!leftNeighbor) drawWoodenFenceSegment(hx + 8, hy + 8, hx + 8, hy + HA_PX - 8);
            if (!rightNeighbor) drawWoodenFenceSegment(hx + HA_PX - 8, hy + 8, hx + HA_PX - 8, hy + HA_PX - 8);

            if (HA_PX * zoom >= 52) {
              ctx.drawImage(SPRITE_ATLAS.barn, hx + 16, hy + 8, 178, 115);
              ctx.drawImage(SPRITE_ATLAS.tractor, hx + HA_PX - 92, hy + HA_PX - 76, 76, 60);
            }
          } else if (ha.owned && (fac === 'coop' || fac === 'sty')) {
            drawWoodenFenceSegment(hx + 8, hy + 8, hx + HA_PX - 8, hy + 8);
            drawWoodenFenceSegment(hx + 8, hy + HA_PX - 8, hx + HA_PX - 8, hy + HA_PX - 8);
            drawWoodenFenceSegment(hx + 8, hy + 8, hx + 8, hy + HA_PX - 8);
            drawWoodenFenceSegment(hx + HA_PX - 8, hy + 8, hx + HA_PX - 8, hy + HA_PX - 8);

            if (HA_PX * zoom >= 52) {
              const label = fac === 'coop' ? '🐔 GALINHEIRO' : '🐷 CHIQUEIRO';
              ctx.fillStyle = fac === 'coop' ? 'rgba(146, 64, 14, 0.92)' : 'rgba(124, 45, 18, 0.92)';
              ctx.beginPath();
              ctx.roundRect(hx + 12, hy + 12, 118, 22, 6);
              ctx.fill();
              ctx.fillStyle = '#fff8e7';
              ctx.font = 'bold 10px system-ui, sans-serif';
              ctx.textAlign = 'left';
              ctx.fillText(label, hx + 17, hy + 26);
            }
          } else if (isContract) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4 / zoom;
            ctx.strokeRect(hx, hy, HA_PX, HA_PX);
          }

          if (isContract && HA_PX * zoom >= 42) {
            ctx.fillStyle = 'rgba(12, 74, 110, 0.92)';
            ctx.beginPath();
            ctx.roundRect(hx + 8, hy + 8, 148, 22, 6);
            ctx.fill();
            ctx.fillStyle = '#e0f2fe';
            ctx.font = 'bold 10.5px system-ui, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`📋 CONTRATO · ${state.activeContract.progress || 0}%`, hx + 13, hy + 22);
          }

          if (selectedHaIdToBuy === ha.id) {
            ctx.fillStyle = 'rgba(242, 183, 41, 0.35)';
            ctx.fillRect(hx, hy, HA_PX, HA_PX);
          }

          if (!ha.owned && !isContract && HA_PX * zoom >= 42) {
            const boxW = Math.min(HA_PX - 26, 136);
            const boxH = 46;
            const bx = hx + (HA_PX - boxW) / 2;
            const by = hy + (HA_PX - boxH) / 2;

            ctx.fillStyle = 'rgba(20, 12, 5, 0.32)';
            ctx.beginPath();
            ctx.roundRect(bx, by + 4, boxW, boxH, 9);
            ctx.fill();

            const signGrad = ctx.createLinearGradient(bx, by, bx, by + boxH);
            signGrad.addColorStop(0, '#7c4e26');
            signGrad.addColorStop(1, '#573314');
            ctx.fillStyle = signGrad;
            ctx.beginPath();
            ctx.roundRect(bx, by, boxW, boxH, 9);
            ctx.fill();
            ctx.strokeStyle = '#361d09';
            ctx.lineWidth = 2.4;
            ctx.stroke();

            ctx.fillStyle = '#fff9eb';
            ctx.font = 'bold 11.5px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`HA ${hc + 1},${hr + 1} À VENDA`, hx + HA_PX / 2, by + 19);
            ctx.fillStyle = '#b9f5a6';
            ctx.font = 'bold 11px system-ui, sans-serif';
            ctx.fillText(`R$ ${(ha.price / 1000).toFixed(1).replace('.', ',')} mil`, hx + HA_PX / 2, by + 36);
          }

          if (!ha.owned && HA_PX * zoom >= 56 && (hc === 0 || hc === HA_COLS - 1 || hr === 0 || hr === HA_ROWS - 1 || (hc === 2 && hr === 4) || (hc === 6 && hr === 3))) {
            ctx.drawImage(SPRITE_ATLAS.tree, hx + 6, hy + 6, 62, 66);
            ctx.drawImage(SPRITE_ATLAS.tree, hx + HA_PX - 68, hy + HA_PX - 70, 62, 66);
          }
        }
      }

      let activePastureHectares = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'pasture' && h.pastureActive !== false && !h.pastureDegraded);
      if (activePastureHectares.length === 0) {
        activePastureHectares = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'pasture');
      }
      const coopHectares = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'coop');
      const styHectares = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'sty');

      if (Array.isArray(state.cattle) && state.cattle.length > 0) {
        state.cattle.forEach((animal, idx) => {
          const facType = LIVESTOCK_TYPES[animal.type]?.facilityType || 'pasture';
          let targetHectares = activePastureHectares;
          if (facType === 'coop') targetHectares = coopHectares;
          else if (facType === 'sty') targetHectares = styHectares;

          if (!targetHectares || targetHectares.length === 0) return;
          const pHa = targetHectares[idx % targetHectares.length];
          const slot = Math.floor(idx / targetHectares.length);
          const colSlot = (slot % 3);
          const rowSlot = Math.floor(slot / 3) % 3;
          const ax = pHa.hc * HA_PX + 74 + colSlot * 74;
          const ay = pHa.hr * HA_PX + 132 + rowSlot * 52;

          ctx.save();
          ctx.translate(ax, ay);
          drawAnimalSprite3D(animal);
          ctx.restore();
        });
      }

      if (isBoxSelecting && boxStartWorld && boxCurrentWorld) {
        const rx = Math.min(boxStartWorld.x, boxCurrentWorld.x);
        const ry = Math.min(boxStartWorld.y, boxCurrentWorld.y);
        const rw = Math.abs(boxCurrentWorld.x - boxStartWorld.x);
        const rh = Math.abs(boxCurrentWorld.y - boxStartWorld.y);
        ctx.fillStyle = 'rgba(255, 232, 102, 0.24)';
        ctx.fillRect(rx, ry, rw, rh);
        ctx.strokeStyle = '#fff078';
        ctx.lineWidth = 2 / zoom;
        ctx.strokeRect(rx, ry, rw, rh);
      }

      ctx.restore();
    }

    function getPinchDist(p1, p2) {
      return Math.hypot(p2.clientX - p1.clientX, p2.clientY - p1.clientY);
    }

    canvas.addEventListener('pointerdown', (e) => {
      getAudioContext();
      canvas.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, e);
      const rect = worldViewport.getBoundingClientRect();

      if (activePointers.size === 2) {
        isBoxSelecting = false;
        isPanning = true;
        const pts = Array.from(activePointers.values());
        pinchStartDist = getPinchDist(pts[0], pts[1]);
        pinchStartZoom = zoom;
        const midX = ((pts[0].clientX + pts[1].clientX) / 2) - rect.left;
        const midY = ((pts[0].clientY + pts[1].clientY) / 2) - rect.top;
        pinchStartMidWorld = screenToWorld(midX, midY);
        return;
      }

      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (e.button === 1 || e.button === 2 || panModeActive) {
        isPanning = true;
        panStartScreen = { x: sx, y: sy };
        panStartCam = { x: camX, y: camY };
        return;
      }

      isBoxSelecting = true;
      const wpt = screenToWorld(sx, sy);
      boxStartWorld = wpt;
      boxCurrentWorld = wpt;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, e);
      const rect = worldViewport.getBoundingClientRect();

      if (activePointers.size === 2 && pinchStartDist > 0) {
        const pts = Array.from(activePointers.values());
        const dist = getPinchDist(pts[0], pts[1]);
        const midX = ((pts[0].clientX + pts[1].clientX) / 2) - rect.left;
        const midY = ((pts[0].clientY + pts[1].clientY) / 2) - rect.top;

        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, +(pinchStartZoom * (dist / pinchStartDist)).toFixed(2)));
        camX = midX - pinchStartMidWorld.x * zoom;
        camY = midY - pinchStartMidWorld.y * zoom;
        clampCamera();
        updateZoomBadge();
        renderWorld();
        return;
      }

      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (isPanning) {
        camX = panStartCam.x + (sx - panStartScreen.x);
        camY = panStartCam.y + (sy - panStartScreen.y);
        clampCamera();
        updateZoomBadge();
        renderWorld();
        return;
      }

      if (isBoxSelecting) {
        boxCurrentWorld = screenToWorld(sx, sy);
        renderWorld();
      }
    });

    function endPointer(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) {
        pinchStartDist = 0;
        pinchStartMidWorld = null;
      }

      if (isPanning && activePointers.size === 0) {
        isPanning = false;
        return;
      }

      if (isBoxSelecting && activePointers.size === 0) {
        isBoxSelecting = false;
        if (boxStartWorld && boxCurrentWorld) {
          selectSingleOrBox(boxStartWorld.x, boxStartWorld.y, boxCurrentWorld.x, boxCurrentWorld.y);
        }
        boxStartWorld = null;
        boxCurrentWorld = null;
        renderWorld();
      }
    }

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {

            <button class="action-btn" onclick="buyAnimal('ovelha')">+ Ovelha (${formatBRL(LIVESTOCK_TYPES.ovelha.buyPrice)} · Pasto)</button>
            <button class="action-btn gold" onclick="buyAnimal('porco')">+ Porco (${formatBRL(LIVESTOCK_TYPES.porco.buyPrice)} · Chiqueiro)</button>
            <button class="action-btn" onclick="buyAnimal('galinha')">+ Galinha (${formatBRL(LIVESTOCK_TYPES.galinha.buyPrice)} · Galinheiro)</button>
          </div>

          <h4 style="margin:10px 0 6px;">5. Animais Ativos</h4>
          ${cattleList.length === 0

                    <div style="display:flex;flex-direction:column;gap:4px;">

                      <button class="action-btn" onclick="sellAnimal(${a.id}, 'butcher')">Açougue (${formatBRL(butcherVal)})</button>

          }

          state.availableContracts = generateAvailableContracts(state.hectares, state.contractsCompleted || 0);
        }

        const activeHtml = state.activeContract ? `
          <div class="machine-card" style="border-color:#0284c7;background:#f0f9ff;">
            <div class="machine-info">
              <strong>📋 Ativo: ${state.activeContract.title} (${state.activeContract.progress || 0}%)</strong>
              <small>${state.activeContract.desc}</small><br/>
              <small>Talhão (${state.activeContract.hc + 1},${state.activeContract.hr + 1}) · Pagamento: <strong>${formatBRL(state.activeContract.reward)}</strong></small>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
              <button class="action-btn" onclick="playSfx('click'); focusContractField()">Ir p/ Talhão</button>

        const runningTasksHtml = (state.activeTasks || []).length > 0
          ? (state.activeTasks || []).map((t) => {

              const haQty = ((t.tileKeys || []).length / TILES_PER_HA).toFixed(2);
              return `
                <div class="machine-card">
                  <div class="machine-info">
                    <strong>⏳ ${tName} em andamento (${haQty} ha)</strong>
                    <small>Tempo restante: <strong>${formatDurationSec(t.remainingSeconds)}</strong> de ${formatDurationSec(t.totalSeconds)}</small>
                  </div>
                </div>
              `;
            }).join('')
          : `<p class="confirm-sub">Nenhum trabalho temporizado rodando no momento.</p>`;

        body.innerHTML = `
          <h4 style="margin:4px 0 6px;">Serviços em Andamento</h4>
          ${runningTasksHtml}

          <h4 style="margin:10px 0 6px;">Contratos em Terrenos Vizinhos</h4>
          ${activeHtml}
          ${state.availableContracts.map((srv) => {
            const isThisActive = state.activeContract && state.activeContract.id === srv.id;
            const hasActive = Boolean(state.activeContract);
            return `
              <div class="machine-card">
                <div class="machine-info">
                  <strong>${srv.title}</strong>
                  <small>${srv.desc}</small><br/>
                  <small>Pagamento líquido ao concluir: <strong>${formatBRL(srv.reward)}</strong></small>
                </div>
                <button class="action-btn ${hasActive ? 'secondary' : 'gold'}" onclick="acceptServiceContract('${srv.id}')" ${hasActive ? 'disabled style="opacity:0.5;"' : ''}>

          <p class="confirm-sub">Desgaste atual das máquinas: <strong>${state.machineWear || 0}%</strong>.</p>
          <div class="field-row">
            <button class="action-btn gold" onclick="repairMachinery()">Revisar Oficina (${formatBRL(Math.max(800, (state.machineWear || 0) * 90))})</button>
            <button class="action-btn" onclick="saveGame()">Salvar</button>
            <button class="action-btn gold" onclick="loadGame()">Carregar</button>
            <button class="action-btn danger" onclick="resetGame()">Novo Jogo</button>
          </div>
        `;
      }

      backdrop.classList.add('open');
    }

    function recalcSimulator() {
      const cropId = document.getElementById('simCrop')?.value || 'soja';
      const ha = Math.max(0.25, Number(document.getElementById('simHa')?.value) || 1);
      const modeId = document.getElementById('simTransport')?.value || state.transportMode;
      const crop = CROPS[cropId];
      const econ = getPlantAreaEconomics(crop, ha, false, modeId);
      const installmentPerHarvest = state.loans.reduce((s, l) => s + l.installmentAmount, 0);
      const afterLoanProfit = econ.estimatedProfit - installmentPerHarvest;

      const box = document.getElementById('simResultBox');
      const verdict = document.getElementById('simVerdict');
      if (!box || !verdict) return;

      box.innerHTML = `
        <div class="summary-box"><span>Investimento Total Ciclo</span><strong>${formatBRL(econ.totalCycleCost)}</strong></div>
        <div class="summary-box"><span>Lucro Est. da Colheita</span><strong class="${econ.estimatedProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(econ.estimatedProfit)}</strong></div>
        <div class="summary-box"><span>Parcelas Empréstimo</span><strong>${formatBRL(installmentPerHarvest)}</strong></div>
        <div class="summary-box"><span>Sobra Líquida</span><strong class="${afterLoanProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(afterLoanProfit)}</strong></div>
      `;

      verdict.textContent = `${crop.name}: ${econ.sacks.toFixed(1)} sc estimadas · Receita bruta ${formatBRL(econ.grossRevenue)} · Frete ${formatBRL(econ.transportCost)}.`;
    }

    function changeTransportMode(newMode) {
      if (TRANSPORT_MODES[newMode]) {
        playSfx('click');
        state.transportMode = newMode;
        showToast(`Transporte alterado para ${TRANSPORT_MODES[newMode].name}`);
        if (selectedTileKeys.size > 0 && currentTool !== 'harvest') {
          prepareAreaActionConfirmation();
        }
        closeModal();
        openModal('silo');
      }
    }

    function buyMachine(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || (Array.isArray(state.ownedMachines) && state.ownedMachines.includes(itemId)) || state.money < item.price) {
        playSfx('error');
        showToast('Saldo insuficiente para este equipamento.');
        return;
      }
      state.money -= item.price;
      state.ownedMachines = state.ownedMachines || [];
      state.ownedMachines.push(itemId);
      updateHUD();
      setTool(currentTool);
      playSfx('coin');
      showToast(`Comprou ${item.name}! Custos reduzidos.`);
      closeModal();
      openModal('shop', activeShopTab);
    }

    function leaseMachine(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || ownsItem(itemId)) return;
      if (state.money < item.rentPerHarvest) {
        playSfx('error');
        showToast(`Saldo insuficiente para aluguel (${formatBRL(item.rentPerHarvest)}).`);
        return;
      }
      state.money -= item.rentPerHarvest;
      state.leasedMachines = state.leasedMachines || [];
      state.leasedMachines.push({
        itemId: item.id,
        name: item.name,
        rentPerHarvest: item.rentPerHarvest,
        harvestsLeft: 2
      });
      updateHUD();
      setTool(currentTool);
      playSfx('coin');
      showToast(`Alugou ${item.name} por 2 colheitas!`);
      closeModal();
      openModal('shop', activeShopTab);
    }

    function buyAuctionLot(lotId) {
      const lot = USED_AUCTION_LOTS.find(l => l.lotId === lotId);
      if (!lot) return;
      const baseItem = SHOP_ITEMS.find(i => i.id === lot.itemId);
      if (!baseItem) return;
      const usedPrice = Math.round(baseItem.price * (1 - lot.discountPct / 100));
      if (state.money < usedPrice) {
        playSfx('error');
        showToast(`Saldo insuficiente para o leilão (${formatBRL(usedPrice)}).`);
        return;
      }
      state.money -= usedPrice;
      state.ownedMachines = state.ownedMachines || [];
      if (!state.ownedMachines.includes(baseItem.id)) {
        state.ownedMachines.push(baseItem.id);
      }
      state.claimedAuctionLots = state.claimedAuctionLots || [];
      state.claimedAuctionLots.push(lot.lotId);
      state.machineWear = Math.min(100, Math.max(state.machineWear || 0, lot.initialWear));
      updateHUD();
      setTool(currentTool);
      playSfx('coin');
      showToast(`Arrematou ${baseItem.name} por ${formatBRL(usedPrice)}!`);
      closeModal();
      openModal('shop', 'auction');
    }

    function focusContractField() {
      const c = state.activeContract;
      if (!c) return;
      closeModal();
      const rect = worldViewport.getBoundingClientRect();
      const targetZoom = Math.min(1.6, Math.max(0.75, (Math.min(rect.width, rect.height) - 20) / HA_PX));
      zoom = +targetZoom.toFixed(2);
      const centerWorldX = c.hc * HA_PX + HA_PX / 2;
      const centerWorldY = c.hr * HA_PX + HA_PX / 2;
      camX = rect.width / 2 - centerWorldX * zoom;
      camY = rect.height / 2 - centerWorldY * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function acceptServiceContract(srvId) {
      if (state.activeContract) {
        playSfx('error');
        showToast('Você já tem um contrato ativo.');
        return;
      }
      const srv = (state.availableContracts || []).find(s => s.id === srvId);
      if (!srv) return;
      const ha = state.hectares.find(h => h.id === srv.haId);
      if (!ha || ha.owned) {
        state.availableContracts = generateAvailableContracts(state.hectares, state.contractsCompleted || 0);
        openModal('save');
        return;
      }

      playSfx('done');
      state.activeContract = { ...srv, progress: 0 };
      setupContractField(state.activeContract);
      if (srv.task === 'plant') {
        selectCrop(srv.cropId);
      }
      setTool(srv.task);
      focusContractField();
      showToast(`Contrato aceito! Vá ao talhão (${srv.hc + 1},${srv.hr + 1}) e faça o serviço.`);
    }

    function cancelActiveContract() {
      if (!state.activeContract) return;
      playSfx('click');
      clearContractField(state.activeContract.haId);
      state.activeContract = null;
      state.availableContracts = generateAvailableContracts(state.hectares, state.contractsCompleted || 0);
      renderWorld();
      showToast('Contrato cancelado.');
      openModal('save');
    }

    function getLoanCalculation(principal, installments) {
      const maxLimit = getMaxLoanLimit();
      const cleanP = Math.max(0, Math.min(maxLimit, Math.round(principal || 0)));
      const inst = Math.max(2, Math.min(4, Number(installments) || 3));
      const interestRate = 0.02 * inst;
      const totalWithInterest = Math.round(cleanP * (1 + interestRate));
      const installmentAmount = Math.round(totalWithInterest / inst);
      return { cleanP, inst, interestRate, totalWithInterest, installmentAmount, maxLimit };
    }

    function previewLoanTerms() {
      const box = document.getElementById('loanPreviewBox');
      const btn = document.getElementById('btnTakeLoan');
      if (!box) return;
      const p = Number(document.getElementById('loanPrincipal')?.value) || 0;
      const inst = Number(document.getElementById('loanInstallments')?.value) || 3;
      const calc = getLoanCalculation(p, inst);
      const atLimit = state.loans.length >= 2;
      const validAmount = calc.cleanP >= 1000 && calc.cleanP <= calc.maxLimit;

      box.innerHTML = `
        <span>Resumo (${(calc.interestRate * 100).toFixed(0)}% juros · Limite: ${formatBRL(calc.maxLimit)})</span>
        <strong>Parcela por colheita: ${formatBRL(calc.installmentAmount)} (${calc.inst}x · Total ${formatBRL(calc.totalWithInterest)})</strong>
      `;
      if (btn) {
        const ok = !atLimit && validAmount;
        btn.disabled = !ok;
        btn.style.opacity = ok ? '1' : '0.5';
      }
    }

    function takeHarvestLoan() {
      if (state.loans.length >= 2) {
        playSfx('error');
        showToast('Limite atingido: máximo de 2 empréstimos ativos.');
        return;
      }
      const maxLimit = getMaxLoanLimit();
      const principal = Math.round(Number(document.getElementById('loanPrincipal').value) || 0);
      const installments = Number(document.getElementById('loanInstallments').value) || 3;
      if (principal < 1000 || principal > maxLimit) {
        playSfx('error');
        showToast(`Valor permitido: entre R$ 1.000 e ${formatBRL(maxLimit)}.`);
        return;
      }
      const calc = getLoanCalculation(principal, installments);

      state.money += calc.cleanP;
      state.loans.push({
        id: Date.now() + Math.random(),
        principal: calc.cleanP,
        totalWithInterest: calc.totalWithInterest,
        remainingBalance: calc.totalWithInterest,
        installmentsLeft: calc.inst,
        installmentAmount: calc.installmentAmount
      });

      updateHUD();
      playSfx('coin');
      showToast(`Empréstimo aceito: ${calc.inst}x de ${formatBRL(calc.installmentAmount)} após colher.`);
      closeModal();
      openModal('finance', 'loans');
    }

    function payOneInstallment(loanId) {
      const idx = state.loans.findIndex((l) => l.id === loanId);
      if (idx === -1) return;
      const loan = state.loans[idx];
      const pay = Math.min(loan.installmentAmount, loan.remainingBalance);
      if (state.money < pay) {
        playSfx('error');
        showToast('Saldo insuficiente para pagar a parcela.');
        return;
      }
      state.money -= pay;
      loan.remainingBalance -= pay;
      loan.installmentsLeft -= 1;
      if (loan.remainingBalance <= 0 || loan.installmentsLeft <= 0) {
        state.loans.splice(idx, 1);
      }
      updateHUD();
      playSfx('coin');
      showToast(`Pagou parcela de ${formatBRL(pay)}!`);
      closeModal();
      openModal('finance', 'loans');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function onBackdropClick(e) {
      if (e.target.id === 'modalBackdrop') {
        playSfx('click');
        closeModal();
      }
    }

    function sellCrop(cropId) {
      const crop = CROPS[cropId];
      const qty = Number(document.getElementById(`sellQty_${cropId}`).value);
      if (!Number.isFinite(qty) || qty <= 0 || qty > state.silo[cropId] + 1e-6) {
        playSfx('error');
        showToast('Quantidade inválida no Silo!');
        return;
      }

      if (!ownsItem('caminhao_proprio')) {
        const mode = TRANSPORT_MODES[state.transportMode] || TRANSPORT_MODES.camionete;
        if (qty < mode.minSacks || qty > mode.maxSacks) {
          playSfx('error');
          showToast(`${mode.name} leva de ${mode.minSacks} a ${mode.maxSacks} sacas por viagem.`);
          return;
        }
      }

      const rate = getTransportRatePerSack(state.transportMode);
      const gross = qty * crop.pricePerSack;
      const freight = qty * rate;
      const net = Math.round(gross - freight);
      state.silo[cropId] = Math.max(0, +(state.silo[cropId] - qty).toFixed(2));
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${qty} sc · Frete ${formatBRL(freight)} · Líquido: ${formatBRL(net)}`);
      closeModal();
      openModal('silo');
    }

    function saveGame() {
      localStorage.setItem('fazendaPixelSafraReal_RS_v4', JSON.stringify(state));
      playSfx('done');
      showToast('Jogo salvo!');
    }

    function loadGame() {
      const raw = localStorage.getItem('fazendaPixelSafraReal_RS_v4');
      if (!raw) {
        playSfx('error');
        showToast('Nenhum save encontrado!');
        return;
      }
      state = JSON.parse(raw);
      if (!Array.isArray(state.activeTasks)) state.activeTasks = [];
      if (typeof state.woolKg !== 'number') state.woolKg = 0;
      if (typeof state.eggsDozens !== 'number') state.eggsDozens = 0;
      state.hectares.forEach(h => {
        if (!h.facilityType && h.isPasture) h.facilityType = 'pasture';
      });
      clearSelection();
      updateHUD();
      renderWorld();
      playSfx('done');
      showToast('Save carregado!');
    }

    function resetGame() {
      localStorage.removeItem('fazendaPixelSafraReal_RS_v4');
      state = createInitialState();
      clearSelection();
      updateHUD();
      focusMainHectare();
      closeModal();
      playSfx('click');
      showToast('Fazenda reiniciada!');
    }

    function updateHUD() {
      document.getElementById('hudMoney').textContent = formatBRL(state.money);
      const ownedCount = state.hectares.filter((h) => h.owned).length;
      document.getElementById('hudHectares').textContent = `${ownedCount} / 100`;
      const totalSacks = Object.values(state.silo).reduce((a, b) => a + b, 0);
      document.getElementById('hudSiloChip').textContent = `🌾 Silo: ${totalSacks.toFixed(1)} sc`;
      const cattleChip = document.getElementById('hudLivestockChip');
      if (cattleChip) {
        cattleChip.textContent = `🐄 Rebanho: ${(state.cattle || []).length}`;
      }

      let hasRipe = false;
      for (let i = 0; i < state.tiles.length; i++) {
        const t = state.tiles[i];
        if (t.state === 'planted' && t.cropId && t.ripe) {
          hasRipe = true;
          break;
        }
      }
      document.querySelector('[data-tool="harvest"]').classList.toggle('harvest-ready', hasRipe);
    }

    function convertHectareFacility(haId, facilityType) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || !ha.owned || getHectareFacilityType(ha)) return;
      const costMap = { pasture: FENCE_COST_HA, coop: COOP_COST_HA, sty: STY_COST_HA };
      const nameMap = { pasture: 'Pasto', coop: 'Galinheiro', sty: 'Chiqueiro' };
      const cost = costMap[facilityType] ?? FENCE_COST_HA;

      if (state.money < cost) {
        playSfx('error');
        showToast(`Saldo insuficiente para ${nameMap[facilityType]} (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;

      if (facilityType === 'pasture') {
        const hadAnyActivePasture = state.hectares.some(h => h.owned && getHectareFacilityType(h) === 'pasture' && h.pastureActive === true && !h.pastureDegraded);
        setHectareFacility(ha, 'pasture');
        ha.paddockGroupId = ha.id;
        ha.grassLevel = 100;
        ha.pastureDegraded = false;
        ha.pastureActive = !hadAnyActivePasture;
      } else {
        setHectareFacility(ha, facilityType);
      }

      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          state.tiles[ty * TOTAL_TILE_COLS + tx] = { state: 'raw', cropId: null, ripe: false, cared: false, lastCropId: null, monocultureCount: 0 };
        }
      }
      updateHUD();
      renderWorld();
      playSfx('done');
      showToast(`Hectare (${ha.hc + 1},${ha.hr + 1}) transformado em ${nameMap[facilityType]}!`);
      openModal('livestock');
    }

    function clearHectareFacility(haId) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || !ha.owned) return;
      const fac = getHectareFacilityType(ha);
      if (!fac) return;

      if (fac === 'pasture') {
        const pastureCount = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'pasture').length;
        const hasGrazing = (state.cattle || []).some(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
        if (pastureCount <= 1 && hasGrazing) {
          playSfx('error');
          showToast('Venda os animais de pasto antes de remover o último pasto.');
          return;
        }
        const wasActive = ha.pastureActive;
        setHectareFacility(ha, null);
        ha.paddockGroupId = ha.id;
        if (wasActive && hasGrazing) {
          const nextReady = getPasturePaddocks().find(p => !p.isDegraded);
          if (nextReady) {
            nextReady.members.forEach(m => { m.pastureActive = true; });
          }
        }
      } else if (fac === 'coop') {
        const coopCount = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'coop').length;
        const chickenCount = (state.cattle || []).filter(a => a.type === 'galinha').length;
        if (coopCount <= 1 && chickenCount > 0) {
          playSfx('error');
          showToast('Venda as galinhas antes de remover o último galinheiro.');
          return;
        }
        setHectareFacility(ha, null);
      } else if (fac === 'sty') {
        const styCount = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'sty').length;
        const pigCount = (state.cattle || []).filter(a => a.type === 'porco').length;
        if (styCount <= 1 && pigCount > 0) {
          playSfx('error');
          showToast('Venda os porcos antes de remover o último chiqueiro.');
          return;
        }
        setHectareFacility(ha, null);
      }

      playSfx('click');
      renderWorld();
      showToast(`Hectare (${ha.hc + 1},${ha.hr + 1}) voltou para lavoura.`);
      openModal('livestock');
    }

    function mergePaddocks(paddockIdA, paddockIdB) {
      const paddocks = getPasturePaddocks();
      const pA = paddocks.find(p => p.id === paddockIdA);
      const pB = paddocks.find(p => p.id === paddockIdB);
      if (!pA || !pB || pA.id === pB.id) return;

      const newGroupId = Math.min(pA.id, pB.id);
      const anyActive = pA.isActive || pB.isActive;
      [...pA.members, ...pB.members].forEach(m => {
        m.paddockGroupId = newGroupId;
        if (anyActive && !m.pastureDegraded) {
          m.pastureActive = true;
        }
      });

      playSfx('done');
      renderWorld();
      showToast(`Pastos juntados (${pA.areaHa + pB.areaHa} ha)!`);
      openModal('livestock');
    }

    function splitPaddock(paddockId) {
      const paddocks = getPasturePaddocks();
      const target = paddocks.find(p => p.id === paddockId);
      if (!target || target.members.length <= 1) return;

      target.members.forEach((m, idx) => {
        m.paddockGroupId = m.id;
        if (target.isActive) {
          m.pastureActive = (idx === 0);
        }
      });

      playSfx('click');
      renderWorld();
      showToast('Pastos separados novamente!');
      openModal('livestock');
    }

    function moveCattleToPaddock(destPaddockId) {
      const paddocks = getPasturePaddocks();
      const dest = paddocks.find(p => p.id === destPaddockId);
      if (!dest) return;
      paddocks.forEach(p => {
        const isDest = (p.id === destPaddockId);
        p.members.forEach(m => { m.pastureActive = isDest; });
      });
      playSfx('animal');
      renderWorld();
      showToast(`Rebanho movido para o pasto selecionado (${dest.areaHa} ha)!`);
      openModal('livestock');
    }

    function makeSilageFromCorn(sacksToUse) {
      if (!ownsItem('ensiladeira_forragem')) {
        playSfx('error');
        showToast('Compre ou alugue a Ensiladeira na Loja primeiro.');
        return;
      }
      const avail = state.silo.milho || 0;
      const qty = Math.min(avail, sacksToUse);
      if (qty < 1) {
        playSfx('error');
        showToast('Você precisa de pelo menos 1 saca de Milho no silo.');
        return;
      }
      const cost = Math.round(qty * SILAGE_PROCESS_COST_PER_SACK);
      if (state.money < cost) {
        playSfx('error');
        showToast(`Saldo insuficiente para picar silagem (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;
      state.silo.milho = +(state.silo.milho - qty).toFixed(2);
      const kgAdded = Math.round(qty * SILAGE_KG_PER_CORN_SACK);
      state.silageKg = (state.silageKg || 0) + kgAdded;
      updateHUD();
      playSfx('done');
      showToast(`Produziu ${kgAdded} kg de silagem com ${qty.toFixed(1)} sc de milho!`);
      openModal('livestock');
    }

    function buyAnimal(type) {
      const spec = LIVESTOCK_TYPES[type];
      if (!spec) return;

      if (spec.facilityType === 'coop') {
        const cap = getCoopCapacity();
        const curCount = (state.cattle || []).filter(a => a.type === 'galinha').length;
        if (cap <= 0) {
          playSfx('error');
          showToast('Transforme ao menos 1 hectare em Galinheiro antes de comprar galinhas.');
          return;
        }
        if (curCount + 1 > cap) {
          playSfx('error');
          showToast(`Galinheiro cheio (${cap} galinhas).`);
          return;
        }
      } else if (spec.facilityType === 'sty') {
        const cap = getStyCapacity();
        const curCount = (state.cattle || []).filter(a => a.type === 'porco').length;
        if (cap <= 0) {
          playSfx('error');
          showToast('Transforme ao menos 1 hectare em Chiqueiro antes de comprar porcos.');
          return;
        }
        if (curCount + 1 > cap) {
          playSfx('error');
          showToast(`Chiqueiro cheio (${cap} porcos).`);
          return;
        }
      } else {
        const paddocks = getPasturePaddocks();
        if (paddocks.length === 0) {
          playSfx('error');
          showToast('Transforme ao menos 1 hectare em Pasto antes de comprar bois, vacas ou ovelhas.');
          return;
        }
        ensureAtLeastOneActivePaddock();
        const totalPastureHa = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'pasture').length;
        const maxUAWithSilage = totalPastureHa * UA_CAPACITY_PER_HA * ((state.silageKg || 0) >= 300 ? 1.8 : 1.0);
        const addedUA = Math.max(0.05, +(spec.uaWeight * Math.max(0.5, spec.startArrobas / (spec.startArrobas || 5))).toFixed(2));
        const nextUA = getTotalHerdUA() + addedUA;
        if (nextUA > maxUAWithSilage + 0.1) {
          playSfx('error');
          showToast(`Lotação limite (${UA_CAPACITY_PER_HA} UA/ha)! Abra mais pasto ou produza silagem.`);
          return;
        }
      }

      if (spec.requiresGrain && spec.grainSacksMonth > 0) {
        const grainCheck = consumeGrainFromSilo(spec.grainSacksMonth);
        if (!grainCheck.ok) {
          playSfx('error');
          showToast(`Sem grãos suficientes no Silo (${spec.grainSacksMonth} sc necessários).`);
          return;
        }
      }

      if (state.money < spec.buyPrice) {
        playSfx('error');
        showToast(`Saldo insuficiente (${formatBRL(spec.buyPrice)}).`);
        return;
      }
      state.money -= spec.buyPrice;
      state.cattle = state.cattle || [];
      state.cattle.push({
        id: Date.now() + Math.random(),
        type: spec.id,
        arrobas: spec.startArrobas
      });

      if (spec.id === 'vaca') {
        state.milkLiters = (state.milkLiters || 0) + spec.milkLitersMonth;
      }
      if (spec.id === 'ovelha') {
        state.woolKg = +((state.woolKg || 0) + spec.woolKgMonth).toFixed(2);
      }
      if (spec.id === 'galinha') {
        state.eggsDozens = +((state.eggsDozens || 0) + spec.eggsDozensMonth).toFixed(1);
      }

      updateHUD();
      renderWorld();
      playSfx('animal');
      showToast(`Comprou ${spec.name}!`);
      openModal('livestock');
    }

    function sellAnimal(animalId, mode) {
      const idx = (state.cattle || []).findIndex(a => a.id === animalId);
      if (idx === -1) return;
      const animal = state.cattle[idx];
      const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
      const pricePerArroba = mode === 'butcher' ? BUTCHER_PRICE_PER_ARROBA : LIVE_CATTLE_PRICE_PER_ARROBA;
      const freight = ownsItem('caminhao_boiadeiro') ? spec.freightOwn : spec.freightBase;
      const net = Math.max(0, Math.round(animal.arrobas * pricePerArroba - freight));

      state.cattle.splice(idx, 1);
      state.money += net;
      updateHUD();
      renderWorld();
      playSfx('coin');
      showToast(`Vendeu (${mode === 'butcher' ? 'Açougue' : 'Vivo Criação'}) por ${formatBRL(net)} líquido!`);
      openModal('livestock');
    }

    function sellAllMilk() {
      const liters = state.milkLiters || 0;
      if (liters < 1) {
        playSfx('error');
        showToast('Sem leite no tanque para venda.');
        return;
      }
      const freightPerL = ownsItem('caminhao_leite') ? 0.08 : 0.30;
      const net = Math.round(liters * (MILK_PRICE_PER_LITER - freightPerL));
      state.milkLiters = 0;
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${liters.toFixed(0)} L de leite por ${formatBRL(net)} líquido!`);
      openModal('livestock');
    }

    function sellAllWool() {
      const kg = state.woolKg || 0;
      if (kg <= 0) {
        playSfx('error');
        showToast('Sem lã disponível para venda.');
        return;
      }
      const net = Math.round(kg * WOOL_PRICE_PER_KG);
      state.woolKg = 0;
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${kg.toFixed(2)} kg de lã por ${formatBRL(net)}!`);
      openModal('livestock');
    }

    function sellAllEggs() {
      const dz = state.eggsDozens || 0;
      if (dz <= 0) {
        playSfx('error');
        showToast('Sem ovos disponíveis para venda.');
        return;
      }
      const net = Math.round(dz * EGG_PRICE_PER_DOZEN);
      state.eggsDozens = 0;
      state.money += net;
      updateHUD();
      playSfx('coin');
      showToast(`Vendeu ${dz.toFixed(1)} dúzias de ovos por ${formatBRL(net)}!`);
      openModal('livestock');
    }

    function repairMachinery() {
      const wear = state.machineWear || 0;
      if (wear <= 0) {
        playSfx('click');
        showToast('Máquinas já estão revisadas.');
        return;
      }
      const cost = Math.max(800, wear * 90);
      if (state.money < cost) {
        playSfx('error');
        showToast(`Saldo insuficiente para revisão (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;
      state.machineWear = 0;
      updateHUD();
      playSfx('done');
      showToast(`Oficina concluída (${formatBRL(cost)})! Eficiência 100%.`);
      closeModal();
      openModal('save');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    setInterval(() => {
      tickBackgroundWork(1);
    }, 1000);

    window.addEventListener('resize', resizeCanvas);

    renderCropSelector();
    setTool('plow');
    updateHUD();
    resizeCanvas();
    focusMainHectare();
  </script>
</body>
</html>

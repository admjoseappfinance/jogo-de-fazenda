<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fazenda Pixel - Safra Real (RS)</title>
  <style>
    :root {
      --bg-green: #639e38;
      --bg-dot: #578e2f;
      --wood-pill: #573619;
      --wood-pill-border: #3a220e;
      --wood-frame: #8a562c;
      --wood-frame-dark: #4e2d13;
      --card-cream: #fbf5e6;
      --card-cream-border: #d9caa8;
      --gold-accent: #f2b729;
      --teal-pill: #184e43;
      --teal-border: #0e332b;
      --text-dark: #3b2310;
      --text-muted: #75583c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-green);
      background-image: radial-gradient(var(--bg-dot) 3px, transparent 3px);
      background-size: 26px 26px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      touch-action: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100dvh;
      max-width: 620px;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 10px max(24px, calc(env(safe-area-inset-bottom) + 18px));
      gap: 7px;
      position: relative;
      overflow: hidden;
    }

    /* TOP HUD */
    .top-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-pills-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pills-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-controls-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px 5px 8px;
      border-radius: 13px;
      background: var(--wood-pill);
      border: 2px solid var(--wood-pill-border);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      color: #fff8e7;
      cursor: pointer;
    }

    .stat-pill.teal {
      background: var(--teal-pill);
      border-color: var(--teal-border);
    }

    .stat-pill-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .stat-pill-icon.coin {
      background: radial-gradient(circle at 30% 30%, #ffe678, #e09612);
      border: 2px solid #965b04;
      color: #693e00;
      font-weight: 900;
    }

    .stat-pill-texts {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .stat-pill-label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e8cfa3;
    }

    .stat-pill.teal .stat-pill-label {
      color: #9ed9ca;
    }

    .stat-pill-val {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
    }

    .cream-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--card-cream);
      border: 2px solid var(--wood-frame);
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: var(--text-dark);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .cream-btn.active-timer {
      background: #ffe885;
      border-color: #a86c05;
      box-shadow: 0 0 0 2px var(--gold-accent);
    }

    .cream-btn.muted {
      background: #e6dcc7;
      opacity: 0.78;
    }

    .cream-btn:active {
      transform: translateY(1px);
    }

    .top-sub-row {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .top-sub-row::-webkit-scrollbar {
      display: none;
    }

    .orange-square-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9px;
      background: linear-gradient(180deg, #f29422 0%, #c9680e 100%);
      border: 2px solid #592b05;
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 5px 8px;
      border-radius: 9px;
      background: rgba(251, 245, 230, 0.95);
      border: 2px solid var(--wood-frame);
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.25);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
      white-space: nowrap;
    }

    /* CENTER WORLD CANVAS */
    .world-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 7px;
      border-radius: 16px;
      background: linear-gradient(180deg, #cfa06d 0%, #9b6638 100%);
      border: 3px solid var(--wood-frame-dark);
      box-shadow:
        0 6px 0 rgba(36, 58, 20, 0.42),
        inset 0 2px 0 rgba(255, 232, 198, 0.55);
      display: flex;
      position: relative;
    }

    .world-inner {
      width: 100%;
      height: 100%;
      border-radius: 9px;
      border: 3px solid #6b411d;
      box-shadow: inset 0 0 0 2px #472910;
      overflow: hidden;
      position: relative;
      background: #3d6326;
    }

    canvas#farmCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    canvas#farmCanvas.pan-mode {
      cursor: grab;
    }

    .cam-controls {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 15;
    }

    .cam-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--card-cream);
      border: 2px solid var(--wood-pill);
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: var(--text-dark);
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cam-btn:active {
      transform: translateY(1px);
    }

    .cam-btn.active {
      background: #ffe680;
      border-color: #b87c07;
      box-shadow: 0 0 0 2px var(--gold-accent);
    }

    .zoom-pill {
      background: rgba(87, 54, 25, 0.92);
      color: #fff8e7;
      border: 1.5px solid var(--wood-pill-border);
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      padding: 2px 3px;
    }

    .sector-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 14;
      background: rgba(87, 54, 25, 0.92);
      border: 2px solid var(--wood-pill-border);
      color: #fff8e7;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      pointer-events: none;
    }

    /* CONFIRMATION DRAWER */
    .confirm-card {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: min(96%, 430px);
      z-index: 22;
      background: var(--card-cream);
      border: 3px solid var(--wood-pill);
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      gap: 7px;
    }

    .confirm-card.open {
      display: flex;
    }

    .confirm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
      border-bottom: 1.5px solid var(--card-cream-border);
      padding-bottom: 5px;
    }

    .confirm-summary-big {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .summary-box {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-box span {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .summary-box strong {
      font-size: 13px;
      font-weight: 900;
    }

    .confirm-sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .profit-pos { color: #1b6919; font-weight: 900; }
    .profit-neg { color: #a82319; font-weight: 900; }

    /* BOTTOM DOCK */
    .bottom-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 20;
      flex-shrink: 0;
    }

    .crop-selector-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      background: rgba(87, 54, 25, 0.94);
      border: 2px solid var(--wood-pill-border);
      padding: 4px 8px;
      border-radius: 999px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    }

    .crop-selector-bar.visible {
      display: inline-flex;
    }

    .crop-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--card-cream);
      border: 2px solid transparent;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
    }

    .crop-chip.selected {
      background: #ffe999;
      border-color: var(--gold-accent);
    }

    .dock-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 390px;
      padding: 7px;
      border-radius: 16px;
      background: var(--wood-pill);
      border: 2px solid var(--wood-pill-border);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .tool-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px 5px;
      border-radius: 11px;
      background: var(--card-cream);
      border: 2.5px solid #cbb78e;
      box-shadow: 0 2.5px 0 #b39b6d;
      color: var(--text-dark);
      cursor: pointer;
    }

    .tool-card:active {
      transform: translateY(1.5px);
      box-shadow: 0 1px 0 #b39b6d;
    }

    .tool-card.active {
      background: #fffdf6;
      border-color: var(--gold-accent);
      box-shadow: 0 2.5px 0 #b8810c, 0 0 10px rgba(242, 183, 41, 0.55);
    }

    .tool-card.harvest-ready {
      border-color: #369c28;
      background: #f2fce8;
    }

    .tool-icon-svg {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-card-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1;
    }

    .hint-bar {
      font-size: 10.5px;
      font-weight: 700;
      color: #f6ffed;
      text-shadow: 0 1px 2px rgba(20, 44, 10, 0.7);
      text-align: center;
      line-height: 1.15;
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(22, 36, 15, 0.65);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: min(94vw, 560px);
      max-height: 84dvh;
      overflow-y: auto;
      background: var(--card-cream);
      border: 4px solid var(--wood-pill);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      padding: 16px;
      color: var(--text-dark);
      font-size: 13px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-cream-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .close-x {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #c9463d;
      border: 2px solid #5c1813;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 6px 10px;
      border-radius: 9px;
      border: 2px solid var(--wood-frame);
      background: #efe5cf;
      color: var(--text-dark);
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--wood-pill);
      color: #fff8e7;
    }

    .machine-card {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .machine-info strong {
      display: block;
      font-size: 13px;
    }

    .machine-info small {
      color: var(--text-muted);
      font-size: 11px;
    }

    table.farm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #fffdf7;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--card-cream-border);
      margin-bottom: 10px;
    }

    table.farm-table th, table.farm-table td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid #eadec4;
    }

    table.farm-table th {
      background: var(--wood-pill);
      color: #fff6df;
      font-weight: 800;
    }

    .price-high { background: #dff2d8; color: #1e5e18; font-weight: 800; }
    .price-mid { background: #fcf0cc; color: #755309; }
    .price-low { background: #f9d8d4; color: #8c231b; }

    .action-btn {
      padding: 6px 11px;
      border-radius: 9px;
      border: 2px solid #2b4f18;
      background: linear-gradient(180deg, #62a838 0%, #458223 100%);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn.secondary {
      background: #ede3cc;
      border-color: var(--wood-frame);
      color: var(--text-dark);
    }

    .action-btn.gold {
      background: linear-gradient(180deg, #f5b92a 0%, #c98a0c 100%);
      border-color: #634103;
      color: #2b1a02;
    }

    .action-btn.danger {
      background: linear-gradient(180deg, #d44c42 0%, #a32c24 100%);
      border-color: #54120e;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    input[type="number"], select {
      padding: 6px 8px;
      border-radius: 8px;
      border: 2px solid var(--wood-frame);
      background: #fff;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--wood-pill);
      color: #fff8e7;
      border: 2px solid var(--gold-accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOP HUD -->
    <header class="top-area">
      <div class="top-pills-row">
        <div class="pills-left">
          <div class="stat-pill" onclick="playSfx('click'); openModal('finance')" title="Financeiro, Empréstimos e Simulador de Safra">
            <div class="stat-pill-icon coin">$</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">Caixa</span>
              <span class="stat-pill-val" id="hudMoney">R$ 22.000</span>
            </div>
          </div>

          <div class="stat-pill teal" onclick="playSfx('click'); focusMainHectare()" title="Hectares Próprios">
            <div class="stat-pill-icon">🌾</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">Hectares</span>
              <span class="stat-pill-val" id="hudHectares">1 / 100</span>
            </div>
          </div>
        </div>

        <div class="top-controls-right">
          <button class="cream-btn" id="btnSoundToggle" onclick="toggleSound()" title="Ligar ou desligar sons do jogo">
            🔊 Som: ON
          </button>
          <button class="cream-btn" id="btnAuto10s" onclick="toggleAuto10s()" title="Teste: acelera o tempo (1 mês a cada 10s e trabalhos mais rápidos)">
            ⏱️ 10s/Mês: OFF
          </button>
        </div>
      </div>

      <div class="top-sub-row">
        <button class="cream-btn" onclick="playSfx('click'); fitAllHectares()" title="Ver todos os 100 hectares">
          🗺️ Mapa Completo
        </button>
        <button class="orange-square-btn" onclick="playSfx('click'); openModal('help')" title="Ajuda">?</button>

        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('calendar')" id="hudDateChip">
          ☀️ Jan · Ano 1
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('silo')" id="hudSiloChip">
          🌾 Silo: 0.0 sc
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('livestock')" id="hudLivestockChip">
          🐄 Gado: 0
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('shop')">
          🚜 Loja
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('prices')">
          📊 Preços
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('save')">
          💾
        </div>
      </div>
    </header>

    <!-- CENTER WORLD CANVAS -->
    <main class="world-frame">
      <div class="world-inner" id="worldViewport">
        <canvas id="farmCanvas"></canvas>

        <div class="sector-badge" id="sectorBadge">
          Hectare Principal (5,5) · 100 ha
        </div>

        <div class="cam-controls">
          <button class="cam-btn" onclick="playSfx('click'); zoomBy(1.28)" title="Aproximar Zoom">+</button>
          <div class="zoom-pill" id="zoomReadout">100%</div>
          <button class="cam-btn" onclick="playSfx('click'); zoomBy(0.78)" title="Afastar Zoom">−</button>
          <button class="cam-btn" id="btnPanToggle" onclick="playSfx('click'); togglePanMode()" title="Mover Câmera (1 dedo)">✋</button>
          <button class="cam-btn" onclick="playSfx('click'); focusMainHectare()" title="Centralizar Fazenda">🏡</button>
        </div>

        <!-- CONFIRMATION DRAWER -->
        <div class="confirm-card" id="confirmCard">
          <div class="confirm-header">
            <span id="confirmTitle">Confirmar Ação</span>
            <button class="close-x" onclick="playSfx('click'); clearSelection()">✕</button>
          </div>
          <div class="confirm-summary-big" id="confirmSummaryBoxes"></div>
          <div class="confirm-sub" id="confirmSubInfo"></div>
          <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:2px;">
            <button class="action-btn secondary" onclick="playSfx('click'); clearSelection()">Cancelar</button>
            <button class="action-btn" id="confirmExecuteBtn" onclick="executeConfirmedAction()">Confirmar</button>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM DOCK -->
    <footer class="bottom-area">
      <div class="crop-selector-bar" id="cropSelectorBar"></div>

      <div class="dock-container">
        <button class="tool-card active" data-tool="plow" onclick="playSfx('click'); setTool('plow')">
          <div class="tool-icon-svg">
            <svg width="24" height="24" viewBox="0 0 32 32">
              <path d="M7 25 L21 11" stroke="#8b5a2b" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M15 7 Q23 7 26 14 L22 16 Q19 11 14 11 Z" fill="#9fb3c8" stroke="#486581" stroke-width="1.5"/>
            </svg>
          </div>
          <span class="tool-card-label">Arar</span>
        </button>

        <button class="tool-card" data-tool="plant" onclick="playSfx('click'); setTool('plant')">
          <div class="tool-icon-svg">

    let soundEnabled = true;

    function getAudioContext() {
      if (!soundEnabled) return null;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) {
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freqStart, freqEnd, duration, type = 'sine', gainPeak = 0.08, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, now);
      if (freqEnd !== null && freqEnd !== freqStart) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(gainPeak, now + Math.min(0.015, duration * 0.2));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playNoiseBurst(duration, filterFreq = 900, gainPeak = 0.07, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime + delay;
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.Q.setValueAtTime(1.2, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(gainPeak, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(now);
      src.stop(now + duration + 0.02);
    }

    function getHectareFacilityType(ha) {
      if (!ha || !ha.owned) return null;
      if (ha.facilityType === 'coop' || ha.facilityType === 'sty' || ha.facilityType === 'pasture') {
        return ha.facilityType;
      }
      if (ha.isPasture) return 'pasture';
      return null;
    }

    function setHectareFacility(ha, type) {
      ha.facilityType = type;
      ha.isPasture = (type === 'pasture');
      if (type !== 'pasture') {
        ha.pastureActive = false;
        ha.pastureDegraded = false;
        ha.restMonths = 0;
        ha.grassLevel = 100;
      }
    }

    function getCoopCapacity() {
      const coopHa = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'coop').length;
      return coopHa * 45;
    }

    function getStyCapacity() {
      const styHa = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'sty').length;
      return styHa * 18;
    }

    function getTotalGrainSacksInSilo() {
      if (!state || !state.silo) return 0;
      const grainKeys = ['milho', 'trigo', 'sorgo', 'aveia', 'soja', 'canola'];
      return +grainKeys.reduce((sum, k) => sum + Math.max(0, Number(state.silo[k] || 0)), 0).toFixed(2);
    }

    function consumeGrainFromSilo(neededSacks) {
      let rem = Math.max(0, Number(neededSacks || 0));
      if (rem <= 0) return { ok: true, consumed: 0 };
      const available = getTotalGrainSacksInSilo();
      if (available + 1e-6 < rem) {
        return { ok: false, consumed: 0 };
      }
      const order = ['milho', 'sorgo', 'trigo', 'aveia', 'soja', 'canola'];
      for (const k of order) {
        if (rem <= 1e-6) break;
        const cur = Math.max(0, Number(state.silo[k] || 0));
        if (cur > 0) {
          const take = Math.min(cur, rem);
          state.silo[k] = +(cur - take).toFixed(2);
          rem = +(rem - take).toFixed(2);
        }
      }
      return { ok: true, consumed: +((neededSacks || 0) - rem).toFixed(2) };
    }

    function getAnimalUA(animal) {
      const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
      return Math.max(0.05, +(spec.uaWeight * Math.max(0.5, animal.arrobas / (spec.startArrobas || 5))).toFixed(2));
    }

    function getTotalHerdUA() {
      const grazing = (state.cattle || []).filter(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
      return +grazing.reduce((sum, a) => sum + getAnimalUA(a), 0).toFixed(2);
    }

    function getPasturePaddocks() {
      const groups = new Map();
      state.hectares.forEach(h => {
        if (!h.owned || getHectareFacilityType(h) !== 'pasture') return;
        const gid = h.paddockGroupId != null ? h.paddockGroupId : h.id;
        if (!groups.has(gid)) groups.set(gid, []);
        groups.get(gid).push(h);
      });

      const paddocks = [];
      groups.forEach((members, gid) => {
        members.sort((a, b) => a.id - b.id);
        const minGrass = Math.min(...members.map(m => (typeof m.grassLevel === 'number' ? m.grassLevel : 100)));
        const maxRest = Math.max(...members.map(m => (m.restMonths || 0)));
        const isDegraded = members.some(m => m.pastureDegraded);
        const isActive = members.some(m => m.pastureActive === true && !m.pastureDegraded);

        paddocks.push({
          id: gid,
          members,
          areaHa: members.length,
          capacityUA: +(members.length * UA_CAPACITY_PER_HA).toFixed(1),
          grassLevel: Math.round(minGrass),
          restMonths: maxRest,
          isDegraded,
          isActive
        });
      });

      paddocks.sort((a, b) => a.members[0].id - b.members[0].id);
      return paddocks;
    }

    function ensureAtLeastOneActivePaddock() {
      const paddocks = getPasturePaddocks();
      if (paddocks.length === 0) return;
      const hasActive = paddocks.some(p => p.isActive && !p.isDegraded);
      const hasGrazingAnimals = (state.cattle || []).some(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
      if (!hasActive && !hasGrazingAnimals) {
        const ready = paddocks.find(p => !p.isDegraded);
        if (ready) {
          ready.members.forEach(m => {
            m.pastureActive = true;
          });
        }
      }
    }

        careBonusYieldPerHa: 10,
        plantCostHa: 980,
        bestSeasons: ['verao', 'outono'],
        okSeasons: ['primavera'],
        prices: [58, 57, 56, 59, 61, 63, 64, 65, 63, 60, 59, 58]
      },
      aveia: {
        id: 'aveia',
        name: 'Aveia',
        color: '#b8c468',
        ripeColor: '#e5d46b',
        monthsToGrow: 3,
        baseYieldPerHa: 52,
        careBonusYieldPerHa: 8,
        plantCostHa: 860,
        bestSeasons: ['inverno', 'outono'],
        okSeasons: ['primavera'],
        prices: [74, 75, 78, 80, 83, 86, 88, 87, 82, 77, 75, 74]
      }
    };

    const CROP_LIST = Object.values(CROPS);

    const HA_COLS = 10;
    const HA_ROWS = 10;
    const SUB_SIZE = 8;
    const TILES_PER_HA = 64;
    const TOTAL_TILE_COLS = HA_COLS * SUB_SIZE;
    const TOTAL_TILE_ROWS = HA_ROWS * SUB_SIZE;
    const TILE_PX = 36;
    const HA_PX = TILE_PX * SUB_SIZE;
    const MAP_PX = HA_COLS * HA_PX;

    function formatBRL(val) {
      return Number(val || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL',
        maximumFractionDigits: 0
      });
    }

    function formatDurationSec(totalSec) {
      const s = Math.max(1, Math.ceil(totalSec));
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      if (mins <= 0) return `${rem}s`;
      return rem === 0 ? `${mins} min` : `${mins}m ${String(rem).padStart(2, '0')}s`;
    }

    function getWorkDurationSeconds(taskType, areaHa) {
      const rate = WORK_SECONDS_PER_HA[taskType] || 300;
      return Math.max(5, Math.round(areaHa * rate));
    }

    function getSeasonInfo(monthIdx) {
      if (monthIdx >= 2 && monthIdx <= 4) return { id: 'outono', name: 'Outono', icon: '🍂', endsMonth: 'Mai', months: [2, 3, 4] };
      if (monthIdx >= 5 && monthIdx <= 7) return { id: 'inverno', name: 'Inverno', icon: '❄️', endsMonth: 'Ago', months: [5, 6, 7] };
      if (monthIdx >= 8 && monthIdx <= 10) return { id: 'primavera', name: 'Primavera', icon: '🌸', endsMonth: 'Nov', months: [8, 9, 10] };
      return { id: 'verao', name: 'Verão', icon: '☀️', endsMonth: 'Fev', months: [11, 0, 1] };
    }

    function getCropSeasonMultiplier(crop, monthIdx) {
      const season = getSeasonInfo(monthIdx);
      if (crop.bestSeasons && crop.bestSeasons.includes(season.id)) {
        return { mult: 1.28, label: 'Estação Ideal (+28% sacas)' };
      }
      if (crop.okSeasons && crop.okSeasons.includes(season.id)) {
        return { mult: 1.0, label: 'Estação Regular (100% sacas)' };
      }
      return { mult: 0.72, label: 'Fora da Estação (-28% sacas)' };
    }

    function getBestSeasonNames(crop) {
      const map = { verao: 'Verão', outono: 'Outono', inverno: 'Inverno', primavera: 'Primavera' };
      return (crop.bestSeasons || []).map(s => map[s]).join(' e ');
    }

    function getPriceLevel(crop, monthIdx) {
      const p = crop.prices[monthIdx];
      const min = Math.min(...crop.prices);
      const max = Math.max(...crop.prices);
      const ratio = (p - min) / Math.max(1, max - min);
      if (ratio >= 0.66) return 'price-high';
      if (ratio >= 0.33) return 'price-mid';
      return 'price-low';
    }

    function ownsItem(itemId) {
      const bought = Array.isArray(state.ownedMachines) && state.ownedMachines.includes(itemId);
      const rented = Array.isArray(state.leasedMachines) && state.leasedMachines.some(l => l.itemId === itemId && l.harvestsLeft > 0);
      return bought || rented;
    }

    function addMachineWear(amount) {
      state.machineWear = Math.min(100, Math.max(0, (state.machineWear || 0) + amount));
    }

    function getPlowCostHa() {
      const base = ownsItem('trator_aracao') ? Math.round(BASE_PLOW_HA * 0.45) : BASE_PLOW_HA;
      return Math.round(base * (1 + ((state.machineWear || 0) / 300)));
    }

    function getCareCostHa() {
      const base = ownsItem('pulverizador_cuidado') ? Math.round(BASE_CARE_HA * 0.45) : BASE_CARE_HA;
      return Math.round(base * (1 + ((state.machineWear || 0) / 300)));
    }

    function getHarvestCostHa() {
      const base = ownsItem('colheitadeira_graos') ? Math.round(BASE_HARVEST_HA * 0.40) : BASE_HARVEST_HA;
      return Math.round(base * (1 + ((state.machineWear || 0) / 220)));
    }

    function getTransportRatePerSack(modeId = state.transportMode) {
      if (ownsItem('caminhao_proprio')) return 3.5;
      const mode = TRANSPORT_MODES[modeId] || TRANSPORT_MODES.camionete;
      return mode.rentPerSack;
    }

    function getFarmEquity() {
      const landVal = state.hectares.filter(h => h.owned).reduce((s, h) => s + (h.price || 45000), 0);
      const machVal = (state.ownedMachines || []).reduce((s, id) => {
        const it = SHOP_ITEMS.find(x => x.id === id);
        return s + (it ? Math.round(it.price * 0.65) : 0);
      }, 0);
      const siloVal = CROP_LIST.reduce((s, c) => s + ((state.silo[c.id] || 0) * c.prices[state.monthIndex]), 0);
      return Math.round(landVal + machVal + siloVal);
    }

    function getMaxLoanLimit() {
      const equity = getFarmEquity();
      return Math.max(25000, Math.min(250000, Math.round(equity * 0.45)));
    }

    function getPlantAreaEconomics(crop, monthIdx, areaHa, withCare = false, modeId = state.transportMode) {
      const plantCost = Math.round(areaHa * crop.plantCostHa);
      const plowCost = Math.round(areaHa * getPlowCostHa());
      const careCost = withCare ? Math.round(areaHa * getCareCostHa()) : 0;
      const harvestCost = Math.round(areaHa * getHarvestCostHa());
      const seasonInfo = getCropSeasonMultiplier(crop, monthIdx);
      const limeBonus = ownsItem('calcaria_adubo') ? 1.15 : 1.0;
      const baseSacks = areaHa * (crop.baseYieldPerHa + (withCare ? crop.careBonusYieldPerHa : 0)) * limeBonus;
      const sacks = +(baseSacks * seasonInfo.mult).toFixed(2);
      const transportCost = Math.round(sacks * getTransportRatePerSack(modeId));
      const totalCycleCost = plantCost + plowCost + careCost + harvestCost + transportCost;
      const grossRevenue = Math.round(sacks * crop.prices[monthIdx]);
      const estimatedProfit = grossRevenue - totalCycleCost;

      return {
        plantCost,
        sacks,
        transportCost,
        totalCycleCost,
        grossRevenue,
        estimatedProfit,
        seasonLabel: seasonInfo.label,
        seasonMult: seasonInfo.mult
      };
    }

    function generateAvailableContracts(hectaresList, monthIdx = 0) {
      const candidates = hectaresList.filter(h => !h.owned);
      if (candidates.length === 0) return [];
      const sorted = [...candidates].sort((a, b) => {
        const da = Math.abs(a.hc - 4) + Math.abs(a.hr - 4);
        const db = Math.abs(b.hc - 4) + Math.abs(b.hr - 4);
        return da - db;
      });
      const pool = sorted.slice(0, Math.min(18, sorted.length));
      const picked = [];
      const usedIds = new Set();
      const tasks = ['plow', 'plant', 'care', 'harvest'];
      const seasonCrops = CROP_LIST.filter(c => c.bestSeasons.includes(getSeasonInfo(monthIdx).id));
      const cropPool = seasonCrops.length ? seasonCrops : CROP_LIST;

      for (let i = 0; i < 3 && pool.length > 0; i++) {
        let ha = pool[Math.floor(Math.random() * pool.length)];
        let tries = 0;
        while (usedIds.has(ha.id) && tries < 12) {
          ha = pool[Math.floor(Math.random() * pool.length)];
          tries++;
        }
        usedIds.add(ha.id);

        const task = tasks[(i + Math.floor(Math.random() * tasks.length)) % tasks.length];
        const crop = cropPool[Math.floor(Math.random() * cropPool.length)];
        const neighbor = NEIGHBOR_NAMES[(ha.id + monthIdx + i) % NEIGHBOR_NAMES.length];

        let title = '';
        let reward = 0;
        let desc = '';

        if (task === 'plow') {
          title = `Arar Talhão (${ha.hc + 1},${ha.hr + 1})`;
          reward = 1450;
          desc = `${neighbor}: Prepare toda a terra (1 ha) do talhão (${ha.hc + 1},${ha.hr + 1}) usando a ferramenta Arar.`;
        } else if (task === 'plant') {
          title = `Semear ${crop.name} (${ha.hc + 1},${ha.hr + 1})`;
          reward = Math.round(crop.plantCostHa + 1350);
          desc = `${neighbor}: Semeie ${crop.name} em todo o talhão (${ha.hc + 1},${ha.hr + 1}). O contrato reembolsa a semente e paga o serviço.`;
        } else if (task === 'care') {
          title = `Pulverizar ${crop.name} (${ha.hc + 1},${ha.hr + 1})`;
          reward = 1750;
          desc = `${neighbor}: Aplique defensivo/adubo com Cuidar em todo o talhão (${ha.hc + 1},${ha.hr + 1}).`;
        } else {
          title = `Colher ${crop.name} (${ha.hc + 1},${ha.hr + 1})`;
          reward = 2150;
          desc = `${neighbor}: Colha a lavoura madura do talhão (${ha.hc + 1},${ha.hr + 1}) com Colher Tudo (os grãos vão p/ o vizinho).`;
        }

        picked.push({
          id: `fs_${Date.now()}_${i}_${ha.id}`,
          task,
          cropId: crop.id,
          haId: ha.id,
          hc: ha.hc,
          hr: ha.hr,
          neighbor,
          title,
          reward,
          desc,
          progress: 0
        });
      }
      return picked;
    }

    function setupContractField(contract) {
      const ha = state.hectares.find(h => h.id === contract.haId);
      if (!ha) return;
      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (contract.task === 'plow') {
            t.state = 'raw';
            t.cropId = null;
            t.growthMonths = 0;
            t.cared = false;
          } else if (contract.task === 'plant') {
            t.state = 'plowed';
            t.cropId = null;
            t.growthMonths = 0;
            t.cared = false;
          } else if (contract.task === 'care') {
            t.state = 'planted';
            t.cropId = contract.cropId;
            t.growthMonths = 1;
            t.cared = false;
          } else if (contract.task === 'harvest') {
            const c = CROPS[contract.cropId] || CROPS.soja;
            t.state = 'planted';
            t.cropId = c.id;
            t.growthMonths = c.monthsToGrow;
            t.cared = true;
          }
        }
      }
    }

    function clearContractField(haId) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || ha.owned) return;
      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          state.tiles[ty * TOTAL_TILE_COLS + tx] = {
            state: 'raw',
            cropId: null,
            growthMonths: 0,
            cared: false,
            lastCropId: null,
            monocultureCount: 0
          };
        }
      }
    }

    function evaluateActiveContractProgress() {
      const c = state.activeContract;
      if (!c) return;
      const ha = state.hectares.find(h => h.id === c.haId);
      if (!ha) return;

      let done = 0;
      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (c.task === 'plow' && t.state === 'plowed') done++;
          else if (c.task === 'plant' && t.state === 'planted' && t.cropId === c.cropId) done++;
          else if (c.task === 'care' && t.state === 'planted' && t.cared) done++;
          else if (c.task === 'harvest' && t.state === 'plowed' && !t.cropId) done++;
        }
      }

      c.progress = Math.round((done / TILES_PER_HA) * 100);
      if (done >= TILES_PER_HA) {
        const payout = c.reward;
        state.money += payout;
        clearContractField(c.haId);
        state.activeContract = null;
        state.availableContracts = generateAvailableContracts(state.hectares, state.monthIndex);
        updateHUD();
        renderWorld();
        playSfx('coin');
        showToast(`✅ Contrato concluído (100%)! Recebeu ${formatBRL(payout)} de ${c.neighbor}.`);
      }
    }

    function createInitialState() {
      const hectares = [];
      for (let hr = 0; hr < HA_ROWS; hr++) {
        for (let hc = 0; hc < HA_COLS; hc++) {
          const idx = hr * HA_COLS + hc;
          const soilQuality = ((hc * 7 + hr * 13) % 5) / 4;
          const price = Math.round(35000 + soilQuality * 33000);
          const owned = (hc === 4 && hr === 4);
          hectares.push({
            id: idx,
            hc,
            hr,
            owned,
            price,
            isPasture: false,
            facilityType: null,
            paddockGroupId: idx,
            grassLevel: 100,
            pastureActive: false,
            restMonths: 0,
            pastureDegraded: false
          });
        }
      }

      const tiles = new Array(TOTAL_TILE_COLS * TOTAL_TILE_ROWS).fill(null).map((_, i) => {
        const tx = i % TOTAL_TILE_COLS;
        const ty = Math.floor(i / TOTAL_TILE_COLS);
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        const lx = tx % SUB_SIZE;
        const ly = ty % SUB_SIZE;

        if (hc === 4 && hr === 4) {
          const isPlanted = (lx === 2 || lx === 3) && (ly === 3 || ly === 4);
          const isPlowed =
            (ly === 2 && lx >= 2 && lx <= 5) ||
            (ly === 3 && (lx === 1 || lx === 4)) ||
            (ly === 5 && lx >= 2 && lx <= 5) ||
            (ly === 6 && lx === 3);
          if (isPlanted) {
            return { state: 'planted', cropId: 'soja', growthMonths: 2, cared: false, lastCropId: null, monocultureCount: 0 };
          }
          if (isPlowed) {
            return { state: 'plowed', cropId: null, growthMonths: 0, cared: false, lastCropId: null, monocultureCount: 0 };
          }
        }
        return { state: 'raw', cropId: null, growthMonths: 0, cared: false, lastCropId: null, monocultureCount: 0 };
      });

      return {
        money: 500000,
        monthIndex: 0,
        year: 1,
        transportMode: 'camionete',
        ownedMachines: [],
        leasedMachines: [],
        claimedAuctionLots: [],
        loans: [],
        silo: { soja: 0, milho: 0, trigo: 0, canola: 0, sorgo: 0, aveia: 0 },
        silageKg: 0,
        milkLiters: 0,
        woolKg: 0,
        eggsDozens: 0,
        machineWear: 12,
        activeContract: null,
        availableContracts: generateAvailableContracts(hectares, 0),
        useSilageToSavePasture: true,
        cattle: [],
        activeTasks: [],
        hectares,
        tiles
      };
    }

    let state = createInitialState();
    let currentTool = 'plow';
    let selectedCropId = 'soja';
    let selectedTileKeys = new Set();
    let selectedHaIdToBuy = null;
    let pendingAction = null;
    let activeFinanceTab = 'sim';
    let activeShopTab = 'all';

    let camX = 0;
    let camY = 0;
    let zoom = 1.0;
    const MIN_ZOOM = 0.12;
    const MAX_ZOOM = 2.4;
    let panModeActive = false;

    let activePointers = new Map();
    let isPanning = false;
    let isBoxSelecting = false;
    let panStartScreen = { x: 0, y: 0 };
    let panStartCam = { x: 0, y: 0 };
    let pinchStartDist = 0;
    let pinchStartZoom = 1;
    let pinchStartMidWorld = null;
    let boxStartWorld = null;
    let boxCurrentWorld = null;

    let auto10sTimer = null;
    let auto10sSeconds = 10;

    const canvas = document.getElementById('farmCanvas');
    const ctx = canvas.getContext('2d');
    const worldViewport = document.getElementById('worldViewport');

    function resizeCanvas() {
      const rect = worldViewport.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      clampCamera();
      renderWorld();
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - camX) / zoom,
        y: (sy - camY) / zoom
      };
    }

    function clampCamera() {
      const rect = worldViewport.getBoundingClientRect();
      const viewW = rect.width;
      const viewH = rect.height;
      const scaledMap = MAP_PX * zoom;
      const pad = 80;

      if (scaledMap + pad * 2 <= viewW) {
        camX = (viewW - scaledMap) / 2;
      } else {
        camX = Math.min(pad, Math.max(viewW - scaledMap - pad, camX));
      }

      if (scaledMap + pad * 2 <= viewH) {
        camY = (viewH - scaledMap) / 2;
      } else {
        camY = Math.min(pad, Math.max(viewH - scaledMap - pad, camY));
      }
    }

    function focusMainHectare() {
      const rect = worldViewport.getBoundingClientRect();
      const targetZoom = Math.min(1.6, Math.max(0.75, (Math.min(rect.width, rect.height) - 20) / HA_PX));
      zoom = +targetZoom.toFixed(2);
      const centerWorldX = 4 * HA_PX + HA_PX / 2;
      const centerWorldY = 4 * HA_PX + HA_PX / 2;
      camX = rect.width / 2 - centerWorldX * zoom;
      camY = rect.height / 2 - centerWorldY * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function fitAllHectares() {
      const rect = worldViewport.getBoundingClientRect();
      const fitZoom = Math.max(MIN_ZOOM, (Math.min(rect.width, rect.height) - 16) / MAP_PX);
      zoom = +fitZoom.toFixed(2);
      camX = (rect.width - MAP_PX * zoom) / 2;
      camY = (rect.height - MAP_PX * zoom) / 2;
      clampCamera();
      updateZoomBadge();
      renderWorld();
      showToast('Mapa completo dos 100 hectares');
    }

    function zoomBy(factor, pivotSx, pivotSy) {
      const rect = worldViewport.getBoundingClientRect();
      const px = pivotSx ?? rect.width / 2;
      const py = pivotSy ?? rect.height / 2;
      const worldBefore = screenToWorld(px, py);
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, +(zoom * factor).toFixed(2)));
      camX = px - worldBefore.x * zoom;
      camY = py - worldBefore.y * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function updateZoomBadge() {
      document.getElementById('zoomReadout').textContent = Math.round(zoom * 100) + '%';
      const rect = worldViewport.getBoundingClientRect();
      const centerWorld = screenToWorld(rect.width / 2, rect.height / 2);
      const hc = Math.min(HA_COLS, Math.max(1, Math.floor(centerWorld.x / HA_PX) + 1));
      const hr = Math.min(HA_ROWS, Math.max(1, Math.floor(centerWorld.y / HA_PX) + 1));
      const label = (hc === 5 && hr === 5) ? 'Hectare Principal (5,5)' : `Hectare (${hc},${hr})`;
      document.getElementById('sectorBadge').textContent = `${label} · 100 ha`;
    }

    function togglePanMode() {
      panModeActive = !panModeActive;
      document.getElementById('btnPanToggle').classList.toggle('active', panModeActive);
      canvas.classList.toggle('pan-mode', panModeActive);
      showToast(panModeActive ? 'Modo Mover Câmera ativado (1 dedo)' : 'Modo Selecionar Área ativado');
    }

    function clearSelection() {
      selectedTileKeys.clear();
      selectedHaIdToBuy = null;
      pendingAction = null;
      document.getElementById('confirmCard').classList.remove('open');
      renderWorld();
    }

    function isContractHectare(haId) {
      return Boolean(state.activeContract && state.activeContract.haId === haId);
    }

    function getBusyTileSet() {
      const busy = new Set();
      (state.activeTasks || []).forEach(task => {
        if (Array.isArray(task.tileKeys)) {
          task.tileKeys.forEach(k => busy.add(k));
        }
      });
      return busy;
    }

    function hasHarvestTaskInProgress() {
      return (state.activeTasks || []).some(t => t.type === 'harvest');
    }

    function selectSingleOrBox(x1, y1, x2, y2) {
      const minX = Math.max(0, Math.min(x1, x2));
      const maxX = Math.min(MAP_PX - 0.01, Math.max(x1, x2));
      const minY = Math.max(0, Math.min(y1, y2));
      const maxY = Math.min(MAP_PX - 0.01, Math.max(y1, y2));

      if (maxX < minX || maxY < minY) return;

      const isSingleTap = Math.hypot(x2 - x1, y2 - y1) < 8;
      if (isSingleTap) {
        const tx = Math.floor(minX / TILE_PX);
        const ty = Math.floor(minY / TILE_PX);
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        const ha = state.hectares[hr * HA_COLS + hc];
        if (!ha.owned && !isContractHectare(ha.id)) {
          selectedTileKeys.clear();
          selectedHaIdToBuy = ha.id;
          playSfx('select');
          prepareBuyHectareConfirmation(ha);
          renderWorld();
          return;
        }
        if (ha.owned && getHectareFacilityType(ha)) {
          selectedTileKeys.clear();
          selectedHaIdToBuy = null;
          playSfx('click');
          openModal('livestock');
          renderWorld();
          return;
        }
      }

      selectedHaIdToBuy = null;
      selectedTileKeys.clear();

      const txMin = Math.floor(minX / TILE_PX);
      const txMax = Math.floor(maxX / TILE_PX);
      const tyMin = Math.floor(minY / TILE_PX);
      const tyMax = Math.floor(maxY / TILE_PX);

      for (let ty = tyMin; ty <= tyMax; ty++) {
        for (let tx = txMin; tx <= txMax; tx++) {
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          if ((ha.owned && !getHectareFacilityType(ha)) || isContractHectare(ha.id)) {
            selectedTileKeys.add(`${tx},${ty}`);
          }
        }
      }

      if (selectedTileKeys.size > 0) {
        playSfx('select');
        prepareAreaActionConfirmation();
      } else {
        document.getElementById('confirmCard').classList.remove('open');
      }
      renderWorld();
    }

    function prepareBuyHectareConfirmation(ha) {
      const canBuy = state.money >= ha.price;
      pendingAction = { type: 'buy_ha', haId: ha.id, cost: ha.price };

      document.getElementById('confirmTitle').textContent = `Comprar Hectare (${ha.hc + 1}, ${ha.hr + 1})`;
      document.getElementById('confirmSummaryBoxes').innerHTML = `
        <div class="summary-box"><span>Valor do Hectare</span><strong>${formatBRL(ha.price)}</strong></div>
        <div class="summary-box"><span>Caixa Após</span><strong class="${canBuy ? 'profit-pos' : 'profit-neg'}">${formatBRL(state.money - ha.price)}</strong></div>
      `;
      document.getElementById('confirmSubInfo').textContent = `1 hectare = 64 blocos (8x8). Caixa atual: ${formatBRL(state.money)}.`;

      const btn = document.getElementById('confirmExecuteBtn');
      btn.disabled = !canBuy;
      btn.style.opacity = canBuy ? '1' : '0.5';
      btn.textContent = canBuy ? 'Comprar' : 'Sem Saldo';
      document.getElementById('confirmCard').classList.add('open');
    }

    function prepareAreaActionConfirmation() {
      const crop = CROPS[selectedCropId];
      const month = state.monthIndex;
      const busyTiles = getBusyTileSet();

      const coords = [];
      let blockedCount = 0;
      selectedTileKeys.forEach((key) => {
        if (busyTiles.has(key)) {
          blockedCount++;
          return;
        }
        const [tx, ty] = key.split(',').map(Number);
        coords.push([tx, ty]);
      });

      const activeC = state.activeContract;
      const isContractTile = (tx, ty) => {
        if (!activeC) return false;
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        return (hr * HA_COLS + hc) === activeC.haId;
      };

      let eligible = [];
      let actionCost = 0;
      let titleText = '';
      let btnText = 'Confirmar';
      let boxesHtml = '';
      let subText = '';
      let durationSec = 0;

      const isAccelerated = Boolean(auto10sTimer);

      if (currentTool === 'plant') {
        eligible = coords.filter(([tx, ty]) => {
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (t.state !== 'plowed') return false;
          if (isContractTile(tx, ty)) {
            return activeC.task === 'plant' && crop.id === activeC.cropId;
          }
          return true;
        });
        const ownCount = eligible.filter(([tx, ty]) => !isContractTile(tx, ty)).length;
        const contractCount = eligible.length - ownCount;
        const areaHa = eligible.length / TILES_PER_HA;
        durationSec = eligible.length > 0 ? computeTaskDurationSeconds('plant', areaHa) : 0;
        const econ = getPlantAreaEconomics(crop, month, areaHa, false, state.transportMode);
        actionCost = econ.plantCost;

        const busyNote = blockedCount > 0 ? ` · ⏳ ${blockedCount} bloco(s) já em serviço` : '';

        if (contractCount > 0 && ownCount === 0) {
          titleText = `Contrato: Semear ${crop.name} (${eligible.length} blocos)`;
          btnText = eligible.length ? 'Iniciar Serviço' : 'Sem Área Livre';
          boxesHtml = `
            <div class="summary-box"><span>Duração Real (${areaHa.toFixed(2)} ha)</span><strong>${formatDurationSec(durationSec)}</strong></div>
            <div class="summary-box"><span>Pagamento ao Concluir</span><strong class="profit-pos">${formatBRL(activeC.reward)}</strong></div>
          `;
          subText = `Insumo semente: ${formatBRL(actionCost)} (reembolsado). Ao concluir 100%, recebe ${formatBRL(activeC.reward)}${busyNote}.`;
        } else {
          titleText = `Plantar ${crop.name} (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
          btnText = eligible.length ? 'Iniciar Plantio' : (blockedCount > 0 ? 'Área Ocupada' : (activeC && activeC.task === 'plant' ? `Use ${CROPS[activeC.cropId].name}` : 'Are Antes'));

          const repeatCount = eligible.filter(([tx, ty]) => !isContractTile(tx, ty) && state.tiles[ty * TOTAL_TILE_COLS + tx].lastCropId === crop.id).length;
          const rotNote = repeatCount > 0 ? ` · ⚠️ ${repeatCount} bloco(s) repetindo ${crop.name}` : ' · ✅ Boa rotação';

          boxesHtml = `
            <div class="summary-box"><span>Tempo Estimado</span><strong>${formatDurationSec(durationSec)}</strong></div>
            <div class="summary-box"><span>Lucro Líquido Est.</span><strong class="${econ.estimatedProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(econ.estimatedProfit)}</strong></div>
          `;
          subText = `Custo ${formatBRL(econ.plantCost)} · ${econ.seasonLabel}${rotNote}${busyNote}.`;
        }
      } else if (currentTool === 'plow') {
        eligible = coords.filter(([tx, ty]) => {
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (t.state !== 'raw') return false;
          if (isContractTile(tx, ty)) return activeC.task === 'plow';
          return true;
        });
        const areaHa = eligible.length / TILES_PER_HA;
        durationSec = eligible.length > 0 ? computeTaskDurationSeconds('plow', areaHa) : 0;
        actionCost = Math.round(areaHa * getPlowCostHa());
        titleText = `Arar Área (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
        btnText = eligible.length ? 'Iniciar Aração' : (blockedCount > 0 ? 'Área Ocupada' : 'Nada p/ Arar');

        const busyNote = blockedCount > 0 ? ` · ⏳ ${blockedCount} bloco(s) já em serviço` : '';
        boxesHtml = `
          <div class="summary-box"><span>Duração Estimada</span><strong>${formatDurationSec(durationSec)}</strong></div>
          <div class="summary-box"><span>Custo Operacional</span><strong>${formatBRL(actionCost)}</strong></div>
        `;
        subText = `Ritmo: 6 min/ha${isAccelerated ? ` (${TEST_MODE_WORK_SPEEDUP}x acelerado)` : ''} · Custo: ${formatBRL(getPlowCostHa())}/ha${busyNote}.`;
      } else if (currentTool === 'care') {
        eligible = coords.filter(([tx, ty]) => {
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (t.state !== 'planted' || !t.cropId) return false;
          if (isContractTile(tx, ty)) return activeC.task === 'care' && !t.cared;
          const c = CROPS[t.cropId];
          return !t.cared && t.growthMonths < c.monthsToGrow;
        });
        const areaHa = eligible.length / TILES_PER_HA;
        durationSec = eligible.length > 0 ? computeTaskDurationSeconds('care', areaHa) : 0;
        actionCost = Math.round(areaHa * getCareCostHa());
        titleText = `Cuidar / Pulverizar (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
        btnText = eligible.length ? 'Iniciar Cuidado' : (blockedCount > 0 ? 'Área Ocupada' : 'Nada p/ Cuidar');

        const busyNote = blockedCount > 0 ? ` · ⏳ ${blockedCount} bloco(s) já em serviço` : '';
        boxesHtml = `
          <div class="summary-box"><span>Duração Estimada</span><strong>${formatDurationSec(durationSec)}</strong></div>
          <div class="summary-box"><span>Custo Insumo/Máquina</span><strong>${formatBRL(actionCost)}</strong></div>
        `;
        subText = `Ritmo: 10 min/ha${isAccelerated ? ` (${TEST_MODE_WORK_SPEEDUP}x acelerado)` : ''} · Custo: ${formatBRL(getCareCostHa())}/ha${busyNote}.`;
      }

      const canAfford = eligible.length > 0 && state.money >= actionCost;
      pendingAction = {
        type: currentTool,
        cropId: crop.id,
        coords: eligible,
        cost: actionCost,
        durationSec
      };

      document.getElementById('confirmTitle').textContent = titleText;
      document.getElementById('confirmSummaryBoxes').innerHTML = boxesHtml;
      document.getElementById('confirmSubInfo').textContent = subText;

      const btn = document.getElementById('confirmExecuteBtn');
      btn.disabled = !canAfford;
      btn.style.opacity = canAfford ? '1' : '0.5';
      btn.textContent = !eligible.length ? btnText : (state.money >= actionCost ? btnText : 'Sem Saldo');
      document.getElementById('confirmCard').classList.add('open');
    }

    function executeConfirmedAction() {
      if (!pendingAction) return;
      const act = pendingAction;

      if (act.type === 'buy_ha') {
        const ha = state.hectares[act.haId];
        if (!ha || ha.owned || state.money < ha.price) {
          playSfx('error');
          return;
        }
        state.money -= ha.price;
        ha.owned = true;
        clearSelection();
        updateHUD();
        renderWorld();
        playSfx('coin');
        showToast(`Comprou Hectare (${ha.hc + 1},${ha.hr + 1})!`);
        return;
      }

      if (!act.coords || !act.coords.length) {
        playSfx('error');
        showToast('Nenhum bloco válido e livre selecionado.');
        return;
      }

      if (state.money < act.cost) {
        playSfx('error');
        showToast('Saldo insuficiente para iniciar o serviço.');
        return;
      }

      const busyTiles = getBusyTileSet();
      const freeCoords = act.coords.filter(([tx, ty]) => !busyTiles.has(`${tx},${ty}`));
      if (freeCoords.length === 0) {
        playSfx('error');
        showToast('Esses blocos já estão com serviço em andamento!');
        return;
      }

      const areaHa = freeCoords.length / TILES_PER_HA;
      const durationSec = computeTaskDurationSeconds(act.type, areaHa);
      const scaledCost = Math.round(act.cost * (freeCoords.length / act.coords.length));

      state.money -= scaledCost;
      state.activeTasks = state.activeTasks || [];
      state.activeTasks.push({
        id: `task_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        type: act.type,
        cropId: act.cropId || null,
        tileKeys: freeCoords.map(([tx, ty]) => `${tx},${ty}`),
        totalSeconds: durationSec,
        remainingSeconds: durationSec,
        costPaid: scaledCost
      });

      const labelMap = { plow: 'Aração', plant: 'Plantio', care: 'Cuidado' };
      const sfxStartMap = { plow: 'plow_start', plant: 'plant_start', care: 'care_start' };
      playSfx(sfxStartMap[act.type] || 'click');
      clearSelection();
      updateHUD();
      renderWorld();
      showToast(`⏳ ${labelMap[act.type] || 'Serviço'} iniciado (${formatDurationSec(durationSec)})`);
    }

    function finalizeCompletedTask(task) {
      const coords = (task.tileKeys || []).map(k => k.split(',').map(Number));

      if (task.type === 'plow') {
        coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile) return;
          tile.state = 'plowed';
          tile.cropId = null;
          tile.growthMonths = 0;
          tile.cared = false;
        });
        addMachineWear(Math.max(1, Math.round(coords.length / 24)));
        playSfx('done');
        showToast(`✅ Aração concluída (${coords.length} blocos)!`);
      } else if (task.type === 'plant') {
        coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile) return;
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const isContract = isContractHectare(hr * HA_COLS + hc);
          if (!isContract) {
            const sameAsLast = tile.lastCropId === task.cropId;
            tile.monocultureCount = sameAsLast ? ((tile.monocultureCount || 0) + 1) : 0;
            tile.lastCropId = task.cropId;
          }
          tile.state = 'planted';
          tile.cropId = task.cropId;
          tile.growthMonths = 0;
          tile.cared = false;
        });
        addMachineWear(Math.max(1, Math.round(coords.length / 36)));
        playSfx('done');
        showToast(`✅ Plantio de ${CROPS[task.cropId]?.name || 'cultura'} concluído!`);
      } else if (task.type === 'care') {
        coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile) return;
          if (tile.state === 'planted' && tile.cropId) {
            const c = CROPS[tile.cropId];
            tile.cared = true;
            tile.growthMonths = Math.min(c.monthsToGrow, tile.growthMonths + 1);
          }
        });
        addMachineWear(Math.max(1, Math.round(coords.length / 28)));
        playSfx('done');
        showToast(`✅ Cuidado aplicado em ${coords.length} bloco(s)!`);
      } else if (task.type === 'harvest') {
        const wearFactor = Math.max(0.75, 1 - ((state.machineWear || 0) / 250));
        const limeBonus = ownsItem('calcaria_adubo') ? 1.15 : 1.0;
        const sacksAdded = { soja: 0, milho: 0, trigo: 0, canola: 0, sorgo: 0, aveia: 0 };
        let ownHarvestedCount = 0;

        coords.forEach(([tx, ty]) => {
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (!tile || !tile.cropId) return;
          const crop = CROPS[tile.cropId];
          if (!crop) return;
          const isContract = isContractHectare(ha.id) && state.activeContract?.task === 'harvest';

          if (!isContract) {
            ownHarvestedCount++;
            const sMult = getCropSeasonMultiplier(crop, state.monthIndex).mult;
            const rotPenalty = (tile.monocultureCount && tile.monocultureCount > 0)
              ? Math.max(0.72, 1 - tile.monocultureCount * (ownsItem('calcaria_adubo') ? 0.05 : 0.10))
              : 1.0;
            const yieldHa = (crop.baseYieldPerHa + (tile.cared ? crop.careBonusYieldPerHa : 0)) * sMult * limeBonus * rotPenalty * wearFactor;
            if (sacksAdded[crop.id] === undefined) sacksAdded[crop.id] = 0;
            sacksAdded[crop.id] += yieldHa / TILES_PER_HA;
          }

          tile.state = 'plowed';
          tile.cropId = null;
          tile.growthMonths = 0;
          tile.cared = false;
        });

        addMachineWear(Math.max(1, Math.round(coords.length / 20)));

        Object.keys(sacksAdded).forEach((cid) => {
          state.silo[cid] = +((state.silo[cid] || 0) + sacksAdded[cid]).toFixed(2);
        });

        if (ownHarvestedCount > 0) {
          let loanChargedOnHarvest = 0;
          if (state.loans.length > 0) {
            const remainingLoans = [];
            state.loans.forEach((loan) => {
              const pay = Math.min(loan.installmentAmount, loan.remainingBalance);
              loanChargedOnHarvest += pay;
              const nextBal = loan.remainingBalance - pay;
              const nextInstLeft = loan.installmentsLeft - 1;
              if (nextBal > 0 && nextInstLeft > 0) {
                remainingLoans.push({
                  ...loan,
                  remainingBalance: nextBal,
                  installmentsLeft: nextInstLeft
                });
              }
            });
            state.loans = remainingLoans;
            state.money -= loanChargedOnHarvest;
          }

          if (Array.isArray(state.leasedMachines) && state.leasedMachines.length > 0) {
            const stillLeased = [];
            state.leasedMachines.forEach((lease) => {
              const fee = lease.rentPerHarvest || 0;
              if (state.money >= fee) {
                state.money -= fee;
              }
              const left = (lease.harvestsLeft || 1) - 1;
              if (left > 0) {
                stillLeased.push({ ...lease, harvestsLeft: left });
              }
            });
            state.leasedMachines = stillLeased;
          }
        }

        const totalSc = Object.values(sacksAdded).reduce((a, b) => a + b, 0);
        playSfx('done');
        showToast(`✅ Colheita concluída (${totalSc.toFixed(1)} sc p/ Silo)!`);
      }

      evaluateActiveContractProgress();
    }

    function tickBackgroundWork(elapsedSec = 1) {
      if (!Array.isArray(state.activeTasks) || state.activeTasks.length === 0) return;

      let anyCompleted = false;
      const stillRunning = [];

      state.activeTasks.forEach(task => {
        task.remainingSeconds = Math.max(0, (task.remainingSeconds ?? task.totalSeconds) - elapsedSec);
        if (task.remainingSeconds <= 0) {
          finalizeCompletedTask(task);
          anyCompleted = true;
        } else {
          stillRunning.push(task);
        }
      });

      state.activeTasks = stillRunning;
      if (anyCompleted) {
        updateHUD();
        renderWorld();
      }
    }

    function triggerInstantHarvestAll() {
      setTool('harvest');
      if (hasHarvestTaskInProgress()) {
        const hTask = state.activeTasks.find(t => t.type === 'harvest');
        playSfx('error');
        showToast(`⏳ Colheita já em andamento (${formatDurationSec(hTask?.remainingSeconds || 0)} restantes).`);
        return;
      }

      const busyTiles = getBusyTileSet();
      const ripeTiles = [];

      for (let ty = 0; ty < TOTAL_TILE_ROWS; ty++) {
        for (let tx = 0; tx < TOTAL_TILE_COLS; tx++) {
          if (busyTiles.has(`${tx},${ty}`)) continue;
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          const isContract = isContractHectare(ha.id) && state.activeContract?.task === 'harvest';
          if ((ha.owned || isContract) && tile.state === 'planted' && tile.cropId) {
            const c = CROPS[tile.cropId];
            if (tile.growthMonths >= c.monthsToGrow) {
              ripeTiles.push({ tx, ty, tile, crop: c, isContract });
            }
          }
        }
      }

      if (ripeTiles.length === 0) {
        playSfx('error');
        showToast('Nenhuma lavoura madura disponível para colher agora.');
        return;
      }

      const harvestRateHa = getHarvestCostHa();
      const costInt = Math.round(ripeTiles.length * (harvestRateHa / TILES_PER_HA));
      if (state.money < costInt) {
        playSfx('error');
        showToast(`Saldo insuficiente para colher (${formatBRL(costInt)})!`);
        return;
      }

      const areaHa = ripeTiles.length / TILES_PER_HA;
      const durationSec = computeTaskDurationSeconds('harvest', areaHa);

      state.money -= costInt;
      state.activeTasks = state.activeTasks || [];
      state.activeTasks.push({
        id: `task_harvest_${Date.now()}`,
        type: 'harvest',
        cropId: null,
        tileKeys: ripeTiles.map(({ tx, ty }) => `${tx},${ty}`),
        totalSeconds: durationSec,
        remainingSeconds: durationSec,
        costPaid: costInt
      });

      playSfx('harvest_start');
      clearSelection();
      updateHUD();
      renderWorld();
      showToast(`⏳ Colheita iniciada (${formatDurationSec(durationSec)} · custo ${formatBRL(costInt)})`);
    }

    function hashCoord(a, b) {
      const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function recalcSimulator() {
      const cropId = document.getElementById('simCrop')?.value || 'soja';
      const ha = Math.max(0.25, Number(document.getElementById('simHa')?.value) || 1);
      const modeId = document.getElementById('simTransport')?.value || state.transportMode;
      const crop = CROPS[cropId];
      const econ = getPlantAreaEconomics(crop, state.monthIndex, ha, false, modeId);
      const installmentPerHarvest = state.loans.reduce((s, l) => s + l.installmentAmount, 0);
      const afterLoanProfit = econ.estimatedProfit - installmentPerHarvest;

      const box = document.getElementById('simResultBox');
      const verdict = document.getElementById('simVerdict');
      if (!box || !verdict) return;

      box.innerHTML = `
        <div class="summary-box"><span>Investimento Total Ciclo</span><strong>${formatBRL(econ.totalCycleCost)}</strong></div>
        <div class="summary-box"><span>Lucro Est. da Safra</span><strong class="${econ.estimatedProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(econ.estimatedProfit)}</strong></div>
        <div class="summary-box"><span>Parcelas Empréstimo/Safra</span><strong>${formatBRL(installmentPerHarvest)}</strong></div>
        <div class="summary-box"><span>Sobra p/ Pagar Empréstimo</span><strong class="${afterLoanProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(afterLoanProfit)}</strong></div>
      `;

      if (installmentPerHarvest === 0) {
        verdict.textContent = `${crop.name}: ${econ.seasonLabel} (ideal: ${getBestSeasonNames(crop)}) · ${econ.sacks.toFixed(1)} sc · Receita bruta ${formatBRL(econ.grossRevenue)}.`;
      } else if (afterLoanProfit >= 0) {
        verdict.innerHTML = `<span class="profit-pos">Cobre as parcelas:</span> o lucro estimado cobre os ${formatBRL(installmentPerHarvest)} da safra e ainda sobra ${formatBRL(afterLoanProfit)}.`;
      } else {
        verdict.innerHTML = `<span class="profit-neg">Atenção:</span> o lucro estimado não cobre os ${formatBRL(installmentPerHarvest)} de parcelas desta safra (falta ${formatBRL(Math.abs(afterLoanProfit))}).`;
      }
    }

    function changeTransportMode(newMode) {
      if (TRANSPORT_MODES[newMode]) {
        state.transportMode = newMode;
        showToast(`Transporte alterado para ${TRANSPORT_MODES[newMode].name}`);
        if (selectedTileKeys.size > 0 && currentTool !== 'harvest') {
          prepareAreaActionConfirmation();
        }
        closeModal();
        openModal('silo');
      }
    }

    function buyMachine(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || ownsItem(itemId) || state.money < item.price) {
        showToast('Saldo insuficiente para este equipamento.');
        return;
      }
      state.money -= item.price;
      state.ownedMachines.push(itemId);
      updateHUD();
      setTool(currentTool);
      showToast(`Comprou ${item.name}! Custos reduzidos.`);
      closeModal();
      openModal('shop', activeShopTab);
    }

    function getLoanCalculation(principal, installments) {
      const cleanP = Math.max(0, Math.min(60000, Math.round(principal || 0)));
      const inst = Math.max(2, Math.min(4, Number(installments) || 3));
      const interestRate = 0.02 * inst;
      const totalWithInterest = Math.round(cleanP * (1 + interestRate));
      const installmentAmount = Math.round(totalWithInterest / inst);
      return { cleanP, inst, interestRate, totalWithInterest, installmentAmount };
    }

    function previewLoanTerms() {
      const box = document.getElementById('loanPreviewBox');
      const btn = document.getElementById('btnTakeLoan');
      if (!box) return;
      const p = Number(document.getElementById('loanPrincipal')?.value) || 0;
      const inst = Number(document.getElementById('loanInstallments')?.value) || 3;
      const calc = getLoanCalculation(p, inst);
      const atLimit = state.loans.length >= 2;
      const validAmount = calc.cleanP >= 2000 && calc.cleanP <= 60000;

      box.innerHTML = `
        <span>Resumo Antes de Aceitar (${(calc.interestRate * 100).toFixed(0)}% juros no total)</span>
        <strong>Parcela por colheita: ${formatBRL(calc.installmentAmount)} (${calc.inst}x de ${formatBRL(calc.installmentAmount)} · Total ${formatBRL(calc.totalWithInterest)})</strong>
      `;
      if (btn) {
        const ok = !atLimit && validAmount;
        btn.disabled = !ok;
        btn.style.opacity = ok ? '1' : '0.5';
      }
    }

    function takeHarvestLoan() {
      if (state.loans.length >= 2) {
        showToast('Limite atingido: máximo de 2 empréstimos ativos.');
        return;
      }
      const principal = Math.round(Number(document.getElementById('loanPrincipal').value) || 0);
      const installments = Number(document.getElementById('loanInstallments').value) || 3;
      if (principal < 2000 || principal > 60000) {
        showToast('Valor permitido: entre R$ 2.000 e R$ 60.000.');
        return;
      }
      const calc = getLoanCalculation(principal, installments);

      state.money += calc.cleanP;
      state.loans.push({
        id: Date.now() + Math.random(),
        principal: calc.cleanP,
        totalWithInterest: calc.totalWithInterest,
        remainingBalance: calc.totalWithInterest,
        installmentsLeft: calc.inst,
        installmentAmount: calc.installmentAmount
      });

      updateHUD();
      showToast(`Empréstimo aceito: ${calc.inst}x de ${formatBRL(calc.installmentAmount)} após colher.`);
      closeModal();
      openModal('finance', 'loans');
    }

    function payOneInstallment(loanId) {
      const idx = state.loans.findIndex((l) => l.id === loanId);
      if (idx === -1) return;
      const loan = state.loans[idx];
      const pay = Math.min(loan.installmentAmount, loan.remainingBalance);
      if (state.money < pay) {
        showToast('Saldo insuficiente para pagar a parcela.');
        return;
      }
      state.money -= pay;
      loan.remainingBalance -= pay;
      loan.installmentsLeft -= 1;
      if (loan.remainingBalance <= 0 || loan.installmentsLeft <= 0) {
        state.loans.splice(idx, 1);
      }
      updateHUD();
      showToast(`Pagou parcela de ${formatBRL(pay)}!`);
      closeModal();
      openModal('finance', 'loans');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function onBackdropClick(e) {
      if (e.target.id === 'modalBackdrop') closeModal();
    }

    function sellCrop(cropId) {
      const crop = CROPS[cropId];
      const qty = Number(document.getElementById(`sellQty_${cropId}`).value);
      if (!Number.isFinite(qty) || qty <= 0 || qty > state.silo[cropId] + 1e-6) {
        showToast('Quantidade inválida no Silo!');
        return;
      }

      if (!ownsItem('caminhao_proprio')) {
        const mode = TRANSPORT_MODES[state.transportMode] || TRANSPORT_MODES.camionete;
        if (qty < mode.minSacks || qty > mode.maxSacks) {
          showToast(`${mode.name} leva de ${mode.minSacks} a ${mode.maxSacks} sacas por viagem.`);
          return;
        }
      }

      const rate = getTransportRatePerSack(state.transportMode);
      const gross = qty * crop.prices[state.monthIndex];
      const freight = qty * rate;
      const net = Math.round(gross - freight);
      state.silo[cropId] = Math.max(0, +(state.silo[cropId] - qty).toFixed(2));
      state.money += net;
      updateHUD();
      showToast(`Vendeu ${qty} sc · Frete ${formatBRL(freight)} · Líquido: ${formatBRL(net)}`);
      closeModal();
      openModal('silo');
    }

    function saveGame() {
      localStorage.setItem('fazendaPixelSafraReal_RS_v3', JSON.stringify(state));
      showToast('Jogo salvo!');
    }

    function loadGame() {
      const raw = localStorage.getItem('fazendaPixelSafraReal_RS_v3');
      if (!raw) {
        showToast('Nenhum save encontrado!');
        return;
      }
      state = JSON.parse(raw);
      clearSelection();
      updateHUD();
      renderWorld();
      showToast('Save carregado!');
    }

    function resetGame() {
      localStorage.removeItem('fazendaPixelSafraReal_RS_v3');
      state = createInitialState();
      clearSelection();
      updateHUD();
      focusMainHectare();
      closeModal();
      showToast('Fazenda reiniciada!');
    }

    function updateHUD() {
      document.getElementById('hudMoney').textContent = formatBRL(state.money);
      const ownedCount = state.hectares.filter((h) => h.owned).length;
      document.getElementById('hudHectares').textContent = `${ownedCount} / 100`;
      const s = getSeasonInfo(state.monthIndex);
      document.getElementById('hudDateChip').textContent = `${s.icon} ${MONTHS[state.monthIndex]} · Ano ${state.year}`;
      const totalSacks = Object.values(state.silo).reduce((a, b) => a + b, 0);
      document.getElementById('hudSiloChip').textContent = `🌾 Silo: ${totalSacks.toFixed(1)} sc`;
      const cattleChip = document.getElementById('hudLivestockChip');
      if (cattleChip) {
        cattleChip.textContent = `🐄 Gado: ${(state.cattle || []).length}`;
      }

      let hasRipe = false;
      for (let i = 0; i < state.tiles.length; i++) {
        const t = state.tiles[i];
        if (t.state === 'planted' && t.cropId && t.growthMonths >= CROPS[t.cropId].monthsToGrow) {
          hasRipe = true;
          break;
        }
      }
      document.querySelector('[data-tool="harvest"]').classList.toggle('harvest-ready', hasRipe);
    }

    function convertHectareToPasture(haId) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || !ha.owned || ha.isPasture) return;
      if (state.money < FENCE_COST_HA) {
        showToast(`Saldo insuficiente para cercar (${formatBRL(FENCE_COST_HA)}).`);
        return;
      }
      state.money -= FENCE_COST_HA;
      const hadAnyActivePasture = state.hectares.some(h => h.owned && h.isPasture && h.pastureActive === true && !h.pastureDegraded);
      ha.isPasture = true;
      ha.paddockGroupId = ha.id;
      ha.grassLevel = 100;
      ha.restMonths = 0;
      ha.pastureDegraded = false;
      ha.pastureActive = !hadAnyActivePasture;

      for (let ly = 0; ly < SUB_SIZE; ly++) {
        for (let lx = 0; lx < SUB_SIZE; lx++) {
          const tx = ha.hc * SUB_SIZE + lx;
          const ty = ha.hr * SUB_SIZE + ly;
          state.tiles[ty * TOTAL_TILE_COLS + tx] = { state: 'raw', cropId: null, growthMonths: 0, cared: false };
        }
      }
      updateHUD();
      renderWorld();
      showToast(`Hectare (${ha.hc + 1},${ha.hr + 1}) cercado como pasto independente!`);
      openModal('livestock');
    }

    function mergePaddocks(paddockIdA, paddockIdB) {
      const paddocks = getPasturePaddocks();
      const pA = paddocks.find(p => p.id === paddockIdA);
      const pB = paddocks.find(p => p.id === paddockIdB);
      if (!pA || !pB || pA.id === pB.id) return;

      const newGroupId = Math.min(pA.id, pB.id);
      const anyActive = pA.isActive || pB.isActive;
      [...pA.members, ...pB.members].forEach(m => {
        m.paddockGroupId = newGroupId;
        if (anyActive && !m.pastureDegraded) {
          m.pastureActive = true;
        }
      });

      renderWorld();
      showToast(`Pastos juntados (${pA.areaHa + pB.areaHa} ha)!`);
      openModal('livestock');
    }

    function splitPaddock(paddockId) {
      const paddocks = getPasturePaddocks();
      const target = paddocks.find(p => p.id === paddockId);
      if (!target || target.members.length <= 1) return;

      target.members.forEach((m, idx) => {
        m.paddockGroupId = m.id;
        if (target.isActive) {
          m.pastureActive = (idx === 0);
        }
      });

      renderWorld();
      showToast('Pastos separados novamente em hectares individuais!');
      openModal('livestock');
    }

    function moveCattleToPaddock(destPaddockId) {
      const paddocks = getPasturePaddocks();
      const dest = paddocks.find(p => p.id === destPaddockId);
      if (!dest) return;
      if (dest.isDegraded) {
        showToast(`Este pasto precisa de descanso (${dest.restMonths}/3 meses) para rebrotar.`);
        return;
      }
      paddocks.forEach(p => {
        const isDest = (p.id === destPaddockId);
        p.members.forEach(m => { m.pastureActive = isDest; });
      });
      renderWorld();
      showToast(`Rebanho movido para o pasto selecionado (${dest.areaHa} ha)!`);
      openModal('livestock');
    }

    function restAndMoveCattle(sourcePaddockId) {
      const sel = document.getElementById(`destPaddock_${sourcePaddockId}`);
      const destId = sel ? Number(sel.value) : null;
      if (destId == null || Number.isNaN(destId)) {
        showToast('Selecione para qual pasto deseja mover os animais.');
        return;
      }
      moveCattleToPaddock(destId);
    }

    function toggleSilageFeeding() {
      state.useSilageToSavePasture = !(state.useSilageToSavePasture !== false);
      showToast(state.useSilageToSavePasture ? 'Silagem liberada no cocho (poupa o pasto)' : 'Uso de silagem pausado');
      openModal('livestock');
    }

    function convertPastureToCrop(haId) {
      const ha = state.hectares.find(h => h.id === haId);
      if (!ha || !ha.owned || !ha.isPasture) return;
      const pastureCount = state.hectares.filter(h => h.owned && h.isPasture).length;
      if (pastureCount <= 1 && (state.cattle || []).length > 0) {
        showToast('Venda ou transfira o gado antes de remover o último pasto.');
        return;
      }
      const wasActive = ha.pastureActive;
      ha.isPasture = false;
      ha.paddockGroupId = ha.id;
      ha.pastureActive = false;
      ha.pastureDegraded = false;
      ha.grassLevel = 100;
      if (wasActive && (state.cattle || []).length > 0) {
        const nextReady = getPasturePaddocks().find(p => !p.isDegraded);
        if (nextReady) {
          nextReady.members.forEach(m => { m.pastureActive = true; });
        }
      }
      renderWorld();
      showToast(`Cerca removida do Hectare (${ha.hc + 1},${ha.hr + 1}).`);
      openModal('livestock');
    }

    function makeSilageFromCorn(sacksToUse) {
      if (!ownsItem('ensiladeira_forragem')) {
        showToast('Compre a Ensiladeira na Loja primeiro.');
        return;
      }
      const avail = state.silo.milho || 0;
      const qty = Math.min(avail, sacksToUse);
      if (qty < 1) {
        showToast('Você precisa de pelo menos 1 saca de Milho no silo.');
        return;
      }
      const cost = Math.round(qty * SILAGE_PROCESS_COST_PER_SACK);
      if (state.money < cost) {
        showToast(`Saldo insuficiente para picar silagem (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;
      state.silo.milho = +(state.silo.milho - qty).toFixed(2);
      const kgAdded = Math.round(qty * SILAGE_KG_PER_CORN_SACK);
      state.silageKg = (state.silageKg || 0) + kgAdded;
      updateHUD();
      showToast(`Produziu ${kgAdded} kg de silagem com ${qty.toFixed(1)} sc de milho!`);
      openModal('livestock');
    }

    function buyAnimal(type) {
      const spec = LIVESTOCK_TYPES[type];
      if (!spec) return;
      const paddocks = getPasturePaddocks();
      if (paddocks.length === 0) {
        showToast('Cerque pelo menos 1 hectare de pasto antes de comprar gado.');
        return;
      }
      ensureAtLeastOneActivePaddock();
      const totalPastureHa = state.hectares.filter(h => h.owned && h.isPasture).length;
      const maxUAWithSilage = totalPastureHa * UA_CAPACITY_PER_HA * ((state.silageKg || 0) >= 300 ? 1.8 : 1.0);
      const nextUA = getTotalHerdUA() + (spec.startArrobas / 15);
      if (nextUA > maxUAWithSilage + 0.1) {
        showToast(`Lotação limite (${UA_CAPACITY_PER_HA} UA/ha)! Cerque mais pasto ou produza silagem.`);
        return;
      }
      if (state.money < spec.buyPrice) {
        showToast(`Saldo insuficiente (${formatBRL(spec.buyPrice)}).`);
        return;
      }
      state.money -= spec.buyPrice;
      state.cattle = state.cattle || [];
      state.cattle.push({
        id: Date.now() + Math.random(),
        type: spec.id,
        arrobas: spec.startArrobas,
        ageMonths: spec.id === 'vaca' ? 24 : 14,
        pregnantMonths: 0,
        monthsSinceCalving: 12
      });
      updateHUD();
      renderWorld();
      showToast(`Comprou ${spec.name}!`);
      openModal('livestock');
    }

    function sellAnimal(animalId, mode) {
      const idx = (state.cattle || []).findIndex(a => a.id === animalId);
      if (idx === -1) return;
      const animal = state.cattle[idx];
      const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
      if (mode === 'butcher' && animal.arrobas < spec.minButcherArrobas) {
        showToast(`Peso mínimo para açougue: ${spec.minButcherArrobas}@.`);
        return;
      }
      const pricePerArroba = mode === 'butcher' ? BUTCHER_PRICE_PER_ARROBA : LIVE_CATTLE_PRICE_PER_ARROBA;
      const freight = ownsItem('caminhao_boiadeiro') ? 22 : 95;
      const net = Math.max(0, Math.round(animal.arrobas * pricePerArroba - freight));

      state.cattle.splice(idx, 1);
      state.money += net;
      updateHUD();
      renderWorld();
      showToast(`Vendeu (${mode === 'butcher' ? 'Açougue' : 'Vivo Criação'}) por ${formatBRL(net)} líquido!`);
      openModal('livestock');
    }

    function sellAllMilk() {
      const liters = state.milkLiters || 0;
      if (liters < 10) {
        showToast('Mínimo de 10 litros no tanque para coleta.');
        return;
      }
      const freightPerL = ownsItem('caminhao_leite') ? 0.08 : 0.32;
      const net = Math.round(liters * (MILK_PRICE_PER_LITER - freightPerL));
      state.milkLiters = 0;
      state.money += net;
      updateHUD();
      showToast(`Vendeu ${liters.toFixed(0)} L de leite por ${formatBRL(net)} líquido!`);
      openModal('livestock');
    }

    function sellByProductsToFactories() {
      const hay = state.hayBales || 0;
      const straw = state.strawBales || 0;
      const wool = state.woolKg || 0;
      const eggs = state.eggsCount || 0;
      const logs = state.timberLogs || 0;
      const total = Math.round(hay * 140 + straw * 95 + wool * 48 + eggs * 0.65 + logs * 190);
      if (total <= 0) {
        showToast('Sem feno, palha, lã, ovos ou toras para vender às fábricas.');
        return;
      }
      state.hayBales = 0;
      state.strawBales = 0;
      state.woolKg = 0;
      state.eggsCount = 0;
      state.timberLogs = 0;
      state.money += total;
      updateHUD();
      showToast(`Fábricas compraram subprodutos por ${formatBRL(total)}!`);
      closeModal();
      openModal('save');
    }

    function acceptRuralContract() {
      if (state.activeContract) {
        showToast('Você já tem um contrato rural ativo neste mês.');
        return;
      }
      state.activeContract = { title: 'Manejo & Colheita Regional', reward: 8500 };
      showToast('Contrato aceito! Avance o mês para receber R$ 8.500.');
      closeModal();
      openModal('save');
    }

    function toggleHiredWorker() {
      state.hiredWorkerActive = !state.hiredWorkerActive;
      showToast(state.hiredWorkerActive ? 'Operário rural contratado (R$ 1.200/mês).' : 'Operário rural dispensado.');
      closeModal();
      openModal('save');
    }

    function packBunkerSilage() {
      if ((state.silageKg || 0) < 200) {
        showToast('Produza ao menos 200 kg de silagem antes de compactar no silo trincheira.');
        return;
      }
      state.silageKg = +(state.silageKg - 200).toFixed(1);
      state.bunkerFermentingKg = +((state.bunkerFermentingKg || 0) + 200).toFixed(1);
      updateHUD();
      showToast('200 kg compactados no silo trincheira (fermenta em 1 mês).');
      closeModal();
      openModal('save');
    }

    function claimBunkerSilage() {
      const ready = state.bunkerReadyKg || 0;
      if (ready <= 0) {
        showToast('Nenhuma silagem fermentada pronta no silo trincheira.');
        return;
      }
      state.bunkerReadyKg = 0;
      state.silageKg = +((state.silageKg || 0) + ready).toFixed(1);
      updateHUD();
      showToast(`Retirou ${ready.toFixed(0)} kg de silagem curada!`);
      closeModal();
      openModal('save');
    }

    function makeHayBale() {
      if (!ownsItem('enfardadeira_feno')) {
        showToast('Compre a Segadora & Enfardadeira na Loja primeiro.');
        return;
      }
      state.hayBales = +((state.hayBales || 0) + 1).toFixed(1);
      updateHUD();
      showToast('Fardo de feno enfardado!');
      closeModal();
      openModal('save');
    }

    function cutTimberLog() {
      state.timberLogs = (state.timberLogs || 0) + 1;
      updateHUD();
      showToast('1 tora de madeira cortada na área rural.');
      closeModal();
      openModal('save');
    }

    function repairMachinery() {
      const wear = state.machineWear || 0;
      if (wear <= 0) {
        showToast('Máquinas já estão revisadas.');
        return;
      }
      const cost = Math.max(1500, wear * 180);
      if (state.money < cost) {
        showToast(`Saldo insuficiente para revisão (${formatBRL(cost)}).`);
        return;
      }
      state.money -= cost;
      state.machineWear = 0;
      updateHUD();
      showToast(`Oficina concluída (${formatBRL(cost)})! Eficiência 100%.`);
      closeModal();
      openModal('save');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    window.addEventListener('resize', resizeCanvas);

    renderCropSelector();
    setTool('plow');
    updateHUD();
    resizeCanvas();
    focusMainHectare();
  </script>
</body>
</html>

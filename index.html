<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fazenda Pixel - Safra Real (RS)</title>
  <style>
    :root {
      --bg-green: #69a73b;
      --bg-dot: #5a942f;
      --wood-pill: #5b381a;
      --wood-pill-border: #3a210c;
      --wood-frame: #8f582c;
      --wood-frame-dark: #4c2b11;
      --card-cream: #fbf5e6;
      --card-cream-border: #d9caa8;
      --gold-accent: #f2b729;
      --teal-pill: #1c5347;
      --teal-border: #10362e;
      --text-dark: #3b2310;
      --text-muted: #75583c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-green);
      background-image: radial-gradient(var(--bg-dot) 3px, transparent 3px);
      background-size: 26px 26px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      touch-action: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 10px max(22px, calc(env(safe-area-inset-bottom) + 16px));
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    /* TOP HUD */
    .top-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-pills-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pills-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-controls-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px 5px 7px;
      border-radius: 13px;
      background: linear-gradient(180deg, #684120 0%, var(--wood-pill) 100%);
      border: 2.5px solid var(--wood-pill-border);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 232, 185, 0.22);
      color: #fff8e7;
      cursor: pointer;
    }

    .stat-pill.teal {
      background: linear-gradient(180deg, #246355 0%, var(--teal-pill) 100%);
      border-color: var(--teal-border);
    }

    .stat-pill-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .stat-pill-icon.coin {
      background: radial-gradient(circle at 30% 30%, #ffe980, #e39510);
      border: 2px solid #8c5203;
      color: #5e3500;
      font-weight: 900;
    }

    .stat-pill-texts {
      display: flex;
      flex-direction: column;
      line-height: 1.08;
    }

    .stat-pill-label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ebd3a7;
    }

    .stat-pill.teal .stat-pill-label {
      color: #a9e3d4;
    }

    .stat-pill-val {
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
    }

    .cream-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 12px;
      background: linear-gradient(180deg, #fffdf7 0%, #f1e6ce 100%);
      border: 2px solid #8c6239;
      box-shadow: 0 2.5px 0 rgba(48, 28, 10, 0.32);
      color: var(--text-dark);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .cream-btn.active-timer {
      background: #ffe885;
      border-color: #a86c05;
      box-shadow: 0 0 0 2px var(--gold-accent);
    }

    .cream-btn.muted {
      background: #e6dcc7;
      opacity: 0.78;
    }

    .cream-btn:active {
      transform: translateY(1px);
    }

    .top-sub-row {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .top-sub-row::-webkit-scrollbar {
      display: none;
    }

    .orange-square-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9px;
      background: linear-gradient(180deg, #f59c27 0%, #c8640b 100%);
      border: 2px solid #592b05;
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 5px 8px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fffdf7 0%, #f2e7cf 100%);
      border: 2px solid #8c6239;
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.25);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
      white-space: nowrap;
    }

    /* CENTER WORLD CANVAS */
    .world-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 7px;
      border-radius: 18px;
      background: linear-gradient(180deg, #d5a570 0%, #9b6434 100%);
      border: 3px solid var(--wood-frame-dark);
      box-shadow:
        0 6px 0 rgba(36, 58, 20, 0.42),
        inset 0 2px 0 rgba(255, 236, 204, 0.6);
      display: flex;
      position: relative;
    }

    .world-inner {
      width: 100%;
      height: 100%;
      border-radius: 11px;
      border: 3px solid #693f1b;
      box-shadow: inset 0 0 0 2px #47280e;
      overflow: hidden;
      position: relative;
      background: #4e8c2c;
    }

    canvas#farmCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    canvas#farmCanvas.pan-mode {
      cursor: grab;
    }

    .cam-controls {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 15;
    }

    .cam-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fffdf7 0%, #efe3c8 100%);
      border: 2.5px solid #5b381a;
      box-shadow: 0 2.5px 0 rgba(48, 28, 10, 0.35);
      color: var(--text-dark);
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cam-btn:active {
      transform: translateY(1px);
    }

    .cam-btn.active {
      background: #ffe885;
      border-color: #9e6504;
      box-shadow: 0 0 0 2px var(--gold-accent);
    }

    .zoom-pill {
      background: rgba(91, 56, 26, 0.94);
      color: #fff8e7;
      border: 1.5px solid #3a210c;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      padding: 2px 3px;
    }

    .sector-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 14;
      background: rgba(91, 56, 26, 0.94);
      border: 2px solid #3a210c;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
      color: #fff8e7;
      padding: 5px 11px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
    }

    /* CONFIRMATION DRAWER */
    .confirm-card {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: min(96%, 430px);
      z-index: 22;
      background: var(--card-cream);
      border: 3px solid var(--wood-pill);
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      gap: 7px;
    }

    .confirm-card.open {
      display: flex;
    }

    .confirm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
      border-bottom: 1.5px solid var(--card-cream-border);
      padding-bottom: 5px;
    }

    .confirm-summary-big {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .summary-box {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-box span {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .summary-box strong {
      font-size: 13px;
      font-weight: 900;
    }

    .confirm-sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .profit-pos { color: #1b6919; font-weight: 900; }
    .profit-neg { color: #a82319; font-weight: 900; }

    /* BOTTOM DOCK */
    .bottom-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 20;
      flex-shrink: 0;
    }

    .crop-selector-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      background: rgba(91, 56, 26, 0.95);
      border: 2px solid var(--wood-pill-border);
      padding: 4px 8px;
      border-radius: 999px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    }

    .crop-selector-bar.visible {
      display: inline-flex;
    }

    .crop-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--card-cream);
      border: 2px solid transparent;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
    }

    .crop-chip.selected {
      background: #ffe999;
      border-color: var(--gold-accent);
    }

    .dock-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 460px;
      padding: 6px;
      border-radius: 17px;
      background: linear-gradient(180deg, #6e4522 0%, var(--wood-pill) 100%);
      border: 2.5px solid var(--wood-pill-border);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 232, 185, 0.18);
    }

    .tool-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 4px 6px;
      border-radius: 12px;
      background: linear-gradient(180deg, #c2b8a3 0%, #9b917c 100%);
      border: 2.5px solid #635a49;
      box-shadow: 0 2.5px 0 #4d4537, inset 0 1px 0 rgba(255, 255, 255, 0.45);
      color: #fffdf7;
      cursor: pointer;
    }

    .tool-card:active {
      transform: translateY(1.5px);
      box-shadow: 0 1px 0 #4d4537;
    }

    .tool-card.active {
      background: linear-gradient(180deg, #b8ad96 0%, #8c826d 100%);
      border-color: var(--gold-accent);
      box-shadow: 0 2.5px 0 #9c6f08, 0 0 10px rgba(242, 183, 41, 0.65);
    }

    .tool-card.harvest-ready {
      border-color: #54e03b;
      box-shadow: 0 2.5px 0 #266919, 0 0 10px rgba(84, 224, 59, 0.55);
    }

    .tool-icon-svg {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-card-label {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(25, 16, 6, 0.75);
      line-height: 1;
    }

    .hint-bar {
      font-size: 11px;
      font-weight: 800;
      color: #f6ffed;
      text-shadow: 0 1px 2px rgba(20, 44, 10, 0.8);
      text-align: center;
      line-height: 1.15;
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(22, 36, 15, 0.65);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: min(94vw, 560px);
      max-height: 84dvh;
      overflow-y: auto;
      background: var(--card-cream);
      border: 4px solid var(--wood-pill);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      padding: 16px;
      color: var(--text-dark);
      font-size: 13px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-cream-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .close-x {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #c9463d;
      border: 2px solid #5c1813;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 6px 10px;
      border-radius: 9px;
      border: 2px solid var(--wood-frame);
      background: #efe5cf;
      color: var(--text-dark);
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--wood-pill);
      color: #fff8e7;
    }

    .machine-card {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .machine-info strong {
      display: block;
      font-size: 13px;
    }

    .machine-info small {
      color: var(--text-muted);
      font-size: 11px;
    }

    table.farm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #fffdf7;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--card-cream-border);
      margin-bottom: 10px;
    }

    table.farm-table th, table.farm-table td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid #eadec4;
    }

    table.farm-table th {
      background: var(--wood-pill);
      color: #fff6df;
      font-weight: 800;
    }

    .price-high { background: #dff2d8; color: #1e5e18; font-weight: 800; }
    .price-mid { background: #fcf0cc; color: #755309; }
    .price-low { background: #f9d8d4; color: #8c231b; }

    .action-btn {
      padding: 6px 11px;
      border-radius: 9px;
      border: 2px solid #2b4f18;
      background: linear-gradient(180deg, #62a838 0%, #458223 100%);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn.secondary {
      background: #ede3cc;
      border-color: var(--wood-frame);
      color: var(--text-dark);
    }

    .action-btn.gold {
      background: linear-gradient(180deg, #f5b92a 0%, #c98a0c 100%);
      border-color: #634103;
      color: #2b1a02;
    }

    .action-btn.danger {
      background: linear-gradient(180deg, #d44c42 0%, #a32c24 100%);
      border-color: #54120e;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    input[type="number"], select {
      padding: 6px 8px;
      border-radius: 8px;
      border: 2px solid var(--wood-frame);
      background: #fff;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--wood-pill);
      color: #fff8e7;
      border: 2px solid var(--gold-accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOP HUD -->
    <header class="top-area">
      <div class="top-pills-row">
        <div class="pills-left">
          <div class="stat-pill" onclick="playSfx('click'); openModal('finance')" title="Financeiro, Empréstimos e Simulador de Safra">
            <div class="stat-pill-icon coin">$</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">CAIXA</span>
              <span class="stat-pill-val" id="hudMoney">R$ 500.000</span>
            </div>
          </div>

          <div class="stat-pill teal" onclick="playSfx('click'); focusMainHectare()" title="Hectares Próprios">
            <div class="stat-pill-icon">🌽</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">HECTARES</span>
              <span class="stat-pill-val" id="hudHectares">1 / 100</span>
            </div>
          </div>
        </div>

        <div class="top-controls-right">
          <button class="cream-btn" id="btnSoundToggle" onclick="toggleSound()" title="Ligar ou desligar sons do jogo">
            🔊 Som: ON
          </button>
          <button class="cream-btn" id="btnAuto10s" onclick="toggleAuto10s()" title="Teste: acelera o tempo (1 mês a cada 10s e trabalhos mais rápidos)">
            ⏱️ 10s/Mês: OFF
          </button>
        </div>
      </div>

      <div class="top-sub-row">
        <button class="cream-btn" onclick="playSfx('click'); fitAllHectares()" title="Ver todos os 100 hectares">
          🗺️ Mapa Completo
        </button>
        <button class="orange-square-btn" onclick="playSfx('click'); openModal('help')" title="Ajuda">?</button>

        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('calendar')" id="hudDateChip">
          ☀️ Jan · Ano 1
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('silo')" id="hudSiloChip">
          🌾 Silo: 0.0 sc
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('livestock')" id="hudLivestockChip">
          🐄 Rebanho: 0
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('shop')">
          🚜 Loja
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('prices')">
          📊 Preços
        </div>
        <div class="mini-hud-chip" onclick="playSfx('click'); openModal('save')">
          💾
        </div>
      </div>
    </header>

    <!-- CENTER WORLD CANVAS -->
    <main class="world-frame">
      <div class="world-inner" id="worldViewport">
        <canvas id="farmCanvas"></canvas>

        <div class="sector-badge" id="sectorBadge">
          Hectare Principal (5,5) · 100 ha
        </div>

        <div class="cam-controls">
          <button class="cam-btn" onclick="playSfx('click'); zoomBy(1.28)" title="Aproximar Zoom">+</button>
          <div class="zoom-pill" id="zoomReadout">100%</div>
          <button class="cam-btn" onclick="playSfx('click'); zoomBy(0.78)" title="Afastar Zoom">−</button>
          <button class="cam-btn" id="btnPanToggle" onclick="playSfx('click'); togglePanMode()" title="Mover Câmera (1 dedo)">✋</button>
          <button class="cam-btn" onclick="playSfx('click'); focusMainHectare()" title="Centralizar Fazenda">🏡</button>
        </div>

        <!-- CONFIRMATION DRAWER -->
        <div class="confirm-card" id="confirmCard">
          <div class="confirm-header">
            <span id="confirmTitle">Confirmar Ação</span>
            <button class="close-x" onclick="playSfx('click'); clearSelection()">✕</button>
          </div>
          <div class="confirm-summary-big" id="confirmSummaryBoxes"></div>
          <div class="confirm-sub" id="confirmSubInfo"></div>
          <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:2px;">
            <button class="action-btn secondary" onclick="playSfx('click'); clearSelection()">Cancelar</button>
            <button class="action-btn" id="confirmExecuteBtn" onclick="executeConfirmedAction()">Confirmar</button>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM DOCK -->
    <footer class="bottom-area">
      <div class="crop-selector-bar" id="cropSelectorBar"></div>

      <div class="dock-container">
        <button class="tool-card active" data-tool="plow" onclick="playSfx('click'); setTool('plow')">
          <div class="tool-icon-svg">

    let soundEnabled = true;

    function getAudioContext() {
      if (!soundEnabled) return null;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) {
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freqStart, freqEnd, duration, type = 'sine', gainPeak = 0.08, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, now);
      if (freqEnd !== null && freqEnd !== freqStart) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(gainPeak, now + Math.min(0.015, duration * 0.2));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playNoiseBurst(duration, filterFreq = 900, gainPeak = 0.07, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime + delay;
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.Q.setValueAtTime(1.2, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(gainPeak, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(now);
      src.stop(now + duration + 0.02);
    }

    function getHectareFacilityType(ha) {
      if (!ha || !ha.owned) return null;
      if (ha.facilityType === 'coop' || ha.facilityType === 'sty' || ha.facilityType === 'pasture') {
        return ha.facilityType;
      }
      if (ha.isPasture) return 'pasture';
      return null;
    }

    function setHectareFacility(ha, type) {
      ha.facilityType = type;
      ha.isPasture = (type === 'pasture');
      if (type !== 'pasture') {
        ha.pastureActive = false;
        ha.pastureDegraded = false;
        ha.restMonths = 0;
        ha.grassLevel = 100;
      }
    }

    function getCoopCapacity() {
      const coopHa = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'coop').length;
      return coopHa * 45;
    }

    function getStyCapacity() {
      const styHa = state.hectares.filter(h => h.owned && getHectareFacilityType(h) === 'sty').length;
      return styHa * 18;
    }

    function getTotalGrainSacksInSilo() {
      if (!state || !state.silo) return 0;
      const grainKeys = ['milho', 'trigo', 'sorgo', 'aveia', 'soja', 'canola'];
      return +grainKeys.reduce((sum, k) => sum + Math.max(0, Number(state.silo[k] || 0)), 0).toFixed(2);
    }

    function consumeGrainFromSilo(neededSacks) {
      let rem = Math.max(0, Number(neededSacks || 0));
      if (rem <= 0) return { ok: true, consumed: 0 };
      const available = getTotalGrainSacksInSilo();
      if (available + 1e-6 < rem) {
        return { ok: false, consumed: 0 };
      }
      const order = ['milho', 'sorgo', 'trigo', 'aveia', 'soja', 'canola'];
      for (const k of order) {
        if (rem <= 1e-6) break;
        const cur = Math.max(0, Number(state.silo[k] || 0));
        if (cur > 0) {
          const take = Math.min(cur, rem);
          state.silo[k] = +(cur - take).toFixed(2);
          rem = +(rem - take).toFixed(2);
        }
      }
      return { ok: true, consumed: +((neededSacks || 0) - rem).toFixed(2) };
    }

    function getAnimalUA(animal) {
      const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
      return Math.max(0.05, +(spec.uaWeight * Math.max(0.5, animal.arrobas / (spec.startArrobas || 5))).toFixed(2));
    }

    function getTotalHerdUA() {
      const grazing = (state.cattle || []).filter(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
      return +grazing.reduce((sum, a) => sum + getAnimalUA(a), 0).toFixed(2);
    }

    function getPasturePaddocks() {
      const groups = new Map();
      state.hectares.forEach(h => {
        if (!h.owned || getHectareFacilityType(h) !== 'pasture') return;
        const gid = h.paddockGroupId != null ? h.paddockGroupId : h.id;
        if (!groups.has(gid)) groups.set(gid, []);
        groups.get(gid).push(h);
      });

      const paddocks = [];
      groups.forEach((members, gid) => {
        members.sort((a, b) => a.id - b.id);
        const minGrass = Math.min(...members.map(m => (typeof m.grassLevel === 'number' ? m.grassLevel : 100)));
        const maxRest = Math.max(...members.map(m => (m.restMonths || 0)));
        const isDegraded = members.some(m => m.pastureDegraded);
        const isActive = members.some(m => m.pastureActive === true && !m.pastureDegraded);

        paddocks.push({
          id: gid,
          members,
          areaHa: members.length,
          capacityUA: +(members.length * UA_CAPACITY_PER_HA).toFixed(1),
          grassLevel: Math.round(minGrass),
          restMonths: maxRest,
          isDegraded,
          isActive
        });
      });

      paddocks.sort((a, b) => a.members[0].id - b.members[0].id);
      return paddocks;
    }

    function ensureAtLeastOneActivePaddock() {
      const paddocks = getPasturePaddocks();
      if (paddocks.length === 0) return;
      const hasActive = paddocks.some(p => p.isActive && !p.isDegraded);
      const hasGrazingAnimals = (state.cattle || []).some(a => (LIVESTOCK_TYPES[a.type]?.facilityType || 'pasture') === 'pasture');
      if (!hasActive && !hasGrazingAnimals) {
        const ready = paddocks.find(p => !p.isDegraded);
        if (ready) {
          ready.members.forEach(m => {
            m.pastureActive = true;
          });
        }
      }
    }

        careBonusYieldPerHa: 6,
        plantCostHa: 940,
        bestSeasons: ['inverno', 'outono'],
        okSeasons: ['primavera'],
        prices: [154, 156, 160, 164, 168, 172, 176, 174, 167, 160, 156, 153]
      },
      sorgo: {

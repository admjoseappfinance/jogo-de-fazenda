<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fazenda Pixel - Safra Real (RS)</title>
  <style>
    :root {
      --bg-green: #639e38;
      --bg-dot: #578e2f;
      --wood-pill: #573619;
      --wood-pill-border: #3a220e;
      --wood-frame: #8a562c;
      --wood-frame-dark: #4e2d13;
      --card-cream: #fbf5e6;
      --card-cream-border: #d9caa8;
      --gold-accent: #f2b729;
      --teal-pill: #184e43;
      --teal-border: #0e332b;
      --text-dark: #3b2310;
      --text-muted: #75583c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-green);
      background-image: radial-gradient(var(--bg-dot) 3px, transparent 3px);
      background-size: 26px 26px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      touch-action: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100dvh;
      max-width: 620px;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 10px max(24px, calc(env(safe-area-inset-bottom) + 18px));
      gap: 7px;
      position: relative;
      overflow: hidden;
    }

    /* TOP HUD */
    .top-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-pills-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pills-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px 5px 8px;
      border-radius: 13px;
      background: var(--wood-pill);
      border: 2px solid var(--wood-pill-border);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      color: #fff8e7;
      cursor: pointer;
    }

    .stat-pill.teal {
      background: var(--teal-pill);
      border-color: var(--teal-border);
    }

    .stat-pill-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .stat-pill-icon.coin {
      background: radial-gradient(circle at 30% 30%, #ffe678, #e09612);
      border: 2px solid #965b04;
      color: #693e00;
      font-weight: 900;
    }

    .stat-pill-texts {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .stat-pill-label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e8cfa3;
    }

    .stat-pill.teal .stat-pill-label {
      color: #9ed9ca;
    }

    .stat-pill-val {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
    }

    .cream-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--card-cream);
      border: 2px solid var(--wood-frame);
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: var(--text-dark);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .cream-btn.active-timer {
      background: #ffe885;
      border-color: #a86c05;
      box-shadow: 0 0 0 2px var(--gold-accent);
    }

    .cream-btn:active {
      transform: translateY(1px);
    }

    .top-sub-row {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .top-sub-row::-webkit-scrollbar {
      display: none;
    }

    .orange-square-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9px;
      background: linear-gradient(180deg, #f29422 0%, #c9680e 100%);
      border: 2px solid #592b05;
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 5px 8px;
      border-radius: 9px;
      background: rgba(251, 245, 230, 0.95);
      border: 2px solid var(--wood-frame);
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.25);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
      white-space: nowrap;
    }

    /* CENTER WORLD CANVAS */
    .world-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 7px;
      border-radius: 16px;
      background: linear-gradient(180deg, #cfa06d 0%, #9b6638 100%);
      border: 3px solid var(--wood-frame-dark);
      box-shadow:
        0 6px 0 rgba(36, 58, 20, 0.42),
        inset 0 2px 0 rgba(255, 232, 198, 0.55);
      display: flex;
      position: relative;
    }

    .world-inner {
      width: 100%;
      height: 100%;
      border-radius: 9px;
      border: 3px solid #6b411d;
      box-shadow: inset 0 0 0 2px #472910;
      overflow: hidden;
      position: relative;
      background: #3d6326;
    }

    canvas#farmCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    canvas#farmCanvas.pan-mode {
      cursor: grab;
    }

    .cam-controls {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 15;
    }

    .cam-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--card-cream);
      border: 2px solid var(--wood-pill);
      box-shadow: 0 2px 0 rgba(48, 28, 10, 0.35);
      color: var(--text-dark);
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cam-btn:active {
      transform: translateY(1px);
    }

    .cam-btn.active {
      background: #ffe680;
      border-color: #b87c07;
      box-shadow: 0 0 0 2px var(--gold-accent);
    }

    .zoom-pill {
      background: rgba(87, 54, 25, 0.92);
      color: #fff8e7;
      border: 1.5px solid var(--wood-pill-border);
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      padding: 2px 3px;
    }

    .sector-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 14;
      background: rgba(87, 54, 25, 0.92);
      border: 2px solid var(--wood-pill-border);
      color: #fff8e7;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      pointer-events: none;
    }

    /* CONFIRMATION DRAWER */
    .confirm-card {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: min(96%, 430px);
      z-index: 22;
      background: var(--card-cream);
      border: 3px solid var(--wood-pill);
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      gap: 7px;
    }

    .confirm-card.open {
      display: flex;
    }

    .confirm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
      border-bottom: 1.5px solid var(--card-cream-border);
      padding-bottom: 5px;
    }

    .confirm-summary-big {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .summary-box {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-box span {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .summary-box strong {
      font-size: 13px;
      font-weight: 900;
    }

    .confirm-sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .profit-pos { color: #1b6919; font-weight: 900; }
    .profit-neg { color: #a82319; font-weight: 900; }

    /* BOTTOM DOCK */
    .bottom-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 20;
      flex-shrink: 0;
    }

    .crop-selector-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      background: rgba(87, 54, 25, 0.94);
      border: 2px solid var(--wood-pill-border);
      padding: 4px 8px;
      border-radius: 999px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    }

    .crop-selector-bar.visible {
      display: inline-flex;
    }

    .crop-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--card-cream);
      border: 2px solid transparent;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
    }

    .crop-chip.selected {
      background: #ffe999;
      border-color: var(--gold-accent);
    }

    .dock-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 390px;
      padding: 7px;
      border-radius: 16px;
      background: var(--wood-pill);
      border: 2px solid var(--wood-pill-border);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .tool-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px 5px;
      border-radius: 11px;
      background: var(--card-cream);
      border: 2.5px solid #cbb78e;
      box-shadow: 0 2.5px 0 #b39b6d;
      color: var(--text-dark);
      cursor: pointer;
    }

    .tool-card:active {
      transform: translateY(1.5px);
      box-shadow: 0 1px 0 #b39b6d;
    }

    .tool-card.active {
      background: #fffdf6;
      border-color: var(--gold-accent);
      box-shadow: 0 2.5px 0 #b8810c, 0 0 10px rgba(242, 183, 41, 0.55);
    }

    .tool-card.harvest-ready {
      border-color: #369c28;
      background: #f2fce8;
    }

    .tool-icon-svg {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-card-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1;
    }

    .hint-bar {
      font-size: 10.5px;
      font-weight: 700;
      color: #f6ffed;
      text-shadow: 0 1px 2px rgba(20, 44, 10, 0.7);
      text-align: center;
      line-height: 1.15;
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(22, 36, 15, 0.65);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: min(94vw, 560px);
      max-height: 84dvh;
      overflow-y: auto;
      background: var(--card-cream);
      border: 4px solid var(--wood-pill);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      padding: 16px;
      color: var(--text-dark);
      font-size: 13px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-cream-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .close-x {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #c9463d;
      border: 2px solid #5c1813;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 6px 10px;
      border-radius: 9px;
      border: 2px solid var(--wood-frame);
      background: #efe5cf;
      color: var(--text-dark);
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--wood-pill);
      color: #fff8e7;
    }

    .machine-card {
      background: #fffdf7;
      border: 2px solid var(--card-cream-border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .machine-info strong {
      display: block;
      font-size: 13px;
    }

    .machine-info small {
      color: var(--text-muted);
      font-size: 11px;
    }

    table.farm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #fffdf7;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--card-cream-border);
      margin-bottom: 10px;
    }

    table.farm-table th, table.farm-table td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid #eadec4;
    }

    table.farm-table th {
      background: var(--wood-pill);
      color: #fff6df;
      font-weight: 800;
    }

    .price-high { background: #dff2d8; color: #1e5e18; font-weight: 800; }
    .price-mid { background: #fcf0cc; color: #755309; }
    .price-low { background: #f9d8d4; color: #8c231b; }

    .action-btn {
      padding: 6px 11px;
      border-radius: 9px;
      border: 2px solid #2b4f18;
      background: linear-gradient(180deg, #62a838 0%, #458223 100%);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn.secondary {
      background: #ede3cc;
      border-color: var(--wood-frame);
      color: var(--text-dark);
    }

    .action-btn.gold {
      background: linear-gradient(180deg, #f5b92a 0%, #c98a0c 100%);
      border-color: #634103;
      color: #2b1a02;
    }

    .action-btn.danger {
      background: linear-gradient(180deg, #d44c42 0%, #a32c24 100%);
      border-color: #54120e;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    input[type="number"], select {
      padding: 6px 8px;
      border-radius: 8px;
      border: 2px solid var(--wood-frame);
      background: #fff;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--wood-pill);
      color: #fff8e7;
      border: 2px solid var(--gold-accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOP HUD -->
    <header class="top-area">
      <div class="top-pills-row">
        <div class="pills-left">
          <div class="stat-pill" onclick="openModal('finance')" title="Financeiro, Empréstimos e Simulador de Safra">
            <div class="stat-pill-icon coin">$</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">Caixa</span>
              <span class="stat-pill-val" id="hudMoney">R$ 22.000</span>
            </div>
          </div>

          <div class="stat-pill teal" onclick="focusMainHectare()" title="Hectares Próprios">
            <div class="stat-pill-icon">🌾</div>
            <div class="stat-pill-texts">
              <span class="stat-pill-label">Hectares</span>
              <span class="stat-pill-val" id="hudHectares">1 / 100</span>
            </div>
          </div>
        </div>

        <button class="cream-btn" id="btnAuto10s" onclick="toggleAuto10s()" title="Teste: passa 1 mês a cada 10 segundos">
          ⏱️ 10s/Mês: OFF
        </button>
      </div>

      <div class="top-sub-row">
        <button class="cream-btn" onclick="fitAllHectares()" title="Ver todos os 100 hectares">
          🗺️ Mapa Completo
        </button>
        <button class="orange-square-btn" onclick="openModal('help')" title="Ajuda">?</button>

        <div class="mini-hud-chip" onclick="openModal('calendar')" id="hudDateChip">
          ☀️ Jan · Ano 1
        </div>
        <div class="mini-hud-chip" onclick="openModal('silo')" id="hudSiloChip">
          🌾 Silo: 0.0 sc
        </div>
        <div class="mini-hud-chip" onclick="openModal('livestock')" id="hudLivestockChip">
          🐄 Gado: 0
        </div>
        <div class="mini-hud-chip" onclick="openModal('shop')">
          🚜 Loja
        </div>
        <div class="mini-hud-chip" onclick="openModal('prices')">
          📊 Preços
        </div>
        <div class="mini-hud-chip" onclick="openModal('save')">
          💾
        </div>
      </div>
    </header>

    <!-- CENTER WORLD CANVAS -->
    <main class="world-frame">
      <div class="world-inner" id="worldViewport">
        <canvas id="farmCanvas"></canvas>

        <div class="sector-badge" id="sectorBadge">
          Hectare Principal (5,5) · 100 ha
        </div>

        <div class="cam-controls">
          <button class="cam-btn" onclick="zoomBy(1.28)" title="Aproximar Zoom">+</button>
          <div class="zoom-pill" id="zoomReadout">100%</div>
          <button class="cam-btn" onclick="zoomBy(0.78)" title="Afastar Zoom">−</button>
          <button class="cam-btn" id="btnPanToggle" onclick="togglePanMode()" title="Mover Câmera (1 dedo)">✋</button>
          <button class="cam-btn" onclick="focusMainHectare()" title="Centralizar Fazenda">🏡</button>
        </div>

        <!-- CONFIRMATION DRAWER -->
        <div class="confirm-card" id="confirmCard">
          <div class="confirm-header">
            <span id="confirmTitle">Confirmar Ação</span>
            <button class="close-x" onclick="clearSelection()">✕</button>
          </div>
          <div class="confirm-summary-big" id="confirmSummaryBoxes"></div>
          <div class="confirm-sub" id="confirmSubInfo"></div>
          <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:2px;">
            <button class="action-btn secondary" onclick="clearSelection()">Cancelar</button>
            <button class="action-btn" id="confirmExecuteBtn" onclick="executeConfirmedAction()">Confirmar</button>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM DOCK -->
    <footer class="bottom-area">
      <div class="crop-selector-bar" id="cropSelectorBar"></div>

      <div class="dock-container">
        <button class="tool-card active" data-tool="plow" onclick="setTool('plow')">
          <div class="tool-icon-svg">
            <svg width="24" height="24" viewBox="0 0 32 32">
              <path d="M7 25 L21 11" stroke="#8b5a2b" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M15 7 Q23 7 26 14 L22 16 Q19 11 14 11 Z" fill="#9fb3c8" stroke="#486581" stroke-width="1.5"/>
            </svg>
          </div>
          <span class="tool-card-label">Arar</span>
        </button>

        <button class="tool-card" data-tool="plant" onclick="setTool('plant')">
          <div class="tool-icon-svg">
            <svg width="24" height="24" viewBox="0 0 32 32">
              <ellipse cx="16" cy="15" rx="6" ry="10" transform="rotate(28 16 15)" fill="#f5c52c" stroke="#9c6f06" stroke-width="1.5"/>
              <path d="M10 22 Q9 13 15 11 Q13 18 12 24 Z" fill="#5da832" stroke="#2d5e12" stroke-width="1.2"/>
              <path d="M22 22 Q23 13 17 11 Q19 18 20 24 Z" fill="#6ec23c" stroke="#2d5e12" stroke-width="1.2"/>
            </svg>
          </div>
          <span class="tool-card-label">Plantar</span>
        </button>

        <button class="tool-card" data-tool="care" onclick="setTool('care')">
          <div class="tool-icon-svg">
            <svg width="24" height="24" viewBox="0 0 32 32">
              <path d="M16 5 C16 5 8 15 8 20 A8 8 0 0 0 24 20 C24 15 16 5 16 5 Z" fill="#4db8ff" stroke="#186fa8" stroke-width="1.8"/>

    function getPasturePaddocks() {
      const groups = new Map();
      state.hectares.forEach(h => {
        if (!h.owned || !h.isPasture) return;
        const gid = h.paddockGroupId != null ? h.paddockGroupId : h.id;
        if (!groups.has(gid)) groups.set(gid, []);
        groups.get(gid).push(h);
      });

      const paddocks = [];
      groups.forEach((members, gid) => {
        members.sort((a, b) => a.id - b.id);
        const minGrass = Math.min(...members.map(m => (typeof m.grassLevel === 'number' ? m.grassLevel : 100)));
        const maxRest = Math.max(...members.map(m => (m.restMonths || 0)));
        const isDegraded = members.some(m => m.pastureDegraded);
        const isActive = members.some(m => m.pastureActive === true && !m.pastureDegraded);

        paddocks.push({
          id: gid,
          members,
          areaHa: members.length,
          capacityUA: +(members.length * UA_CAPACITY_PER_HA).toFixed(1),
          grassLevel: Math.round(minGrass),
          restMonths: maxRest,
          isDegraded,
          isActive
        });
      });

      paddocks.sort((a, b) => a.members[0].id - b.members[0].id);
      return paddocks;
    }

      if (!hasActive && (state.cattle || []).length === 0) {
        const ready = paddocks.find(p => !p.isDegraded);
        if (ready) {
          ready.members.forEach(m => {
            m.pastureActive = true;

    function getSeasonInfo(monthIdx) {
      if (monthIdx >= 2 && monthIdx <= 4) return { id: 'outono', name: 'Outono', icon: '🍂', endsMonth: 'Mai', months: [2, 3, 4] };
      if (monthIdx >= 5 && monthIdx <= 7) return { id: 'inverno', name: 'Inverno', icon: '❄️', endsMonth: 'Ago', months: [5, 6, 7] };
      if (monthIdx >= 8 && monthIdx <= 10) return { id: 'primavera', name: 'Primavera', icon: '🌸', endsMonth: 'Nov', months: [8, 9, 10] };
      return { id: 'verao', name: 'Verão', icon: '☀️', endsMonth: 'Fev', months: [11, 0, 1] };
    }

    function getCropSeasonMultiplier(crop, monthIdx) {
      const season = getSeasonInfo(monthIdx);
      if (crop.bestSeasons && crop.bestSeasons.includes(season.id)) {
        return { mult: 1.28, label: 'Estação Ideal (+28% sacas)' };
      }
      if (crop.okSeasons && crop.okSeasons.includes(season.id)) {
        return { mult: 1.0, label: 'Estação Regular (100% sacas)' };
      }
      return { mult: 0.72, label: 'Fora da Estação (-28% sacas)' };
    }

    function getBestSeasonNames(crop) {
      const map = { verao: 'Verão', outono: 'Outono', inverno: 'Inverno', primavera: 'Primavera' };
      return (crop.bestSeasons || []).map(s => map[s]).join(' e ');
    }

    function getPriceLevel(crop, monthIdx) {
      const p = crop.prices[monthIdx];
      const min = Math.min(...crop.prices);
      const max = Math.max(...crop.prices);
      const ratio = (p - min) / Math.max(1, max - min);
      if (ratio >= 0.66) return 'price-high';
      if (ratio >= 0.33) return 'price-mid';
      return 'price-low';
    }

    function ownsItem(itemId) {
      return Array.isArray(state.ownedMachines) && state.ownedMachines.includes(itemId);

      if (ownsItem('caminhao_proprio')) return 3.5;

      return mode.rentPerSack;

    function getPlantAreaEconomics(crop, monthIdx, areaHa, withCare = false, modeId = state.transportMode) {
      const plantCost = Math.round(areaHa * crop.plantCostHa);
      const plowCost = Math.round(areaHa * getPlowCostHa());
      const careCost = withCare ? Math.round(areaHa * getCareCostHa()) : 0;
      const harvestCost = Math.round(areaHa * getHarvestCostHa());
      const seasonInfo = getCropSeasonMultiplier(crop, monthIdx);
      const baseSacks = areaHa * (crop.baseYieldPerHa + (withCare ? crop.careBonusYieldPerHa : 0));
      const sacks = +(baseSacks * seasonInfo.mult).toFixed(2);
      const transportCost = Math.round(sacks * getTransportRatePerSack(modeId));
      const totalCycleCost = plantCost + plowCost + careCost + harvestCost + transportCost;
      const grossRevenue = Math.round(sacks * crop.prices[monthIdx]);
      const estimatedProfit = grossRevenue - totalCycleCost;

      return {
        plantCost,
        sacks,
        transportCost,
        totalCycleCost,
        grossRevenue,
        estimatedProfit,
        seasonLabel: seasonInfo.label,
        seasonMult: seasonInfo.mult
      };
    }

            id: idx,
            hc,
            hr,
            owned,
            price,
            isPasture: false,
            paddockGroupId: idx,

            pastureActive: false,

        const hr = Math.floor(ty / SUB_SIZE);

    function resizeCanvas() {
      const rect = worldViewport.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      clampCamera();
      renderWorld();
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - camX) / zoom,
        y: (sy - camY) / zoom
      };
    }

    function clampCamera() {
      const rect = worldViewport.getBoundingClientRect();
      const viewW = rect.width;
      const viewH = rect.height;
      const scaledMap = MAP_PX * zoom;
      const pad = 80;

      if (scaledMap + pad * 2 <= viewW) {
        camX = (viewW - scaledMap) / 2;
      } else {
        camX = Math.min(pad, Math.max(viewW - scaledMap - pad, camX));
      }

      if (scaledMap + pad * 2 <= viewH) {
        camY = (viewH - scaledMap) / 2;
      } else {
        camY = Math.min(pad, Math.max(viewH - scaledMap - pad, camY));
      }
    }

    function focusMainHectare() {
      const rect = worldViewport.getBoundingClientRect();
      const targetZoom = Math.min(1.6, Math.max(0.75, (Math.min(rect.width, rect.height) - 20) / HA_PX));
      zoom = +targetZoom.toFixed(2);
      const centerWorldX = 4 * HA_PX + HA_PX / 2;
      const centerWorldY = 4 * HA_PX + HA_PX / 2;
      camX = rect.width / 2 - centerWorldX * zoom;
      camY = rect.height / 2 - centerWorldY * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function fitAllHectares() {
      const rect = worldViewport.getBoundingClientRect();
      const fitZoom = Math.max(MIN_ZOOM, (Math.min(rect.width, rect.height) - 16) / MAP_PX);
      zoom = +fitZoom.toFixed(2);
      camX = (rect.width - MAP_PX * zoom) / 2;
      camY = (rect.height - MAP_PX * zoom) / 2;
      clampCamera();
      updateZoomBadge();
      renderWorld();
      showToast('Mapa completo dos 100 hectares');
    }

    function zoomBy(factor, pivotSx, pivotSy) {
      const rect = worldViewport.getBoundingClientRect();
      const px = pivotSx ?? rect.width / 2;
      const py = pivotSy ?? rect.height / 2;
      const worldBefore = screenToWorld(px, py);
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, +(zoom * factor).toFixed(2)));
      camX = px - worldBefore.x * zoom;
      camY = py - worldBefore.y * zoom;
      clampCamera();
      updateZoomBadge();
      renderWorld();
    }

    function updateZoomBadge() {
      document.getElementById('zoomReadout').textContent = Math.round(zoom * 100) + '%';
      const rect = worldViewport.getBoundingClientRect();
      const centerWorld = screenToWorld(rect.width / 2, rect.height / 2);
      const hc = Math.min(HA_COLS, Math.max(1, Math.floor(centerWorld.x / HA_PX) + 1));
      const hr = Math.min(HA_ROWS, Math.max(1, Math.floor(centerWorld.y / HA_PX) + 1));
      const label = (hc === 5 && hr === 5) ? 'Hectare Principal (5,5)' : `Hectare (${hc},${hr})`;
      document.getElementById('sectorBadge').textContent = `${label} · 100 ha`;
    }

    function togglePanMode() {
      panModeActive = !panModeActive;
      document.getElementById('btnPanToggle').classList.toggle('active', panModeActive);
      canvas.classList.toggle('pan-mode', panModeActive);
      showToast(panModeActive ? 'Modo Mover Câmera ativado (1 dedo)' : 'Modo Selecionar Área ativado');
    }

    function clearSelection() {
      selectedTileKeys.clear();
      selectedHaIdToBuy = null;
      pendingAction = null;
      document.getElementById('confirmCard').classList.remove('open');
      renderWorld();
    }

    function selectSingleOrBox(x1, y1, x2, y2) {
      const minX = Math.max(0, Math.min(x1, x2));
      const maxX = Math.min(MAP_PX - 0.01, Math.max(x1, x2));
      const minY = Math.max(0, Math.min(y1, y2));
      const maxY = Math.min(MAP_PX - 0.01, Math.max(y1, y2));

      if (maxX < minX || maxY < minY) return;

      const isSingleTap = Math.hypot(x2 - x1, y2 - y1) < 8;
      if (isSingleTap) {
        const tx = Math.floor(minX / TILE_PX);
        const ty = Math.floor(minY / TILE_PX);
        const hc = Math.floor(tx / SUB_SIZE);
        const hr = Math.floor(ty / SUB_SIZE);
        const ha = state.hectares[hr * HA_COLS + hc];
        if (!ha.owned) {
          selectedTileKeys.clear();
          selectedHaIdToBuy = ha.id;
          prepareBuyHectareConfirmation(ha);
          renderWorld();
          return;
        }
        if (ha.isPasture) {
          selectedTileKeys.clear();
          selectedHaIdToBuy = null;
          openModal('livestock');
          renderWorld();
          return;
        }
      }

      selectedHaIdToBuy = null;
      selectedTileKeys.clear();

      const txMin = Math.floor(minX / TILE_PX);
      const txMax = Math.floor(maxX / TILE_PX);
      const tyMin = Math.floor(minY / TILE_PX);
      const tyMax = Math.floor(maxY / TILE_PX);

      for (let ty = tyMin; ty <= tyMax; ty++) {
        for (let tx = txMin; tx <= txMax; tx++) {
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          if (ha.owned && !ha.isPasture) {
            selectedTileKeys.add(`${tx},${ty}`);
          }
        }
      }

      if (selectedTileKeys.size > 0) {
        prepareAreaActionConfirmation();
      } else {
        document.getElementById('confirmCard').classList.remove('open');
      }
      renderWorld();
    }

    function prepareBuyHectareConfirmation(ha) {
      const canBuy = state.money >= ha.price;
      pendingAction = { type: 'buy_ha', haId: ha.id, cost: ha.price };

      document.getElementById('confirmTitle').textContent = `Comprar Hectare (${ha.hc + 1}, ${ha.hr + 1})`;
      document.getElementById('confirmSummaryBoxes').innerHTML = `
        <div class="summary-box"><span>Valor do Hectare</span><strong>${formatBRL(ha.price)}</strong></div>
        <div class="summary-box"><span>Caixa Após</span><strong class="${canBuy ? 'profit-pos' : 'profit-neg'}">${formatBRL(state.money - ha.price)}</strong></div>
      `;
      document.getElementById('confirmSubInfo').textContent = `1 hectare = 64 blocos (8x8). Caixa atual: ${formatBRL(state.money)}.`;

      const btn = document.getElementById('confirmExecuteBtn');
      btn.disabled = !canBuy;
      btn.style.opacity = canBuy ? '1' : '0.5';
      btn.textContent = canBuy ? 'Comprar' : 'Sem Saldo';
      document.getElementById('confirmCard').classList.add('open');
    }

    function prepareAreaActionConfirmation() {
      const crop = CROPS[selectedCropId];
      const month = state.monthIndex;

      const coords = [];
      selectedTileKeys.forEach((key) => {
        const [tx, ty] = key.split(',').map(Number);
        coords.push([tx, ty]);
      });

      let eligible = [];
      let actionCost = 0;
      let titleText = '';
      let btnText = 'Confirmar';
      let boxesHtml = '';
      let subText = '';

      if (currentTool === 'plant') {
        eligible = coords.filter(([tx, ty]) => state.tiles[ty * TOTAL_TILE_COLS + tx].state === 'plowed');
        const areaHa = eligible.length / TILES_PER_HA;
        const econ = getPlantAreaEconomics(crop, month, areaHa, false, state.transportMode);
        actionCost = econ.plantCost;
        titleText = `Plantar ${crop.name} (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
        btnText = eligible.length ? 'Confirmar Plantio' : 'Are Antes';

        boxesHtml = `
          <div class="summary-box"><span>Custo Plantio (${crop.name})</span><strong>${formatBRL(econ.plantCost)}</strong></div>
          <div class="summary-box"><span>Lucro Líquido Est.</span><strong class="${econ.estimatedProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(econ.estimatedProfit)}</strong></div>
        `;
        subText = `${econ.seasonLabel} (ideal: ${getBestSeasonNames(crop)}) · Est. ${econ.sacks.toFixed(1)} sc · Receita bruta ${formatBRL(econ.grossRevenue)} · Ciclo total ${formatBRL(econ.totalCycleCost)}.`;
      } else if (currentTool === 'plow') {
        eligible = coords.filter(([tx, ty]) => state.tiles[ty * TOTAL_TILE_COLS + tx].state === 'raw');
        const areaHa = eligible.length / TILES_PER_HA;
        actionCost = Math.round(areaHa * getPlowCostHa());
        titleText = `Arar Área (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
        btnText = eligible.length ? 'Confirmar' : 'Nada p/ Arar';

        boxesHtml = `
          <div class="summary-box"><span>Custo p/ Arar</span><strong>${formatBRL(actionCost)}</strong></div>
          <div class="summary-box"><span>Caixa Após</span><strong class="${state.money - actionCost >= 0 ? 'profit-pos' : 'profit-neg'}">${formatBRL(state.money - actionCost)}</strong></div>
        `;
        subText = `Valor fixo: ${formatBRL(getPlowCostHa())}/ha para todas as culturas e meses.`;
      } else if (currentTool === 'care') {
        eligible = coords.filter(([tx, ty]) => {
          const t = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (t.state !== 'planted' || !t.cropId) return false;
          const c = CROPS[t.cropId];
          return !t.cared && t.growthMonths < c.monthsToGrow;
        });
        const areaHa = eligible.length / TILES_PER_HA;
        actionCost = Math.round(areaHa * getCareCostHa());
        titleText = `Cuidar Área (${eligible.length} blocos · ${areaHa.toFixed(2)} ha)`;
        btnText = eligible.length ? 'Confirmar' : 'Nada p/ Cuidar';

        boxesHtml = `
          <div class="summary-box"><span>Custo p/ Cuidar</span><strong>${formatBRL(actionCost)}</strong></div>
          <div class="summary-box"><span>Efeito</span><strong class="profit-pos">+1 Mês & +Sacas</strong></div>
        `;
        subText = `Valor fixo: ${formatBRL(getCareCostHa())}/ha · Acelera o crescimento e aumenta a produção.`;
      }

      const canAfford = eligible.length > 0 && state.money >= actionCost;
      pendingAction = {
        type: currentTool,
        cropId: crop.id,
        coords: eligible,
        cost: actionCost
      };

      document.getElementById('confirmTitle').textContent = titleText;
      document.getElementById('confirmSummaryBoxes').innerHTML = boxesHtml;
      document.getElementById('confirmSubInfo').textContent = subText;

      const btn = document.getElementById('confirmExecuteBtn');
      btn.disabled = !canAfford;
      btn.style.opacity = canAfford ? '1' : '0.5';
      btn.textContent = !eligible.length ? btnText : (state.money >= actionCost ? btnText : 'Sem Saldo');
      document.getElementById('confirmCard').classList.add('open');
    }

    function executeConfirmedAction() {
      if (!pendingAction) return;
      const act = pendingAction;

      if (act.type === 'buy_ha') {
        const ha = state.hectares[act.haId];
        if (!ha || ha.owned || state.money < ha.price) return;
        state.money -= ha.price;
        ha.owned = true;
        showToast(`Comprou Hectare (${ha.hc + 1},${ha.hr + 1})!`);
      } else if (act.type === 'plow') {
        if (!act.coords.length || state.money < act.cost) return;
        state.money -= act.cost;
        act.coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          tile.state = 'plowed';
          tile.cropId = null;
          tile.growthMonths = 0;
          tile.cared = false;
        });
        showToast(`Arou ${act.coords.length} bloco(s) por ${formatBRL(act.cost)}!`);
      } else if (act.type === 'plant') {
        if (!act.coords.length || state.money < act.cost) return;
        state.money -= act.cost;
        act.coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          tile.state = 'planted';
          tile.cropId = act.cropId;
          tile.growthMonths = 0;
          tile.cared = false;
        });
        showToast(`Plantou ${CROPS[act.cropId].name} por ${formatBRL(act.cost)}!`);
      } else if (act.type === 'care') {
        if (!act.coords.length || state.money < act.cost) return;
        state.money -= act.cost;
        act.coords.forEach(([tx, ty]) => {
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (tile.state === 'planted' && tile.cropId) {
            const c = CROPS[tile.cropId];
            tile.cared = true;
            tile.growthMonths = Math.min(c.monthsToGrow, tile.growthMonths + 1);
          }
        });
        showToast(`Cuidou de ${act.coords.length} bloco(s) por ${formatBRL(act.cost)}!`);
      }

      clearSelection();
      updateHUD();
      renderWorld();
    }

    function triggerInstantHarvestAll() {
      setTool('harvest');
      const ripeTiles = [];

      for (let ty = 0; ty < TOTAL_TILE_ROWS; ty++) {
        for (let tx = 0; tx < TOTAL_TILE_COLS; tx++) {
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
          if (ha.owned && tile.state === 'planted' && tile.cropId) {
            const c = CROPS[tile.cropId];
            if (tile.growthMonths >= c.monthsToGrow) {
              ripeTiles.push({ tx, ty, tile, crop: c });
            }
          }
        }
      }

      if (ripeTiles.length === 0) {
        showToast('Nenhuma lavoura madura pronta para colher agora.');
        return;
      }

      const wearFactor = Math.max(0.75, 1 - ((state.machineWear || 0) / 250));
      const weatherHarvestMult = state.weather === 'Chuva Forte' ? 0.90 : 1.0;
      const harvestRateHa = getHarvestCostHa() * (1 + ((state.machineWear || 0) / 200));
      let harvestCostTotal = 0;
      const sacksAdded = { soja: 0, milho: 0, trigo: 0, canola: 0, sorgo: 0, aveia: 0, girassol: 0, batata: 0, algodao: 0, cana: 0 };
      let strawAdded = 0;

      ripeTiles.forEach(({ crop, tile }) => {
        const sMult = getCropSeasonMultiplier(crop, state.monthIndex).mult;
        const weedPenalty = tile.weeds ? 0.85 : 1.0;
        const limeBonus = tile.limed ? 1.15 : 1.0;
        const yieldHa = (crop.baseYieldPerHa + (tile.cared ? crop.careBonusYieldPerHa : 0)) * sMult * weedPenalty * limeBonus * wearFactor * weatherHarvestMult;
        if (sacksAdded[crop.id] === undefined) sacksAdded[crop.id] = 0;
        sacksAdded[crop.id] += yieldHa / TILES_PER_HA;
        if ((crop.id === 'trigo' || crop.id === 'aveia') && ownsItem('enfardadeira_feno')) {
          strawAdded += 0.35 / TILES_PER_HA;
        }
        harvestCostTotal += harvestRateHa / TILES_PER_HA;
      });

      state.machineWear = Math.min(100, (state.machineWear || 0) + Math.max(1, Math.round(ripeTiles.length / 24)));
      if (strawAdded > 0) {
        state.strawBales = +( (state.strawBales || 0) + strawAdded ).toFixed(2);
      }

      const costInt = Math.round(harvestCostTotal);
      if (state.money < costInt) {
        showToast(`Saldo insuficiente para colher (${formatBRL(costInt)})!`);
        return;
      }

      state.money -= costInt;
      Object.keys(sacksAdded).forEach((cid) => {
        state.silo[cid] = +(state.silo[cid] + sacksAdded[cid]).toFixed(2);
      });

      ripeTiles.forEach(({ tx, ty }) => {
        const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];
        tile.state = 'plowed';
        tile.cropId = null;
        tile.growthMonths = 0;
        tile.cared = false;
      });

      let loanChargedOnHarvest = 0;
      if (state.loans.length > 0) {
        const remainingLoans = [];
        state.loans.forEach((loan) => {
          const pay = Math.min(loan.installmentAmount, loan.remainingBalance);
          loanChargedOnHarvest += pay;
          const nextBal = loan.remainingBalance - pay;
          const nextInstLeft = loan.installmentsLeft - 1;
          if (nextBal > 0 && nextInstLeft > 0) {
            remainingLoans.push({
              ...loan,
              remainingBalance: nextBal,
              installmentsLeft: nextInstLeft
            });
          }
        });
        state.loans = remainingLoans;
        state.money -= loanChargedOnHarvest;
      }

      const totalSc = Object.values(sacksAdded).reduce((a, b) => a + b, 0);
      clearSelection();
      updateHUD();
      renderWorld();
      if (loanChargedOnHarvest > 0) {
        showToast(`Colheu ${totalSc.toFixed(1)} sc · Parcela safra cobrada: ${formatBRL(loanChargedOnHarvest)}`);
      } else {
        showToast(`Colheu ${totalSc.toFixed(1)} sc p/ Silo · Custo colheita: ${formatBRL(costInt)}`);
      }
    }

    function drawCropWithLevelBar(x, y, size, crop, growthMonths, cared) {
      const isRipe = growthMonths >= crop.monthsToGrow;
      const progress = Math.min(1, growthMonths / crop.monthsToGrow);
      const scale = Math.max(0.55, (size / 42) * (0.65 + 0.35 * progress));

      ctx.save();
      ctx.translate(x + size * 0.5, y + size * 0.52);
      ctx.scale(scale, scale);

      ctx.strokeStyle = '#387d1e';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-2, 7);
      ctx.quadraticCurveTo(-2, -2, 2, -9);
      ctx.stroke();

      ctx.fillStyle = '#5eb832';
      ctx.beginPath();
      ctx.ellipse(-6, 1, 5, 2.4, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(5, 2.5, 5, 2.4, 0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isRipe ? '#ffdf33' : crop.ripeColor;
      ctx.strokeStyle = '#8c5808';
      ctx.lineWidth = 1;
      const grains = [[2, -9], [6, -6.5], [1, -4.5], [5, -2], [0, 0]];
      grains.forEach(([gx, gy]) => {
        ctx.beginPath();
        ctx.ellipse(gx, gy, 3.2, 1.8, -0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();

      if (size * zoom >= 12) {
        const barW = size - 6;
        const barH = 4;
        const bx = x + 3;
        const by = y + size - 6;

        ctx.fillStyle = 'rgba(25, 20, 12, 0.72)';
        ctx.fillRect(bx, by, barW, barH);

        ctx.fillStyle = isRipe ? '#47d938' : '#f2c329';
        ctx.fillRect(bx + 0.5, by + 0.5, Math.max(1, (barW - 1) * progress), barH - 1);
      }

      if (cared && size * zoom >= 14) {
        ctx.fillStyle = '#5cd6ff';
        ctx.beginPath();
        ctx.arc(x + size - 6, y + 6, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function renderWorld() {
      const rect = worldViewport.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.fillStyle = '#375c21';
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(camX, camY);
      ctx.scale(zoom, zoom);

      const minTx = Math.max(0, Math.floor(-camX / zoom / TILE_PX));
      const maxTx = Math.min(TOTAL_TILE_COLS - 1, Math.ceil((w - camX) / zoom / TILE_PX));
      const minTy = Math.max(0, Math.floor(-camY / zoom / TILE_PX));
      const maxTy = Math.min(TOTAL_TILE_ROWS - 1, Math.ceil((h - camY) / zoom / TILE_PX));

      for (let ty = minTy; ty <= maxTy; ty++) {
        const y = ty * TILE_PX;
        for (let tx = minTx; tx <= maxTx; tx++) {
          const x = tx * TILE_PX;
          const hc = Math.floor(tx / SUB_SIZE);
          const hr = Math.floor(ty / SUB_SIZE);
          const ha = state.hectares[hr * HA_COLS + hc];
          const tile = state.tiles[ty * TOTAL_TILE_COLS + tx];

          if (!ha.owned) {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? '#4d7335' : '#466930';
            ctx.fillRect(x, y, TILE_PX, TILE_PX);
          } else if (ha.isPasture) {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? '#79ba47' : '#6ead3e';
            ctx.fillRect(x, y, TILE_PX, TILE_PX);
          } else if (tile.state === 'raw') {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? '#6bb33d' : '#63a837';
            ctx.fillRect(x, y, TILE_PX, TILE_PX);
          } else if (tile.state === 'plowed') {
            ctx.fillStyle = '#a36e3e';
            ctx.fillRect(x, y, TILE_PX, TILE_PX);
            if (TILE_PX * zoom >= 12) {
              ctx.fillStyle = '#7d4f27';
              for (let f = 1; f <= 4; f++) {
                const fy = y + (TILE_PX / 5) * f;
                ctx.fillRect(x + 2, fy - 1, TILE_PX - 4, 2);
              }
            }
          } else if (tile.state === 'planted') {
            const crop = CROPS[tile.cropId] || CROPS.soja;
            ctx.fillStyle = '#5c391b';
            ctx.fillRect(x, y, TILE_PX, TILE_PX);
            if (TILE_PX * zoom >= 12) {
              ctx.fillStyle = '#3f250f';
              for (let f = 1; f <= 4; f++) {
                const fy = y + (TILE_PX / 5) * f;
                ctx.fillRect(x + 2, fy - 1, TILE_PX - 4, 2);
              }
              drawCropWithLevelBar(x, y, TILE_PX, crop, tile.growthMonths, tile.cared);
            } else {
              ctx.fillStyle = tile.growthMonths >= crop.monthsToGrow ? '#47d938' : crop.color;
              ctx.fillRect(x + 4, y + 4, TILE_PX - 8, TILE_PX - 8);
            }
          }

          if (TILE_PX * zoom >= 10) {
            ctx.strokeStyle = 'rgba(28, 48, 18, 0.28)';
            ctx.lineWidth = 1 / zoom;
            ctx.strokeRect(x, y, TILE_PX, TILE_PX);
          }
        }
      }

      selectedTileKeys.forEach((key) => {
        const [tx, ty] = key.split(',').map(Number);
        const x = tx * TILE_PX;
        const y = ty * TILE_PX;
        ctx.fillStyle = 'rgba(255, 232, 102, 0.32)';
        ctx.fillRect(x, y, TILE_PX, TILE_PX);
        ctx.strokeStyle = '#fff275';
        ctx.lineWidth = 2 / zoom;
        ctx.strokeRect(x + 1 / zoom, y + 1 / zoom, TILE_PX - 2 / zoom, TILE_PX - 2 / zoom);
      });

      for (let hr = 0; hr < HA_ROWS; hr++) {
        for (let hc = 0; hc < HA_COLS; hc++) {
          const ha = state.hectares[hr * HA_COLS + hc];
          const hx = hc * HA_PX;
          const hy = hr * HA_PX;

          if (ha.owned && ha.isPasture) {
            const gLvl = typeof ha.grassLevel === 'number' ? ha.grassLevel : 100;
            if (ha.pastureDegraded || gLvl <= 15) {
              ctx.fillStyle = 'rgba(138, 102, 54, 0.58)';
              ctx.fillRect(hx, hy, HA_PX, HA_PX);
            } else if (gLvl < 55) {
              ctx.fillStyle = 'rgba(166, 138, 62, 0.32)';
              ctx.fillRect(hx, hy, HA_PX, HA_PX);
            }

            const myGroup = ha.paddockGroupId != null ? ha.paddockGroupId : ha.id;
            const topHa = hr > 0 ? state.hectares[(hr - 1) * HA_COLS + hc] : null;
            const botHa = hr < HA_ROWS - 1 ? state.hectares[(hr + 1) * HA_COLS + hc] : null;
            const leftHa = hc > 0 ? state.hectares[hr * HA_COLS + (hc - 1)] : null;
            const rightHa = hc < HA_COLS - 1 ? state.hectares[hr * HA_COLS + (hc + 1)] : null;

            const topNeighbor = topHa?.owned && topHa?.isPasture && (topHa.paddockGroupId ?? topHa.id) === myGroup;
            const botNeighbor = botHa?.owned && botHa?.isPasture && (botHa.paddockGroupId ?? botHa.id) === myGroup;
            const leftNeighbor = leftHa?.owned && leftHa?.isPasture && (leftHa.paddockGroupId ?? leftHa.id) === myGroup;
            const rightNeighbor = rightHa?.owned && rightHa?.isPasture && (rightHa.paddockGroupId ?? rightHa.id) === myGroup;

            ctx.strokeStyle = '#6b3e19';
            ctx.lineWidth = 4 / zoom;
            ctx.beginPath();
            if (!topNeighbor) { ctx.moveTo(hx + 2, hy + 2); ctx.lineTo(hx + HA_PX - 2, hy + 2); }
            if (!botNeighbor) { ctx.moveTo(hx + 2, hy + HA_PX - 2); ctx.lineTo(hx + HA_PX - 2, hy + HA_PX - 2); }
            if (!leftNeighbor) { ctx.moveTo(hx + 2, hy + 2); ctx.lineTo(hx + 2, hy + HA_PX - 2); }
            if (!rightNeighbor) { ctx.moveTo(hx + HA_PX - 2, hy + 2); ctx.lineTo(hx + HA_PX - 2, hy + HA_PX - 2); }
            ctx.stroke();

            if (HA_PX * zoom >= 52) {
              const statusTxt = ha.pastureDegraded
                ? `🍂 REBROTA ${ha.restMonths || 0}/3m`
                : (ha.pastureActive !== false ? `🐄 ATIVO ${Math.round(gLvl)}%` : `🌿 DESCANSO ${Math.round(gLvl)}%`);
              ctx.fillStyle = ha.pastureDegraded ? 'rgba(122, 39, 28, 0.9)' : 'rgba(58, 34, 14, 0.86)';
              ctx.beginPath();
              ctx.roundRect(hx + 8, hy + 8, 118, 20, 6);
              ctx.fill();
              ctx.fillStyle = '#fff8e7';
              ctx.font = 'bold 10px system-ui, sans-serif';
              ctx.textAlign = 'left';
              ctx.fillText(statusTxt, hx + 13, hy + 21);
            }
          } else {
            ctx.strokeStyle = ha.owned ? '#ffe680' : 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = (ha.owned ? 3 : 1.5) / zoom;
            ctx.strokeRect(hx, hy, HA_PX, HA_PX);
          }

          if (selectedHaIdToBuy === ha.id) {
            ctx.fillStyle = 'rgba(242, 183, 41, 0.35)';
            ctx.fillRect(hx, hy, HA_PX, HA_PX);
          }

          if (!ha.owned && HA_PX * zoom >= 42) {
            const boxW = Math.min(HA_PX - 12, 132);
            const boxH = 42;
            const bx = hx + (HA_PX - boxW) / 2;
            const by = hy + (HA_PX - boxH) / 2;

            ctx.fillStyle = 'rgba(87, 54, 25, 0.88)';
            ctx.beginPath();
            ctx.roundRect(bx, by, boxW, boxH, 10);
            ctx.fill();
            ctx.strokeStyle = '#3a220e';
            ctx.lineWidth = 2 / zoom;
            ctx.stroke();

            ctx.fillStyle = '#fff8e7';
            ctx.font = 'bold 12px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`HA ${hc + 1},${hr + 1} · À VENDA`, hx + HA_PX / 2, by + 17);
            ctx.fillStyle = '#a5f29b';
            ctx.fillText(`R$ ${(ha.price / 1000).toFixed(0)} mil`, hx + HA_PX / 2, by + 33);
          }
        }
      }

      let activePastureHectares = state.hectares.filter(h => h.owned && h.isPasture && h.pastureActive !== false && !h.pastureDegraded);
      if (activePastureHectares.length === 0) {
        activePastureHectares = state.hectares.filter(h => h.owned && h.isPasture);
      }
      if (activePastureHectares.length > 0 && Array.isArray(state.cattle) && state.cattle.length > 0) {
        state.cattle.forEach((animal, idx) => {
          const pHa = activePastureHectares[idx % activePastureHectares.length];
          const slot = Math.floor(idx / activePastureHectares.length);
          const colSlot = (slot % 4);
          const rowSlot = Math.floor(slot / 4) % 4;
          const ax = pHa.hc * HA_PX + 42 + colSlot * 56;
          const ay = pHa.hr * HA_PX + 52 + rowSlot * 52;
          const isCalf = (animal.ageMonths || 0) < 8 || animal.arrobas < 6;

          ctx.save();
          ctx.translate(ax, ay);
          if (isCalf) ctx.scale(0.72, 0.72);
          ctx.fillStyle = animal.type === 'vaca' ? '#f7f5f0' : '#8c4a27';
          ctx.strokeStyle = '#2b180a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(-12, -7, 24, 14, 5);
          ctx.fill();
          ctx.stroke();

          if (animal.type === 'vaca') {
            ctx.fillStyle = '#262320';
            ctx.beginPath();
            ctx.arc(-4, -2, 3.2, 0, Math.PI * 2);
            ctx.arc(4, 2, 2.8, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = animal.type === 'vaca' ? '#ebe6dc' : '#6e371a';
          ctx.beginPath();
          ctx.arc(13, -3, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
      }

      if (isBoxSelecting && boxStartWorld && boxCurrentWorld) {
        const rx = Math.min(boxStartWorld.x, boxCurrentWorld.x);
        const ry = Math.min(boxStartWorld.y, boxCurrentWorld.y);
        const rw = Math.abs(boxCurrentWorld.x - boxStartWorld.x);
        const rh = Math.abs(boxCurrentWorld.y - boxStartWorld.y);
        ctx.fillStyle = 'rgba(255, 232, 102, 0.24)';
        ctx.fillRect(rx, ry, rw, rh);
        ctx.strokeStyle = '#fff078';
        ctx.lineWidth = 2 / zoom;
        ctx.strokeRect(rx, ry, rw, rh);
      }

      ctx.restore();
    }

    function getPinchDist(p1, p2) {
      return Math.hypot(p2.clientX - p1.clientX, p2.clientY - p1.clientY);
    }

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, e);
      const rect = worldViewport.getBoundingClientRect();

      if (activePointers.size === 2) {
        isBoxSelecting = false;
        isPanning = true;
        const pts = Array.from(activePointers.values());
        pinchStartDist = getPinchDist(pts[0], pts[1]);
        pinchStartZoom = zoom;
        const midX = ((pts[0].clientX + pts[1].clientX) / 2) - rect.left;
        const midY = ((pts[0].clientY + pts[1].clientY) / 2) - rect.top;
        pinchStartMidWorld = screenToWorld(midX, midY);
        return;
      }

      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (e.button === 1 || e.button === 2 || panModeActive) {
        isPanning = true;
        panStartScreen = { x: sx, y: sy };
        panStartCam = { x: camX, y: camY };
        return;
      }

      isBoxSelecting = true;
      const wpt = screenToWorld(sx, sy);
      boxStartWorld = wpt;
      boxCurrentWorld = wpt;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, e);
      const rect = worldViewport.getBoundingClientRect();

      if (activePointers.size === 2 && pinchStartDist > 0) {
        const pts = Array.from(activePointers.values());
        const dist = getPinchDist(pts[0], pts[1]);
        const midX = ((pts[0].clientX + pts[1].clientX) / 2) - rect.left;
        const midY = ((pts[0].clientY + pts[1].clientY) / 2) - rect.top;

        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, +(pinchStartZoom * (dist / pinchStartDist)).toFixed(2)));
        camX = midX - pinchStartMidWorld.x * zoom;
        camY = midY - pinchStartMidWorld.y * zoom;
        clampCamera();
        updateZoomBadge();
        renderWorld();
        return;
      }

      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (isPanning) {
        camX = panStartCam.x + (sx - panStartScreen.x);
        camY = panStartCam.y + (sy - panStartScreen.y);
        clampCamera();
        updateZoomBadge();
        renderWorld();
        return;
      }

      if (isBoxSelecting) {
        boxCurrentWorld = screenToWorld(sx, sy);
        renderWorld();
      }
    });

    function endPointer(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) {
        pinchStartDist = 0;
        pinchStartMidWorld = null;
      }

      if (isPanning && activePointers.size === 0) {
        isPanning = false;
        return;
      }

      if (isBoxSelecting && activePointers.size === 0) {
        isBoxSelecting = false;
        if (boxStartWorld && boxCurrentWorld) {
          selectSingleOrBox(boxStartWorld.x, boxStartWorld.y, boxCurrentWorld.x, boxCurrentWorld.y);
        }
        boxStartWorld = null;
        boxCurrentWorld = null;
        renderWorld();
      }
    }

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = worldViewport.getBoundingClientRect();
      zoomBy(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-card').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.tool === tool);
      });

      const cropBar = document.getElementById('cropSelectorBar');
      cropBar.classList.toggle('visible', tool === 'plant');

      const crop = CROPS[selectedCropId];
      const hints = {
        plow: `Arar: ${formatBRL(getPlowCostHa())}/ha (igual p/ todas culturas)`,
        plant: `Plantar ${crop.name}: ${formatBRL(crop.plantCostHa)}/ha`,
        care: `Cuidar: ${formatBRL(getCareCostHa())}/ha (igual p/ todas culturas)`,
        harvest: 'Colher Tudo: colhe todas as lavouras prontas para o Silo'
      };
      document.getElementById('hintBar').textContent = hints[tool] || '';

      if (selectedTileKeys.size > 0 && tool !== 'harvest') {
        prepareAreaActionConfirmation();
      }
    }

    function selectCrop(cropId) {
      selectedCropId = cropId;
      renderCropSelector();
      setTool(currentTool);

    function renderCropSelector() {
      document.getElementById('cropSelectorBar').innerHTML = CROP_LIST.map((c) => `
        <button class="crop-chip ${c.id === selectedCropId ? 'selected' : ''}" onclick="selectCrop('${c.id}')">

          <span>${c.name} (${formatBRL(c.plantCostHa)}/ha)</span>
        </button>
      `).join('');
    }

    function advanceMonth(fromAuto = false) {
      const prevMonth = state.monthIndex;
      state.monthIndex = (state.monthIndex + 1) % 12;
      if (state.monthIndex === 0) {
        state.year += 1;
      }

      const curSeason = getSeasonInfo(state.monthIndex);
      if (!fromAuto) {
        showToast(`Avançou para ${MONTHS[state.monthIndex]} · Ano ${state.year} (${curSeason.name} acaba em ${curSeason.endsMonth})`);
      }

      state.tiles.forEach((tile) => {
        if (tile.state === 'planted' && tile.cropId) {
          const c = CROPS[tile.cropId];
          if (tile.growthMonths < c.monthsToGrow) {
            tile.growthMonths += 1;
          }
        }
      });

      ensureAtLeastOneActivePaddock();
      const paddocksBefore = getPasturePaddocks();
      const activePaddocks = paddocksBefore.filter(p => p.isActive && !p.isDegraded);
      const activeMembers = activePaddocks.flatMap(p => p.members);
      const activeMemberIds = new Set(activeMembers.map(m => m.id));

      state.hectares.forEach(h => {
        if (!h.owned || !h.isPasture) return;
        if (!activeMemberIds.has(h.id)) {
          h.restMonths = (h.restMonths || 0) + 1;
          h.grassLevel = Math.min(100, (h.grassLevel ?? 100) + Math.ceil(100 / PASTURE_REGROWTH_MONTHS));
          if (h.pastureDegraded && h.restMonths >= PASTURE_REGROWTH_MONTHS) {
            h.pastureDegraded = false;
            h.grassLevel = 100;
          }
        }
      });

      if (Array.isArray(state.cattle) && state.cattle.length > 0) {
        const totalUA = getTotalHerdUA();
        const activeAreaHa = activeMembers.length;
        const activeCapacityUA = activeAreaHa * UA_CAPACITY_PER_HA;

        let totalSilageNeeded = 0;
        state.cattle.forEach(a => {
          const spec = LIVESTOCK_TYPES[a.type] || LIVESTOCK_TYPES.boi;
          totalSilageNeeded += spec.silageKgPerMonth * (getAnimalUA(a) / 0.85);
        });

        let silageCoverage = 0;
        if (state.useSilageToSavePasture !== false && (state.silageKg || 0) > 0 && totalSilageNeeded > 0) {
          const usedKg = Math.min(state.silageKg, totalSilageNeeded);
          state.silageKg = +(state.silageKg - usedKg).toFixed(1);
          silageCoverage = Math.min(1, usedKg / totalSilageNeeded);
        }

        let pastureQualityMult = 0.35;
        if (activeAreaHa > 0) {
          const effectiveUAOnPasture = totalUA * (1 - silageCoverage * 0.80);
          const loadRatio = effectiveUAOnPasture / Math.max(0.5, activeCapacityUA);
          const drainPct = Math.max(4, Math.round(18 * loadRatio));

          activeMembers.forEach(m => {
            m.restMonths = 0;
            m.grassLevel = Math.max(0, (m.grassLevel ?? 100) - drainPct);
            if (m.grassLevel <= 0) {
              m.pastureDegraded = true;
              m.pastureActive = false;
              m.restMonths = 0;
            }
          });

          const avgGrass = activeMembers.reduce((s, m) => s + (m.grassLevel ?? 0), 0) / activeAreaHa;
          const basePastureSupport = Math.min(1.05, (activeCapacityUA / Math.max(0.2, totalUA)) * (0.45 + 0.55 * (avgGrass / 100)));
          pastureQualityMult = Math.min(1.1, Math.max(0.35, basePastureSupport + silageCoverage * 0.65));

          if (activeMembers.some(m => m.pastureDegraded)) {
            showToast('⚠️ Pasto acabou! Revezar para outro piquete (3 meses p/ rebrotar).');
          }
        } else if (silageCoverage > 0.5) {
          pastureQualityMult = 0.85;
        }

        let milkProducedNow = 0;
        const newbornCalves = [];
        const adultBullsCount = state.cattle.filter(a => a.type === 'boi' && (a.ageMonths || 14) >= 14).length;

        state.cattle.forEach((animal) => {
          const spec = LIVESTOCK_TYPES[animal.type] || LIVESTOCK_TYPES.boi;
          const fedSilage = silageCoverage >= 0.5;
          const gain = (spec.gainBaseMonth + (fedSilage ? spec.gainSilageBonus * silageCoverage : 0)) * pastureQualityMult;
          animal.arrobas = +Math.min(spec.maxArrobas, animal.arrobas + gain).toFixed(2);
          animal.ageMonths = (animal.ageMonths || 12) + 1;

          if (animal.type === 'vaca') {
            const milkMult = (1 + 0.35 * silageCoverage) * pastureQualityMult;
            if ((animal.ageMonths || 24) >= 20) {
              milkProducedNow += spec.milkLitersMonth * milkMult;
            }

            if ((animal.ageMonths || 24) >= 18) {
              if (animal.pregnantMonths && animal.pregnantMonths > 0) {
                animal.pregnantMonths += 1;
                if (animal.pregnantMonths >= 9) {
                  animal.pregnantMonths = 0;
                  animal.monthsSinceCalving = 0;
                  const isFemale = Math.random() < 0.5;
                  newbornCalves.push({
                    id: Date.now() + Math.random(),
                    type: isFemale ? 'vaca' : 'boi',
                    arrobas: 1.3,
                    ageMonths: 0,
                    pregnantMonths: 0,
                    monthsSinceCalving: 12
                  });
                }
              } else {
                animal.monthsSinceCalving = (animal.monthsSinceCalving ?? 12) + 1;
                if (animal.monthsSinceCalving >= 3 && pastureQualityMult >= 0.65) {
                  const conceptionChance = adultBullsCount > 0 ? 0.38 : 0.22;
                  if (Math.random() < conceptionChance) {
                    animal.pregnantMonths = 1;
                  }
                }
              }
            }
          }
        });

        if (newbornCalves.length > 0) {
          state.cattle.push(...newbornCalves);
          showToast(`🐮 Nasceu ${newbornCalves.length} bezerro(s) no rebanho!`);
        }

        if (milkProducedNow > 0) {
          state.milkLiters = +((state.milkLiters || 0) + milkProducedNow).toFixed(1);
        }
      }

      const weathersBySeason = {
        verao: ['Ensolarado', 'Calor & Sol', 'Estiagem Leve', 'Chuva Forte'],
        outono: ['Ameno & Sol', 'Neblina Manhã', 'Chuva Moderada', 'Ensolarado'],
        inverno: ['Frio & Geada', 'Nublado', 'Chuva de Inverno', 'Sol de Inverno'],
        primavera: ['Ameno & Sol', 'Chuva de Primavera', 'Ensolarado', 'Vento Sul']
      };
      const wList = weathersBySeason[curSeason.id] || ['Ensolarado'];
      state.weather = wList[(state.monthIndex + state.year) % wList.length];

      if ((state.bunkerFermentingKg || 0) > 0) {
        state.bunkerReadyKg = +((state.bunkerReadyKg || 0) + state.bunkerFermentingKg).toFixed(1);
        state.bunkerFermentingKg = 0;
      }

      state.tiles.forEach((tile, idx) => {
        if (tile.state === 'planted' && tile.cropId && !tile.weeds) {
          if ((idx + state.monthIndex * 7) % 19 === 0) {
            tile.weeds = true;
          }
        }
      });

      if (Array.isArray(state.cattle) && state.cattle.length > 0) {
        let woolNow = 0;
        let eggsNow = 0;
        state.cattle.forEach((a) => {
          if (a.type === 'ovelha') woolNow += (LIVESTOCK_TYPES.ovelha.woolKgMonth || 2.4);
          if (a.type === 'galinha') eggsNow += (LIVESTOCK_TYPES.galinha.eggsMonth || 24);
        });
        if (woolNow > 0) state.woolKg = +((state.woolKg || 0) + woolNow).toFixed(1);
        if (eggsNow > 0) state.eggsCount = Math.round((state.eggsCount || 0) + eggsNow);
      }

      if (state.hiredWorkerActive) {
        const workerWage = 1200;
        if (state.money >= workerWage) {
          state.money -= workerWage;
          let caredCount = 0;
          state.tiles.forEach((t) => {
            if (t.state === 'planted' && t.cropId && !t.cared && caredCount < 32) {
              const c = CROPS[t.cropId];
              t.cared = true;
              t.weeds = false;
              t.growthMonths = Math.min(c.monthsToGrow, t.growthMonths + 1);
              caredCount++;
            }
          });
        }
      }

      if (state.activeContract) {
        state.money += state.activeContract.reward;
        const doneMsg = `Contrato "${state.activeContract.title}" concluído! Recebeu ${formatBRL(state.activeContract.reward)}.`;
        state.activeContract = null;
        showToast(doneMsg);
      }

      updateHUD();
      if (selectedTileKeys.size > 0 && currentTool !== 'harvest') {
        prepareAreaActionConfirmation();
      }
      renderWorld();
    }
